  <section id="summary">
    <h2 class="section-title">1. Executive Summary</h2>
    <p class="lead">Korea is in the middle of one of the largest AI and semiconductor investment cycles in the world, and every major local IT-services rival is already positioned to capture it. Tenarai is not &mdash; we hold no legal entity, no office, and no client of record in Korea today. This brief makes the case that establishing a Korea subsidiary is not a growth option among several; it is the minimum condition for participating in a market this large.</p>
    <div class="stat-row">
      <div class="stat-card"><div class="n">$950B</div><div class="l">Korea's new national AI &amp; semiconductor investment wave (2026)</div></div>
      <div class="stat-card"><div class="n">$2.3B</div><div class="l">Projected Korea enterprise GenAI market by 2033, up from $130M in 2025</div></div>
      <div class="stat-card"><div class="n">0</div><div class="l">Tenarai legal entities, offices, or booked clients in Korea today</div></div>
    </div>
    <ul class="brief">
      <li>Three global IT-services competitors &mdash; Wipro (present since 2002, 250+ local staff), FPT (since 2016, 300+ local staff), and Infosys (since 2010) &mdash; are already operating in Korea. Their presence validates the market; it also means every quarter we wait is a quarter they compound their local relationships. <span class="tag">[Confirmed / Section 3]</span></li>
      <li>Korea's structural AI/IT talent shortage (thousands to ~10,000 unfilled roles, per SPRi) mirrors the gap that FPT's Vietnam delivery model has profitably filled &mdash; Tenarai's 3,374-engineer India delivery hub is built for exactly this kind of arbitrage. <span class="tag">[Confirmed / Section 2]</span></li>
      <li>Without a legal entity, Tenarai cannot legally contract, invoice, or register as a vendor with any Korean enterprise &mdash; we are not &ldquo;under-competing,&rdquo; we are structurally ineligible to compete at all. <span class="tag">[Confirmed / Section 5]</span></li>
      <li>Recommendation: approve formation of a Korea subsidiary (foreign-invested entity), targeting telecom, retail/CPG, insurance, and healthcare &mdash; the four verticals where Tenarai's existing capability set most directly overlaps Korean enterprise demand. <span class="tag">[Section 7]</span></li>
    </ul>
  </section>

  <section id="why-now">
    <h2 class="section-title">2. Why Korea, Why Now</h2>

    <h3 class="sub-title">2.1 A national-scale AI investment cycle</h3>
    <ul class="brief">
      <li>In June 2026, the Korean government, Samsung Electronics, and SK Group jointly announced three &ldquo;mega-projects&rdquo; spanning semiconductors, physical AI, and AI data centers, alongside $950B in new AI initiatives. Samsung and SK separately committed up to $880B in chip and AI infrastructure spend over the next decade. <span class="tag">[Confirmed / Reuters, Bloomberg, Yahoo Finance, 2026-06-28~29]</span></li>
      <li>Hyundai Motor Group, Samsung Group, and SK Group have each pledged large domestic capex through 2030 (Hyundai alone: KRW 125 trillion) &mdash; much of it tied to AI and software transformation, not just hardware. <span class="tag">[Confirmed / KED Global, 2026-11-16]</span></li>
    </ul>

    <h3 class="sub-title">2.2 A fast-growing enterprise AI services market</h3>
    <ul class="brief">
      <li>Korea's enterprise generative-AI market is forecast to grow from $130M (2025) to $2.33B (2033) &mdash; roughly 18x, at a ~40% CAGR. <span class="tag">[Confirmed / Grand View Research, 2026]</span></li>
      <li>IDC forecasts Asia-Pacific IT spend growing 7% to $1.123T in 2026, with 66% of APJ CEOs expecting to restructure their business model around AI within 3&ndash;5 years. <span class="tag">[Confirmed / IDC FutureScape 2026]</span></li>
      <li>Samsung SDS signed Korea's first enterprise reseller partnership with OpenAI (Dec 2025) and a strategic partnership with Anthropic (2026) &mdash; direct evidence that Korea's largest enterprises are now buying AI capability from outside global vendors, not building everything in-house. <span class="tag">[Confirmed / Samsung SDS, Korea JoongAng Daily]</span></li>
    </ul>

    <h3 class="sub-title">2.3 A structural talent gap that favors our delivery model</h3>
    <ul class="brief">
      <li>Korea's AI workforce grew from roughly 200,000 to 500,000 people between 2020 and 2024, yet employers still report a talent shortfall above 7%, with thousands to roughly 10,000 open roles unfilled at any time. The Bank of Korea separately estimates the domestic AI workforce at only the mid-50,000s. <span class="tag">[Confirmed / SPRi, Maeil Business, 2026-03-24]</span></li>
      <li>Korea ranks only 35th globally in attractiveness to foreign tech talent, and the government launched a new &ldquo;K-Core visa&rdquo; in 2026 specifically to import skilled workers &mdash; local hiring alone will not close the gap. This is precisely the constraint that an offshore delivery hub is built to relieve. <span class="tag">[Confirmed / SPRi, Dong-A Ilbo, 2026-03-03~04]</span></li>
    </ul>
    <div class="opportunity">Bottom line: the market, the capital, and the talent gap are all moving in Tenarai's favor at the same time. The only missing input is a legal entity to act on it.</div>
  </section>

  <section id="landscape">
    <h2 class="section-title">3. Competitive Landscape: Three Rivals, Zero Us</h2>
    <p class="lead">Three global IT-services firms already operate in Korea. Each validates a different slice of the opportunity &mdash; and each carries weaknesses Tenarai's model is built to exploit, if we can get in the room.</p>
    <div class="table-wrap"><table>
      <thead><tr><th></th><th>FPT Software Korea</th><th>Infosys Korea</th><th>Wipro Korea</th><th>Tenarai (today)</th></tr></thead>
      <tbody>
        <tr><td>Korea presence</td><td>Since 2016 (FDI entity)</td><td>Since 2010 (branch)</td><td>Since 2002 (sales office)</td><td>None &mdash; no entity</td></tr>
        <tr><td>Local headcount</td><td>300+ local + 2,500+ Vietnam remote</td><td>5 registered (likely understated)</td><td>250+, 25% locally hired</td><td>0</td></tr>
        <tr><td>Delivery model</td><td>Vietnam GDC (offshore remote engineers)</td><td>India offshore (est.)</td><td>India + local blend</td><td>India hub (3,374 engineers), unused in Korea</td></tr>
        <tr><td>AI positioning</td><td>AI as one service line among many</td><td>Limited public information</td><td>&ldquo;AI-first&rdquo; messaging on a large legacy-SI base</td><td>AI-native brand identity end to end (unproven at scale)</td></tr>
        <tr><td>Core industries</td><td>Automotive embedded, financial services</td><td>Data/consulting via global partnerships</td><td>Telecom, manufacturing, engineering &amp; construction, automotive SDV (via 2026 HARMAN DTS acquisition)</td><td>Retail/CPG, insurance, healthcare, telecom (per our own six core sectors)</td></tr>
      </tbody>
    </table></div>
    <p class="note">Wipro's registered headcount and tenure were confirmed directly against wipro.com/en-KR &mdash; a meaningful correction from earlier drafts of this research, which cited a stale 5-person registration figure. Infosys's &ldquo;5 registered&rdquo; may carry the same reporting gap; treat as uncertain pending a refresh.</p>

    <h3 class="sub-title">3.1 What their presence proves</h3>
    <ul class="brief">
      <li>Wipro has sustained a Korea office for over two decades and expanded it again in March 2026 with a new Seoul Innovation Center, built around the HARMAN DTS acquisition (software-defined vehicles, smart manufacturing, supply chain). A rival does not double down on a market for 20+ years unless the unit economics work. <span class="tag">[Confirmed / wipro.com, Finance Today, 2026-03-24]</span></li>
      <li>FPT built its entire Korea strategy around solving the same talent shortage described in Section 2 &mdash; remote Vietnamese engineers standing in for scarce local developers. It is a working proof of concept for the exact arbitrage our India hub can run. <span class="tag">[Confirmed / fptsoftware.kr, 2026]</span></li>
    </ul>
    <h3 class="sub-title">3.2 What their presence does not prove</h3>
    <ul class="brief">
      <li>None of the three positions itself as an AI-native company the way Tenarai's rebrand does &mdash; they are systems integrators that have layered AI on top of legacy delivery organizations. That is a real opening, but it is a thesis, not a demonstrated result, since it rests on our own marketing claims rather than third-party validation. <span class="tag">[Uncertain / self-reported positioning]</span></li>
      <li>None of the three publicly discloses Korea-specific revenue, so market-share sizing beyond headcount and vertical focus is not yet possible from public sources. <span class="tag">[Unknown / requires DART or audited filings]</span></li>
    </ul>
  </section>

  <section id="edge">
    <h2 class="section-title">4. Our Competitive Edge &mdash; If We Enter</h2>
    <p class="lead">Three things compound in Tenarai's favor if a Korea entity is in place: an AI-native architecture our competitors don't share, an India cost structure that mirrors an already-proven playbook, and a vertical footprint that lines up with large slices of Korean enterprise demand.</p>

    <h3 class="sub-title">4.1 AI-native architecture, not legacy SI plus AI</h3>
    <ul class="brief"><li>Tenarai-IGNIS (agent orchestration) and Hybrid Agentic PODs (AI-agent-staffed delivery teams) are built into the company's core identity post-rebrand, rather than bolted onto a traditional systems-integration business the way FPT, Infosys, and Wipro have done. That is a structural, not cosmetic, difference in how projects get delivered. <span class="tag">[Uncertain / based on self-reported positioning, no third-party benchmark]</span></li></ul>

    <h3 class="sub-title">4.2 India delivery hub &mdash; a cost structure with a proven precedent</h3>
    <ul class="brief"><li>Our 3,374-engineer India delivery hub (Noida, Gurgaon, Mumbai, Pune, Bengaluru) can run the same offshore-cost arbitrage that lets FPT undercut incumbents using its Vietnam GDC model &mdash; directly addressing the talent shortage described in Section 2.3. This is a cost advantage, not a brand advantage, and the two should not be conflated when this plan is evaluated. <span class="tag">[Estimated / structural analogy to FPT's delivery model]</span></li></ul>

    <h3 class="sub-title">4.3 Vertical fit with Korean enterprise demand</h3>
    <ul class="brief">
      <li>Tenarai's six core industries &mdash; technology, retail/CPG, travel, insurance, healthcare, and telecom &mdash; overlap substantially with Korea's three major telcos (SKT, KT, LG U+), large retail groups (Lotte, Shinsegae, Coupang), major insurers (Samsung Life and peers), and a sizable healthcare sector. <span class="tag">[Confirmed / cross-referenced against Korean industry structure]</span></li>
      <li>Semiconductors and automotive manufacturing &mdash; the two largest components of Korea's $950B investment wave &mdash; are not among Tenarai's stated core industries, and Wipro's HARMAN DTS acquisition already gives it a head start there. This is a real gap, not a marketing footnote, and it should shape which accounts we target first rather than being treated as solved by entity formation alone. <span class="tag">[Confirmed / cross-referenced against Section 2.1 and 3]</span></li>
      <li>Tenarai already serves a portfolio of U.S. and European Fortune 500 accounts. Whether any of them operate a Korea business unit that could become an early reference account has not yet been checked against our own client list &mdash; this is the single fastest, lowest-cost validation step available before formal entity formation. <span class="tag">[Unknown / requires internal account-list review]</span></li>
    </ul>
  </section>

  <section id="entity">
    <h2 class="section-title">5. Why a Legal Entity Is the Prerequisite</h2>
    <h3 class="sub-title">5.1 Three ways to operate in Korea &mdash; only one lets us sell</h3>
    <div class="table-wrap"><table>
      <thead><tr><th></th><th>Liaison office</th><th>Branch</th><th>Subsidiary (FDI entity)</th></tr></thead>
      <tbody>
        <tr><td>Can contract / invoice / book revenue</td><td>No</td><td>Yes</td><td>Yes</td></tr>
        <tr><td>Legal status</td><td>Extension of HQ, no separate entity</td><td>Extension of HQ, taxed like a domestic entity</td><td>Independent Korean corporation</td></tr>
        <tr><td>Minimum capital</td><td>N/A (activity is restricted by design)</td><td>None specified</td><td>~$75,000 USD (KRW 100M) + 10%+ ownership</td></tr>
        <tr><td>Can register as an enterprise vendor</td><td>No</td><td>Yes</td><td>Yes &mdash; the standard, expected form</td></tr>
        <tr><td>HQ liability exposure</td><td>N/A</td><td>Unlimited &mdash; HQ is directly on the hook</td><td>Limited to invested capital</td></tr>
      </tbody>
    </table></div>
    <p class="note">Compiled from general legal/tax guidance on foreign entity formation in Korea; confirm current statutory detail with Korean counsel before filing. USD figure is an approximate conversion and should be re-verified at filing time.</p>

    <h3 class="sub-title">5.2 The gate, not a growth lever</h3>
    <ul class="brief">
      <li>A liaison office can conduct market research and brand-building only &mdash; it cannot sign a contract or issue a Korean tax invoice. In practice, that means it cannot generate a dollar of revenue. <span class="tag">[Confirmed / legal/tax advisory sources]</span></li>
      <li>Registering as a vendor with a Korean conglomerate (Samsung, SK, Hyundai, etc.) or bidding on public-sector procurement (Korea ON-line E-Procurement System) requires a Korean business registration number &mdash; something only a branch or subsidiary can obtain. <span class="tag">[Confirmed / Korea e-procurement registration rules]</span></li>
      <li>All three incumbent competitors have held branch or subsidiary status for 10 to 20+ years. Every quarter Tenarai delays formation is a quarter without RFP eligibility at all &mdash; this is not a competitiveness gap to close, it is a participation gap. <span class="tag">[Confirmed / Section 3]</span></li>
    </ul>

    <h3 class="sub-title">5.3 Recommended structure: subsidiary, not branch</h3>
    <ul class="brief"><li>The minimum capital bar (~$75,000, 10%+ ownership) is not a meaningful barrier at Tenarai's scale. A subsidiary caps HQ's liability at the invested amount, matches the standard vendor-registration form Korean enterprises expect, and gives local leadership a real corporate structure to build around &mdash; branch status offers none of those advantages for a modest cost difference. <span class="tag">[Confirmed / structural comparison, Section 5.1]</span></li></ul>
  </section>

  <section id="risks">
    <h2 class="section-title">6. Risks and How We Address Them</h2>
    <p class="lead">An honest account of what entity formation does not solve by itself &mdash; because a business case that hides its risks is not one HQ can act on with confidence.</p>
    <ul class="brief">
      <li>Zero track record in Korea. Mitigation: prioritize the Fortune 500 account-overlap check (Section 4.3) as the fastest path to a credible first reference; do not lead with a cold-market pitch. <span class="tag">[Confirmed / Sections 3&ndash;4]</span></li>
      <li>Scale disadvantage. Wipro alone employs 230,000+ people worldwide and FPT's parent operates in 32 countries with 28,000+ staff; Tenarai's global headcount is 5,500&ndash;6,157. Mitigation: compete on the four fit verticals (Section 4.3), not head-to-head enterprise-wide. <span class="tag">[Confirmed / Sections 1&ndash;3 headcount data]</span></li>
      <li>Semiconductor and automotive manufacturing &mdash; Korea's largest investment category &mdash; sit outside Tenarai's core verticals, and entity formation does not close that gap on its own. Mitigation: treat this as a deliberately out-of-scope vertical for the initial entry, not a gap to paper over. <span class="tag">[Confirmed / Section 4.3]</span></li>
      <li>Forming the entity creates the legal ability to sell &mdash; it does not, by itself, produce a sales pipeline. Local sales leadership, reference accounts, and brand-building remain separate workstreams that should be scoped alongside entity formation, not treated as automatic outputs of it. <span class="tag">[Confirmed / logical consequence of Sections 4&ndash;5]</span></li>
    </ul>
  </section>

  <section id="recommendation">
    <h2 class="section-title">7. Recommendation</h2>
    <ul class="brief">
      <li>Approve formation of a Korea subsidiary (foreign-invested entity, not a branch) &mdash; the standard structure that caps HQ liability and matches enterprise vendor-registration norms (Section 5.3).</li>
      <li>Target telecom, retail/CPG, insurance, and healthcare as the initial verticals, where Tenarai's existing capability set most directly overlaps Korean enterprise demand &mdash; and explicitly deprioritize semiconductor/automotive manufacturing for phase one (Section 4.3).</li>
      <li>Before or immediately after filing, run an internal review of existing Fortune 500 accounts for any Korea business unit that could become a first reference account (Section 4.3) &mdash; this is the cheapest possible validation step and should not wait for entity formation to complete.</li>
      <li>Treat entity formation as the starting gate, not the finish line &mdash; local sales leadership and reference-account development need to be scoped as a follow-on workstream (Section 6).</li>
    </ul>
    <div class="opportunity">The window is open now: capital, policy tailwinds, and a talent gap are aligned in Tenarai's favor, and three rivals have already proven the market is real. The only input missing is the legal entity that lets us compete for it.</div>
  </section>

  <section id="appendix">
    <h2 class="section-title">Appendix: Sources &amp; Further Diligence</h2>
    <h3 class="sub-title">Open questions for further diligence</h3>
    <ul class="brief">
      <li>Confirm current statutory capital/ownership requirements and realistic filing timeline with Korean counsel.</li>
      <li>Refresh Infosys Korea's headcount figure &mdash; the public &ldquo;5 registered&rdquo; figure may be as stale as Wipro's was.</li>
      <li>Run an internal cross-check of existing Fortune 500 clients for any Korea business unit &mdash; fastest path to a first reference account.</li>
      <li>Confirm scope and completion timeline of Wipro's HARMAN DTS acquisition, including Korea-specific headcount allocation.</li>
      <li>Obtain FPT, Infosys, and Wipro Korea-specific revenue via DART (Korea's public disclosure system) or audited filings, if available.</li>
    </ul>
    <h3 class="sub-title">Sources</h3>
    <ul class="brief">
      <li>Reuters, Bloomberg, Yahoo Finance, KED Global (Jun&ndash;Nov 2026) &mdash; Samsung/SK/Hyundai AI and semiconductor investment announcements.</li>
      <li>Grand View Research &mdash; South Korea Enterprise Generative AI Market Size &amp; Outlook, 2033.</li>
      <li>IDC FutureScape 2026 Asia/Pacific Predictions.</li>

      <li>Korea JoongAng Daily &mdash; Samsung SDS partnerships with OpenAI and Anthropic.</li>
      <li>wipro.com/en-KR/overview &mdash; official Wipro Korea presence data.</li>
      <li>Job platforms (JobKorea, Incruit), FPT Korea LinkedIn, Finance Today, Wipro Newsroom &mdash; competitor Korea operations.</li>
      <li>Korea ON-line E-Procurement System (law.go.kr) &mdash; vendor registration requirements.</li>
      <li>General legal/tax advisory sources on foreign entity formation in Korea (subsidiary vs. branch vs. liaison office) &mdash; verify with counsel before acting.</li>
    </ul>

  <p class="eyebrow">TENARAI CORPORATION · KOREA ENTITY</p>
  <p class="note" style="margin:0 0 34px;">August 2026 · v1 · Internal review</p>
  <h1 class="doc serif">Establishing a Korean Subsidiary<br>&amp; Five-Year Investment Plan</h1>
  <p class="lead">Prepared on the assumption that Tenarai Corporation (Los Gatos, CA) will establish a wholly-owned subsidiary in South Korea. Covers entity type, incorporation procedure, required documents, setup costs, and the five-year funding requirement.</p>

  <p class="fx">All figures converted at <b>USD 1 = KRW 1,430</b> (4 Aug 2026). Source data is denominated in Korean won; statutory thresholds are stated in KRW because that is their legal unit.</p>

  <div class="bento b3">
    <div class="card"><div class="k">Five-year cumulative requirement (base case)</div><div class="v big serif rust">$1.81M</div><div class="s">₩2,582.6M · assumes 20% annual cost escalation</div></div>
    <div class="card"><div class="k">Year 1 requirement</div><div class="v serif">$280.7K</div><div class="s">₩401.4M</div></div>
    <div class="card"><div class="k">Setup cost</div><div class="v serif">$43.9K</div><div class="s">incl. office deposit &amp; equipment</div></div>
  </div>
  <div class="bento b2">
    <div class="card"><div class="k">Recommended initial funding (24-month runway)</div><div class="v serif olive">$564.9K</div><div class="s">setup cost + two years of operating expense</div></div>
    <div class="card"><div class="k">Time to incorporate / FDI registration deadline</div><div class="v serif" style="font-size:23px;">approx. 2–3 months / within 60 days</div><div class="s">Foreign Investment Promotion Act art. 21(1) · filed with KOTRA or a foreign exchange bank</div></div>
  </div>

  <section>
    <p class="eyebrow">01 · SUMMARY</p>
    <h2 class="serif">Key conclusions</h2>
    <ul>
      <li>The plan assumes a <strong>locally incorporated subsidiary (jusik hoesa, a Korean joint-stock company)</strong>. Under the Enforcement Decree of the Foreign Investment Promotion Act art. 2(2), investment qualifies as foreign direct investment only if it is at least <strong>KRW 100 million (approx. $69,930)</strong> and confers at least 10% of voting shares.</li>
      <li>Setup cost is estimated at <strong class="rust">$43,944</strong> (including a $34,965 office deposit and $4,895 in equipment). The source material assumed roughly $1,399 in incorporation-related fees; that understates the cost for a Seoul-based entity, because it omits the threefold surcharge on registration license tax that applies inside the Seoul metropolitan concentration control region.</li>
      <li>The five-year cumulative requirement is <strong class="rust">$1,805,993 ($1.81M)</strong> under the base case, which escalates payroll, office and other operating costs by 20% per year.</li>
      <li>In practice the full five years are not funded up front. We recommend securing a <strong>24-month runway of $564,867 ($564.9K)</strong> as the initial capital injection, with funding from year 3 onward gated on headquarters approval against year 1–2 performance.</li>
      <li>These figures are <strong>gross cost — no revenue is netted off</strong>. Once the subsidiary books revenue, the actual net cash injection required will be lower.</li>
    </ul>
  </section>

  <section>
    <p class="eyebrow">02 · ENTITY TYPE</p>
    <h2 class="serif">Choosing the entity type</h2>
    <p>A foreign company can hold a presence in Korea in three ways, and they differ materially in tax status, legal standing and how they are funded. If the entity is to conduct sales and book revenue, a local subsidiary is effectively the only viable option.</p>
    <div class="tw"><table class="ctr">
      <thead><tr><th></th><th>Local subsidiary</th><th>Branch office</th><th>Liaison office</th></tr></thead>
      <tbody>
        <tr><td>Governing law</td><td>Foreign Investment Promotion Act + Commercial Act</td><td>Foreign Exchange Transactions Act</td><td>Foreign Exchange Transactions Act</td></tr>
        <tr><td>Legal status</td><td>Korean legal entity (separate personality)</td><td>Same legal entity as HQ</td><td>Same legal entity as HQ</td></tr>
        <tr><td>May book revenue</td><td>Yes</td><td>Yes</td><td>No — non-commercial activity only</td></tr>
        <tr><td>Minimum investment</td><td>KRW 100 million</td><td>None</td><td>None</td></tr>
        <tr><td>FDI company registration</td><td>Required</td><td>Not applicable</td><td>Not applicable</td></tr>
        <tr><td>D-8 investor visa</td><td>Available</td><td>Limited</td><td>Not available</td></tr>
        <tr><td>HQ liability exposure</td><td>Limited to capital contributed</td><td>Unlimited</td><td>Unlimited</td></tr>
      </tbody></table></div>
    <p class="note">All figures in this report assume a <strong>local subsidiary</strong>.</p>
  </section>

  <section>
    <p class="eyebrow">03 · PROCESS</p>
    <h2 class="serif">Procedure and timeline</h2>
    <p>An entity funded by a foreign investor follows the standard Korean incorporation process plus two additional steps: the foreign investment notification at the front and the FDI company registration at the end. Including document preparation, allow approximately two to three months.</p>
    <div class="tw"><table>
      <thead><tr><th>Step</th><th style="text-align:left;">Action</th><th style="text-align:left;">Authority</th><th>Duration</th></tr></thead>
      <tbody>
        <tr><td>1</td><td style="text-align:left;">Foreign investment notification — may be filed before funds move</td><td style="text-align:left;">KOTRA (Invest Korea) or a foreign exchange bank</td><td>same day–1 day</td></tr>
        <tr><td>2</td><td style="text-align:left;">Remittance of investment funds from HQ to a temporary account</td><td style="text-align:left;">Foreign exchange bank</td><td>1–5 days</td></tr>
        <tr><td>3</td><td style="text-align:left;">Incorporation registration — articles of incorporation, director acceptances</td><td style="text-align:left;">Commercial registry office</td><td>1–2 weeks</td></tr>
        <tr><td>4</td><td style="text-align:left;">Corporate establishment filing and business registration</td><td style="text-align:left;">District tax office</td><td>1–2 weeks</td></tr>
        <tr><td>5</td><td style="text-align:left;">Transfer of paid-in capital from temporary to corporate account</td><td style="text-align:left;">Foreign exchange bank</td><td>1–2 days</td></tr>
        <tr><td>6</td><td style="text-align:left;">FDI company registration — within 60 days of completing the investment</td><td style="text-align:left;">Same body that received the notification</td><td>1–2 weeks</td></tr>
      </tbody></table></div>
    <ul style="margin-top:22px;">
      <li><strong class="rust">The 60-day registration deadline is mandatory.</strong> Under Foreign Investment Promotion Act art. 21(1), registration must be filed within 60 days of the triggering event (typically completion of the capital payment). Missing it exposes the company to an administrative fine, and any D-8 visa application slips with it.</li>
      <li>The notification and the registration must go through the same institution — if the notification was filed with KOTRA, register with KOTRA.</li>
      <li>The FDI registration certificate is a prerequisite for the D-8 (corporate investment) visa. If expatriate staff are to be posted, work the staffing schedule backwards from the registration completion date.</li>
    </ul>
  </section>

  <section>
    <p class="eyebrow">04 · DOCUMENTS</p>
    <h2 class="serif">Required documents</h2>
    <h3>Issued in the United States — apostille required</h3>
    <p>The United States is a party to the Apostille Convention, so a state-level apostille replaces consular legalisation. All three documents must be accompanied by a notarised Korean translation.</p>
    <div class="tw"><table class="txt">
      <thead><tr><th>Document</th><th>Form</th><th>Note</th></tr></thead>
      <tbody>
        <tr><td>Proof of corporate existence</td><td>Certificate of Incorporation or Certificate of Good Standing</td><td>Evidences legal name and registered address</td></tr>
        <tr><td>Proof of signing authority</td><td>Certificate of Incumbency or board resolution</td><td>Must match the signatory on the power of attorney</td></tr>
        <tr><td>Power of attorney</td><td>Grants a Korean agent authority to invest and register</td><td>Required if the investor does not travel to Korea</td></tr>
        <tr><td>Signature certificate</td><td>Notarised specimen signature</td><td>Substitutes for the Korean seal certificate</td></tr>
      </tbody></table></div>
    <p style="margin-top:20px;"><strong class="rust">The single most common cause of rejection is an inconsistent corporate name.</strong> "Tenarai Inc." and "Tenarai, Inc." — a difference of one comma — will draw a correction order from the registry office. Reconcile the legal name character by character across the US documents, the articles of incorporation and the notification form <em>before</em> the apostille is obtained; re-notarisation adds another two to three weeks.</p>

    <h3>Prepared in Korea</h3>
    <ul>
      <li>Foreign investment notification form</li>
      <li>Articles of incorporation — <strong>notarisation is waived where paid-in capital is under KRW 1 billion and the company is formed by promoter incorporation</strong> (Commercial Act art. 292, proviso)</li>
      <li>Director acceptance letters and seal or signature certificates</li>
      <li>Office lease agreement — required for business registration</li>
      <li>Foreign currency purchase / deposit certificate evidencing the inbound remittance</li>
      <li>Shareholder register</li>
      <li>Corporate seal registration and seal card issuance</li>
    </ul>
    <p class="note">Begin preparing the US documents at least one to two months before the target incorporation date, to absorb apostille and translation lead time.</p>
  </section>

  <section>
    <p class="eyebrow">05 · SETUP COST</p>
    <h2 class="serif">Setup cost</h2>
    <h3>Public charges by capital level</h3>
    <p>Registration license tax is 0.4% of paid-in capital — but <strong>incorporating inside the Seoul metropolitan concentration control region (which includes all of Seoul) triples it to 1.2%</strong>. Local education tax is 20% of the registration license tax and therefore triples with it. The choice of office location has a direct effect on setup cost.</p>
    <div class="tw"><table>
      <thead><tr><th>Paid-in capital</th><th style="text-align:left;">Location</th><th>Registration license tax</th><th>Local education tax</th><th>Total</th></tr></thead>
      <tbody>
        <tr><td>KRW 100M ($69.9K)</td><td style="text-align:left;">Seoul (1.2%)</td><td>$839</td><td>$168</td><td>$1,007</td></tr>
        <tr><td>KRW 100M ($69.9K)</td><td style="text-align:left;">Outside the region (0.4%)</td><td>$280</td><td>$56</td><td>$336</td></tr>
        <tr><td>KRW 300M ($209.8K)</td><td style="text-align:left;">Seoul (1.2%)</td><td>$2,517</td><td>$503</td><td>$3,021</td></tr>
        <tr><td>KRW 300M ($209.8K)</td><td style="text-align:left;">Outside the region (0.4%)</td><td>$839</td><td>$168</td><td>$1,007</td></tr>
        <tr><td>KRW 500M ($349.6K)</td><td style="text-align:left;">Seoul (1.2%)</td><td>$4,196</td><td>$839</td><td>$5,035</td></tr>
        <tr><td>KRW 500M ($349.6K)</td><td style="text-align:left;">Outside the region (0.4%)</td><td>$1,399</td><td>$280</td><td>$1,678</td></tr>
      </tbody></table></div>
    <p class="note">Minimum registration license tax is KRW 112,500 (KRW 337,500 inside the control region).</p>

    <h3>Total setup cost — assuming KRW 300M capital and a Seoul office</h3>
    <div class="tw"><table>
      <thead><tr><th>Item</th><th>Amount</th><th style="text-align:left;">Basis</th></tr></thead>
      <tbody>
        <tr><td>Office security deposit</td><td>$34,965</td><td style="text-align:left;">per source data (refundable asset)</td></tr>
        <tr><td>Office equipment and fit-out</td><td>$4,895</td><td style="text-align:left;">per source data</td></tr>
        <tr><td>Registration license tax + local education tax</td><td>$3,021</td><td style="text-align:left;">KRW 300M × 1.2%, plus 20%</td></tr>
        <tr><td>Court registration filing fee</td><td>$14</td><td style="text-align:left;">KRW 20,000, electronic filing</td></tr>
        <tr><td>Judicial scrivener fee</td><td>$559</td><td style="text-align:left;">typical range KRW 300k–800k; upper end applied for a foreign-shareholder filing</td></tr>
        <tr><td>Apostille and certified translation</td><td>$420</td><td style="text-align:left;">estimate for three documents [to be confirmed]</td></tr>

      <li>Two sales staff assumed — general sales expense of KRW 300k per head per month.</li>
      <li>The KRW 5 million monthly "statutory and administrative costs" line is taken to already include the employer share of the four social insurances, retirement pension accrual and bookkeeping fees, so no separate severance line is carried.</li>
      <li>Country manager / expatriate salary is excluded (nil), consistent with the source data — see risk 3 below.</li>
      <li>Setup cost falls in year 1 only. The office security deposit is a recoverable asset and is treated as a cash requirement, not an expense.</li>
      <li>No revenue is netted off; these are gross costs.</li>
    </ul>

  <section>
    <p class="eyebrow">07 · RISKS</p>
    <h2 class="serif">Financial implications and open points</h2>

    <h3>1. The five years are not funded in one tranche</h3>
    <p>A new entity is normally funded to a runway of 18–24 months, until revenue stabilises. On a 24-month basis the requirement is <strong class="olive">$564,867 ($564.9K)</strong>. Funding from year 3 onward is more realistically gated on headquarters approval against year 1–2 results.</p>

    <h3>2. Paid-in capital and working capital are separate questions</h3>
    <p>The statutory FDI minimum is KRW 100 million, but a thinly capitalised entity fares poorly in D-8 visa assessment and in counterparty credit checks. Conversely, higher capital increases the 1.2% registration license tax proportionally. Starting at around KRW 300 million and funding the balance through an HQ loan or a later capital increase is worth considering.</p>

    <h3>3. A nil country-manager salary is a credibility risk</h3>
    <p>A business plan showing zero compensation for the country manager invites questions about sustainability at investment-committee review. Adding a minimum expatriate salary line (on the order of KRW 50–60 million a year) would raise the five-year total by roughly $286,217 under the base case (a KRW 55M base escalated at 20%). This report preserves the original assumption, but the figure should be included in any version circulated outside the company.</p>

    <h3>4. State what the 20% escalation actually represents</h3>
    <p>Raising payroll 20% a year means adding people, not raising salaries. Year 5 payroll of $311,762 cannot be explained by the initial three-person team, so the plan needs an accompanying headcount schedule — otherwise headquarters will ask for the derivation.</p>

    <h3>5. Sales costs scale non-linearly</h3>
    <p>Once senior sales staff on six-figure packages start producing, corporate card, entertainment and petty cash spend will substantially exceed the KRW 300k per month assumption. Without a separately designed incentive pool, the sales cost line is where the budget breaks first.</p>

    <h3>6. Open points</h3>

<!-- ============ 01 ============ -->
<div class="tile" id="s1">
  <div class="wrap">
    <p class="eyebrow">01 · Business Model</p>
    <h2>Business model and<br>what applies in Korea</h2>
    <p class="lead">Tenarai's six solutions were scored against Korean demand certainty and competitive intensity. Two of them carry the entry.</p>

    <h3>1-1. Korea fit by solution</h3>
    <div class="tw"><table class="txt">
      <caption>Scored on three axes — demand certainty, competitive intensity, and Tenarai's relative advantage</caption>
      <thead><tr>
        <th style="width:20%;">Solution</th><th style="width:21%;">Application in Korea</th>
        <th style="width:11%;">Fit</th><th style="width:48%;">Basis</th>
      </tr></thead>
      <tbody>
        <tr>
          <td><strong>Tenarai-Archer</strong><br><span class="micro">Legacy data infrastructure modernisation</span></td>
          <td>Bank and insurance core-system replacement; public-sector information systems</td>
          <td><span class="rate">●●●●●</span></td>
          <td>Korean financial-sector large IT tenders across 2026–2027 are estimated at <strong>over KRW 2 trillion (USD 1.40B)</strong>. NH Nonghyup Bank's core-banking phase 1 alone was tendered at KRW 305.5B (USD 213.6M) — the largest single financial IT project in Korean history. The demand is already in published tenders; no market creation is required. <span class="micro">[1]</span></td>
        </tr>
        <tr>
          <td><strong>Hybrid Agentic PODs</strong><br><span class="micro">AI-agent-based delivery teams</span></td>
          <td>Substituting for scarce enterprise IT talent; managed development capacity</td>
          <td><span class="rate">●●●●●</span></td>
          <td>Korean universities produce 22,000–25,000 IT graduates a year while demand in AI, 5G, blockchain and automation runs far ahead of supply. FPT has already proven this demand with its Vietnam GDC model; Tenarai can reproduce the same structure from its 3,374-strong India delivery hub. <span class="micro">[2][9]</span></td>
        </tr>
        <tr>
          <td><strong>Demand Forecasting with AI</strong><br><span class="micro">Forecasting, pricing, inventory</span></td>
          <td>Retail majors, manufacturing SCM, e-commerce</td>
          <td><span class="rate">●●●●<span class="off">●</span></span></td>
          <td>Korea's Ministry of Science and ICT projects manufacturing to contribute KRW 77T (USD 53.8B) of annual AI-driven economic effect. Demand is large but Korean majors often hold in-house data teams, so partner co-sell beats direct pursuit. <span class="micro">[3]</span></td>
        </tr>
        <tr>
          <td><strong>AI Content Transformation</strong><br><span class="micro">Marketing content automation</span></td>
          <td>Retail/CPG and telco marketing organisations</td>
          <td><span class="rate">●●●<span class="off">●●</span></span></td>
          <td>55.7% of Korean enterprises already use generative AI and 35.1% of large enterprises use it company-wide. Adoption is broad but contract values are low and local agencies and SaaS compete hard. Treat as a land-and-expand item inside Archer/PODs accounts rather than a standalone entry. <span class="micro">[4]</span></td>
        </tr>
        <tr>
          <td><strong>AI Enabling e-Commerce Platforms</strong><br><span class="micro">Commerce content automation and migration</span></td>
          <td>Top-tier e-commerce operators, brand DTC sites</td>
          <td><span class="rate">●●●<span class="off">●●</span></span></td>
          <td>Korea's leading commerce operators build in-house, leaving little vendor room. Viable only if narrowed to mid-market brand DTC and export-expansion support. <span class="tagbad">competitive disadvantage</span></td>
        </tr>
        <tr>
          <td><strong>Tenarai-IGNIS</strong><br><span class="micro">Agent orchestration platform</span></td>
          <td>Enterprise-wide AI platforms</td>
          <td><span class="rate">●●<span class="off">●●●</span></span></td>
          <td>Samsung SDS, LG CNS and SK AX all attack this space with proprietary platforms (Q3 2025 revenue of USD 2.37B, USD 1.06B and USD 465M respectively). Selling a platform is not a viable opening move for an entity with zero local track record. <span class="tagbad">competitive disadvantage</span> <span class="micro">[5]</span></td>
        </tr>
      </tbody>
    </table></div>
    <p class="fine" style="margin-top:14px;">Fit scores are <strong>this document's own assessment</strong> on a five-point scale across the three axes named above. They are not an external index.</p>

    <h3>1-2. Entry priority — concentrate on two</h3>
    <div class="callout">
      <p class="t">Priority 1: Tenarai-Archer + Hybrid Agentic PODs</p>
      <p>Together the two form a single proposition — <strong>"we modernise the legacy estate, and we supply the AI-agent team that does the work."</strong> This addresses the two demand pools that exist only in Korea (USD 1.40B of committed financial modernisation spend plus a structural talent shortage) and stakes a position that does not collide head-on with the Korean SI majors.</p>
    </div>
    <p>Priority 2, Demand Forecasting, runs through partner co-sell (Databricks, Google Cloud, Salesforce Korea). Priority 3, Content and e-Commerce, is an expansion item inside won accounts. <strong>Standalone IGNIS platform sales are deferred beyond Year 5.</strong></p>

    <h3>1-3. Division of responsibility</h3>
    <div class="tw"><table class="txt">
      <thead><tr><th style="width:26%;">Function</th><th style="width:37%;">Korea entity (new)</th><th style="width:37%;">HQ / India delivery hub</th></tr></thead>
      <tbody>
        <tr><td>Account development</td><td><strong>Owns</strong> — account sales, chaebol vendor registration, RFP response</td><td>Global account introductions</td></tr>
        <tr><td>Solution design and proposal</td><td><strong>Owns</strong> — presales architects, PoC scoping</td><td>Reference architectures, demo assets</td></tr>
        <tr><td>Contracting and revenue recognition</td><td><strong>Owns</strong> — local contracting party, tax invoicing</td><td>Intercompany transfer-pricing agreement</td></tr>
        <tr><td>Engineering and build</td><td>Not performed</td><td><strong>Owns</strong> — Noida, Gurgaon, Mumbai, Pune, Bengaluru</td></tr>
        <tr><td>Project execution</td><td>Client-facing delivery management only</td><td><strong>Owns</strong> — all build and run staff</td></tr>
        <tr><td>Product and platform R&amp;D</td><td>Not performed</td><td><strong>Owns</strong></td></tr>
      </tbody>
    </table></div>
    <p class="fine" style="margin-top:14px;">This split underpins every figure in this document. Because the Korea entity holds no engineering staff, <strong>revenue per head is set far above a typical SI firm</strong> (USD 700K at Year 10) — and the transfer-pricing structure in section 6-1 must be settled first for the plan to hold.</p>
  </div>
</div>

<!-- ============ 02 ============ -->
<div class="tile alt" id="s2">
  <div class="wrap">
    <p class="eyebrow">02 · Market Sizing</p>
    <h2>How large is<br>USD 35M in this market?</h2>
    <p class="lead">A target is credible or not by its share, not its absolute value. USD 35.0M is 0.065% of the Korean IT services market.</p>

    <div class="stats c3">
      <div class="stat"><div class="v">USD 53.6B</div><div class="k">TAM · Korean IT services market, 2030</div><div class="s">KRW 76.7T <span class="micro">[6]</span></div></div>
      <div class="stat"><div class="v">USD 8.0B</div><div class="k">SAM · Tenarai's six verticals + AI/modernisation</div><div class="s">assumed 15% of TAM <span class="tagbad">estimate</span></div></div>
      <div class="stat"><div class="v b">USD 35.0M</div><div class="k">SOM · Year 10 target revenue</div><div class="s">0.43% of SAM · 0.065% of TAM</div></div>
    </div>

    <h3>2-1. The market estimates disagree</h3>
    <p>Research houses scope "IT services" differently, so the Korean figures diverge widely. The conclusion is unchanged whichever is used, so this document works from <strong>the most conservative reading</strong>.</p>
    <div class="tw"><table>
      <thead><tr><th>Source</th><th>2025</th><th>Forecast</th><th>CAGR</th><th>KRW (forecast year)</th></tr></thead>
      <tbody>
        <tr><td>Mordor Intelligence <span class="micro">[6]</span></td><td>USD 29.92B</td><td>USD 53.63B (2030)</td><td>12.38%</td><td class="hi">KRW 76.7T</td></tr>
        <tr><td>Grand View Research <span class="micro">[7]</span></td><td>USD 35.8B</td><td>— (11% to 2033)</td><td>11.0%</td><td>—</td></tr>
        <tr><td>IMARC Group <span class="micro">[8]</span></td><td>USD 23.2B</td><td>USD 43.9B (2034)</td><td>6.6%</td><td>KRW 62.8T</td></tr>
      </tbody>
    </table></div>
    <p class="fine" style="margin-top:14px;">The three 2025 estimates span USD 23.2B to USD 35.8B — a <strong>1.54× spread</strong>. The likely cause is scope (whether hardware maintenance, BPO and telecom services are included), but the underlying methodology documents were not obtained. <span class="tagbad">to be verified</span></p>

    <h3>2-2. Demand already committed — financial-sector modernisation</h3>
    <p>Published tenders are stronger evidence than analyst forecasts. This is Tenarai-Archer's direct target market.</p>
    <div class="tw"><table class="txt">
      <thead><tr><th style="width:28%;">Programme</th><th style="width:22%;">Value</th><th style="width:50%;">Detail</th></tr></thead>
      <tbody>
        <tr><td>Korean financial-sector large IT tenders</td><td class="hi">over USD 1.40B<br><span class="micro">KRW 2T+, 2026–2027</span></td><td>Two-year industry estimate including core-system replacements <span class="micro">[1]</span></td></tr>
        <tr><td>NH Nonghyup Bank "NEO" phase 1</td><td>USD 213.6M<br><span class="micro">KRW 305.5B</span></td><td>LG CNS as prime, 27 months to April 2028. Largest single financial IT project in Korean history <span class="micro">[1]</span></td></tr>
        <tr><td>NH Nonghyup Bank phases 1+2</td><td>USD 420–434M<br><span class="micro">KRW 600–620B</span></td><td>Including the information-systems phase 2 <span class="micro">[1]</span></td></tr>
        <tr><td>Nonghyup Mutual Finance</td><td>undisclosed</td><td>SK AX selected, 25 months to January 2028, serving 1,110 local cooperatives <span class="micro">[1]</span></td></tr>
      </tbody>
    </table></div>
    <div class="callout">
      <p class="t">What this table establishes</p>
      <p>The Year 10 target of USD 35.0M equals <strong>16% of one programme</strong> (NH Nonghyup phase 1) and <strong>2.5%</strong> of two years of financial-sector tendering. The primes on these programmes are the Korean SI majors, however, and a newly incorporated foreign entity is <strong>not realistically going to win prime position</strong> — subcontract and specialist-partner roles are the credible route.</p>
    </div>

    <h3>2-3. Demand-side indicators</h3>
    <div class="stats c4">
      <div class="stat"><div class="v">85%</div><div class="k">Korean enterprises expected to use generative AI in 2026</div><div class="s">55.7% today <span class="micro">[4]</span></div></div>
      <div class="stat"><div class="v">35.1%</div><div class="k">Large enterprises using generative AI company-wide</div><div class="s">2× the SME rate <span class="micro">[4]</span></div></div>
      <div class="stat"><div class="v">74.0%</div><div class="k">Enterprises that increased AI investment year on year</div><div class="s">n = 749 <span class="micro">[4]</span></div></div>
      <div class="stat"><div class="v">USD 217B</div><div class="k">Government forecast of 2026 AI economic effect</div><div class="s">KRW 310T · MSIT <span class="micro">[3]</span></div></div>
    </div>
    <p class="fine" style="margin-top:20px;">Korean enterprise generative-AI market estimates <strong>conflict within a single research house</strong>: Grand View Research publishes both USD 370.6M by 2030 (38.8% CAGR from 2025) and USD 130M in 2025 rising to USD 2,333M in 2033. The two are not reconcilable (the former implies roughly USD 72M in 2025), so neither is used as a sizing basis here — only the IT services figures above. <span class="tagbad">sources conflict</span></p>
  </div>
</div>

    <h3>3-3. Deal tiers and contract structure</h3>
    <p>The same revenue built from different contracts implies a different organisation and a different risk profile. Four tiers are managed.</p>
    <div class="tw"><table class="txt">
      <thead><tr>
        <th style="width:16%;">Tier</th><th style="width:18%;">Average value</th><th style="width:13%;">Term</th>
        <th style="width:19%;">Primary solution</th><th style="width:34%;">Role</th>
      </tr></thead>
      <tbody>
        <tr><td><strong>T1 · PoC / pilot</strong></td><td>USD 21–70K</td><td>2–3 months</td><td>Demand Forecasting, Content</td><td>The objective is a reference, not margin. Treat the cost as buying <strong>one citable case</strong>. Most of Years 1–3 revenue</td></tr>
        <tr><td><strong>T2 · Build project</strong></td><td>USD 210–560K</td><td>6–12 months</td><td>Archer, Agentic PODs</td><td>The production engagement after a successful PoC. The engine of Years 3–6</td></tr>
        <tr><td><strong>T3 · Large build</strong></td><td>USD 700K–1.4M</td><td>12–24 months</td><td>Archer (incl. core-system subcontract)</td><td>Specialist-partner position under a Korean prime. Appears from Year 6</td></tr>
        <tr><td><strong>T4 · Anchor account MSA</strong></td><td>USD 1.75–2.8M / yr</td><td>3–5 years</td><td>Agentic PODs, managed</td><td>The source of revenue predictability. <strong>Two to three of these from Year 8 is the prerequisite for USD 35M</strong></td></tr>
      </tbody>
    </table></div>
    <div class="callout">
      <p class="t">Why growth rebounds at Years 6–7</p>
      <p>Growth falls to 64–67% at Years 4–5 and then rises to 83% and 82% at Years 6–7. This is not an arithmetic artefact — it assumes <strong>T3 and T4 contracts first appear at that point</strong>: one T3 large build (about USD 1.05M) in Year 6 and one T4 anchor account (about USD 2.1M) in Year 8. Without them the band stays near 60% and <strong>Year 10 converges on USD 17–21M rather than USD 35M</strong> (the conservative case in 3-4).</p>
    </div>

    <h2>P&amp;L structure<br>and payback</h2>
    <p class="lead">One decision precedes the revenue plan — <strong>whose income statement does this USD 35M land on?</strong></p>

    <h3>6-1. Settle the transfer-pricing structure first</h3>
    <p>If the Korea entity sells while HQ delivers, the contracting structure determines <strong>the entity's reported revenue itself</strong>. There are two options and the USD 35M target holds under only one of them.</p>
    <div class="tw"><table class="txt">
      <thead><tr><th style="width:22%;">Dimension</th><th style="width:39%;">Principal model</th><th style="width:39%;">Commissionaire / agent model</th></tr></thead>

        <tr><td>Korea entity revenue</td><td><strong>Full contract value</strong> (USD 35.0M at Year 10)</td><td>Commission only, at 8–15% of contract value → <strong>USD 2.8–5.2M</strong></td></tr>
        <tr><td>Cost of revenue</td><td>Intercompany delivery charge (transfer price)</td><td>None</td></tr>
        <tr><td>Permanent establishment risk</td><td>Low — the Korea entity is the taxpayer</td><td><strong>High</strong> — a Korean sales force habitually concluding HQ contracts can create a Korean PE for HQ</td></tr>
        <tr><td>Conglomerate vendor registration</td><td>Favourable — a domestic entity is the counterparty</td><td>Unfavourable — the counterparty is a foreign entity</td></tr>
        <tr><td>USD 35M target holds</td><td><strong>Yes</strong></td><td>No</td></tr>
      </tbody>

      <p class="t">Recommendation</p>
      <p>Every figure in this document assumes the <strong>principal model</strong>. Under a commissionaire model the same commercial performance reports as USD 2.8–5.2M of entity revenue, and the USD 35M target must be redefined as <strong>total contract value originated in Korea</strong> rather than entity revenue. <strong>Settle this with HQ finance and tax before the target is fixed.</strong> Actual transfer-pricing policy must follow the OECD Transfer Pricing Guidelines and Korea's international tax adjustment law, with local tax and legal counsel. <span class="tagbad">to be verified</span></p>

    <h2>Risks and<br>prerequisites</h2>
    <p class="lead">The points where this plan breaks are stated first. A question the committee will ask is better raised by the document than by the room.</p>

    <div class="tw"><table class="txt">
      <thead><tr>
        <th style="width:23%;">Risk</th><th style="width:11%;">Impact</th><th style="width:34%;">Description</th><th style="width:32%;">Mitigation</th>
      </tr></thead>
      <tbody>
        <tr>
          <td><strong>Transfer-pricing structure unsettled</strong></td><td class="hi">Critical</td>
          <td>Under a commissionaire model the entity's revenue is USD 2.8–5.2M and <strong>the USD 35M target does not exist as stated</strong></td>
          <td>Settle the structure with HQ finance and tax first. State in the plan whether the target means entity revenue or originated TCV</td>
        </tr>
        <tr>
          <td><strong>Zero local track record</strong></td><td class="hi">High</td>
          <td>Wipro has been in Korea since 2002 and FPT and Infosys since the 2010s. Where conglomerate vendor screening requires in-country delivery history, <strong>the right to bid does not exist</strong></td>
          <td>Make two citable references by Year 2 the single top KPI, funded through free or at-cost PoCs (4-1)</td>
        </tr>
        <tr>
          <td><strong>No T4 anchor account</strong></td><td class="hi">High</td>
          <td>Without two to three anchor accounts from Year 8, Year 10 converges on <strong>USD 17–21M</strong> rather than USD 35M</td>
          <td>Manage anchor candidates as a separate portfolio from Year 6. Define in advance the decision point at which the target steps down to the conservative case</td>
        </tr>
        <tr>
          <td><strong>Misalignment with Korea's largest investment axis</strong></td><td>Medium</td>
          <td>Semiconductor manufacturing and automotive — Korea's largest IT investment pools — are not among Tenarai's six core industries, and Wipro holds that ground after acquiring HARMAN's DTS division</td>
          <td>Exclude the segment from the plan. Concentrate on financial services, telecom and retail (1-2)</td>
        </tr>
        <tr>
          <td><strong>Technical sales hiring</strong></td><td>Medium</td>
          <td>18 AEs at Year 10 means 18 people able to sell AI and modernisation work in Korea. With a national AI talent shortfall above 7% (SPRi survey), this is hard to hire and expensive when hired <span class="micro">[9]</span></td>
          <td>Start employer branding in Year 3 (4-3). Carry the USD 84K per-head SG&amp;A assumption as a sensitivity, not a fixed input</td>
        </tr>
        <tr>
          <td><strong>Global account succession unverified</strong></td><td>Medium</td>
          <td>10% of Year 10 revenue (USD 3.5M) is attributed to HQ Fortune 500 clients expanding through their Korean subsidiaries, but <strong>no list of such clients with Korean operations has been obtained</strong></td>
          <td>Request the global account footprint from HQ. If unconfirmed, set this channel to zero and raise the direct-sales target</td>
        </tr>
        <tr>
          <td><strong>Prime position on large programmes</strong></td><td>Medium</td>
          <td>Primes on Korean core-system programmes are the domestic SI majors; a newly incorporated foreign entity is not a realistic prime</td>
          <td>Adopt the subcontract and specialist-partner position openly (4-2, 15% of Year 10). Prime wins are not modelled</td>
        </tr>
        <tr>
          <td><strong>Currency</strong></td><td>Low</td>
          <td>USD figures use a KRW 1,430 planning rate. A KRW 1,300–1,600 range moves USD-reported revenue by <strong>±11%</strong></td>
          <td>Report KRW as the governing currency with USD alongside. Reset the planning rate annually</td>
        </tr>
      </tbody>
    </table></div>

    <h3>7-2. Five conditions for this plan to hold</h3>
    <ol>
      <li><strong>Adopt the principal model for transfer pricing.</strong> Until this is settled, the definition of the target itself is open.</li>
      <li><strong>Delivery stays 100% with HQ.</strong> A local engineering organisation changes the headcount and the P&amp;L structure entirely.</li>
      <li><strong>Secure two citable Korean references in Years 1–2.</strong> Without them nothing from Year 3 onward is executable.</li>
      <li><strong>Secure two to three T4 anchor accounts from Year 8.</strong> This is the single variable separating USD 35M from USD 17M.</li>
      <li><strong>Stay inside financial services, telecom and retail.</strong> Extending into semiconductors and automotive means a direct collision with Wipro and a diluted team.</li>
    </ol>

<script>
  function loadFrame(scriptId, frameId) {
    var htmlSrc = document.getElementById(scriptId).textContent;
    var frame = document.getElementById(frameId);
    var doc = frame.contentDocument || frame.contentWindow.document;
    doc.open(); doc.write(htmlSrc); doc.close();
  }
  loadFrame('src-a', 'frame-a');
  loadFrame('src-b', 'frame-b');
  loadFrame('src-c', 'frame-c');

  var tabs = document.querySelectorAll('.tab');
  var panels = document.querySelectorAll('.panel');
  tabs.forEach(function (tab) {
    tab.addEventListener('click', function () {
      tabs.forEach(function (t) { t.classList.remove('active'); t.setAttribute('aria-selected', 'false'); });
      panels.forEach(function (p) { p.classList.remove('active'); });
      tab.classList.add('active'); tab.setAttribute('aria-selected', 'true');
      document.getElementById(tab.dataset.target).classList.add('active');
    });
  });
</script>
