  <section id="summary">
    <h2 class="section-title">1. Executive Summary</h2>
    <p class="lead">Korea is in the middle of one of the largest AI and semiconductor investment cycles in the world, and every major local IT-services rival is already positioned to capture it. Tenarai is not &mdash; we hold no legal entity, no office, and no client of record in Korea today. This brief makes the case that establishing a Korea subsidiary is not a growth option among several; it is the minimum condition for participating in a market this large.</p>
    <div class="stat-row">
      <div class="stat-card"><div class="n">$950B</div><div class="l">Korea's new national AI &amp; semiconductor investment wave (2026)</div></div>
      <div class="stat-card"><div class="n">$2.3B</div><div class="l">Projected Korea enterprise GenAI market by 2033, up from $130M in 2025</div></div>
      <div class="stat-card"><div class="n">0</div><div class="l">Tenarai legal entities, offices, or booked clients in Korea today</div></div>
    </div>
    <ul class="brief">
      <li>Three global IT-services competitors &mdash; Wipro (present since 2002, 250+ local staff), FPT (since 2016, 300+ local staff), and Infosys (since 2010) &mdash; are already operating in Korea. Their presence validates the market; it also means every quarter we wait is a quarter they compound their local relationships. <span class="tag">[Confirmed / Section 3]</span></li>
      <li>Korea's structural AI/IT talent shortage (thousands to ~10,000 unfilled roles, per SPRi) mirrors the gap that FPT's Vietnam delivery model has profitably filled &mdash; Tenarai's 3,374-engineer India delivery hub is built for exactly this kind of arbitrage. <span class="tag">[Confirmed / Section 2]</span></li>
      <li>Korea's AI Basic Act &mdash; in full effect since January 2026 &mdash; requires foreign providers of high-impact or generative AI to designate a domestic representative in Korea. This is a second, independent legal reason, beyond vendor registration, that an AI-native firm needs a Korea entity to sell services here at all. <span class="tag">[Confirmed / Section 2.4]</span></li>
      <li>Without a legal entity, Tenarai cannot legally contract, invoice, or register as a vendor with any Korean enterprise &mdash; we are not &ldquo;under-competing,&rdquo; we are structurally ineligible to compete at all. <span class="tag">[Confirmed / Section 5]</span></li>
      <li>Recommendation: approve formation of a Korea subsidiary (foreign-invested entity), targeting telecom, retail/CPG, insurance, and healthcare &mdash; the four verticals where Tenarai's existing capability set most directly overlaps Korean enterprise demand. <span class="tag">[Section 7]</span></li>
    </ul>
  </section>

  <section id="why-now">
    <h2 class="section-title">2. Why Korea, Why Now</h2>

    <h3 class="sub-title">2.1 A national-scale AI investment cycle</h3>
    <ul class="brief">
      <li>In June 2026, the Korean government, Samsung Electronics, and SK Group jointly announced three &ldquo;mega-projects&rdquo; spanning semiconductors, physical AI, and AI data centers, alongside $950B in new AI initiatives. Samsung and SK separately committed up to $880B in chip and AI infrastructure spend over the next decade. <span class="tag">[Confirmed / Reuters, Bloomberg, Yahoo Finance, 2026-06-28~29]</span></li>
      <li>Hyundai Motor Group, Samsung Group, and SK Group have each pledged large domestic capex through 2030 (Hyundai alone: KRW 125 trillion) &mdash; much of it tied to AI and software transformation, not just hardware. <span class="tag">[Confirmed / KED Global, 2026-11-16]</span></li>
    </ul>

    <h3 class="sub-title">2.2 A fast-growing enterprise AI services market</h3>
    <ul class="brief">
      <li>Korea's enterprise generative-AI market is forecast to grow from $130M (2025) to $2.33B (2033) &mdash; roughly 18x, at a ~40% CAGR. <span class="tag">[Confirmed / Grand View Research, 2026]</span></li>
      <li>IDC forecasts Asia-Pacific IT spend growing 7% to $1.123T in 2026, with 66% of APJ CEOs expecting to restructure their business model around AI within 3&ndash;5 years. <span class="tag">[Confirmed / IDC FutureScape 2026]</span></li>
      <li>Samsung SDS signed Korea's first enterprise reseller partnership with OpenAI (Dec 2025) and a strategic partnership with Anthropic (2026) &mdash; direct evidence that Korea's largest enterprises are now buying AI capability from outside global vendors, not building everything in-house. <span class="tag">[Confirmed / Samsung SDS, Korea JoongAng Daily]</span></li>
    </ul>

    <h3 class="sub-title">2.3 A structural talent gap that favors our delivery model</h3>
    <ul class="brief">
      <li>Korea's AI workforce grew from roughly 200,000 to 500,000 people between 2020 and 2024, yet employers still report a talent shortfall above 7%, with thousands to roughly 10,000 open roles unfilled at any time. The Bank of Korea separately estimates the domestic AI workforce at only the mid-50,000s. <span class="tag">[Confirmed / SPRi, Maeil Business, 2026-03-24]</span></li>
      <li>Korea ranks only 35th globally in attractiveness to foreign tech talent, and the government launched a new &ldquo;K-Core visa&rdquo; in 2026 specifically to import skilled workers &mdash; local hiring alone will not close the gap. This is precisely the constraint that an offshore delivery hub is built to relieve. <span class="tag">[Confirmed / SPRi, Dong-A Ilbo, 2026-03-03~04]</span></li>
    </ul>

    <h3 class="sub-title">2.4 A government-led AI strategy at national scale</h3>
    <ul class="brief">
      <li>President Lee Jae-myung's administration (2025&ndash;2030) has made &ldquo;AI 3-3-5&rdquo; &mdash; top-3 global AI competitiveness (Korea currently ranks 6th&ndash;7th), a 3% potential growth rate, and a top-5 global power &mdash; the top economic priority of its five-year term, operationalized as the &ldquo;National AI Action Plan (2026&ndash;2028)&rdquo;: 3 policy pillars, 12 strategic fields, and 98 detailed tasks, finalized by the presidential National AI Strategy Committee (launched September 2025). <span class="tag">[Confirmed / Edaily, Kyunghyang Shinmun, Boan News, 2025]</span></li>
      <li>Fiscal commitment: a pledged &ldquo;100 trillion KRW (~$72B+) AI investment era&rdquo; over the presidential term, split roughly 50/50 between government and private capital; separately, KRW 210 trillion (~$152B) in total five-year fiscal spending is earmarked for the administration's 123 national tasks. The 2026 government AI budget alone is KRW 9.9 trillion (~$7.2B) &mdash; roughly 3x 2025's KRW 3.3 trillion (~$2.4B) &mdash; with new AI programs accounting for 47.7% of the total. <span class="tag">[Confirmed / Kyunghyang Shinmun 2025.6, Edaily 2025.8, XDNode 2026, Boan News 2025.12]</span></li>
      <li>Korea's AI Basic Act &mdash; the world's second comprehensive national AI law after the EU &mdash; took full effect January 22, 2026, and unlike the EU's phased rollout, Korea applied its entire risk-based framework at once. It requires foreign providers of &ldquo;High-Impact AI&rdquo; (healthcare, finance, mobility, and other systems materially affecting life, safety, or fundamental rights) and generative AI to appoint a domestic representative, alongside new transparency, safety, and AI impact-assessment obligations. <span class="tag">[Confirmed / MS Today, Pikabu Labs, 2025.12&ndash;2026.2]</span></li>
    </ul>
    <div class="stat-row">
      <div class="stat-card"><div class="n">$7.2B</div><div class="l">Korea's 2026 government AI budget &mdash; roughly 3x 2025's $2.4B</div></div>
      <div class="stat-card"><div class="n">$72B+</div><div class="l">National Growth Fund earmarked for the AI investment era (KRW 100T+&alpha;)</div></div>
      <div class="stat-card"><div class="n">2</div><div class="l">Countries worldwide &mdash; Korea and the EU &mdash; with a comprehensive AI law now in full force</div></div>
      <div class="stat-card"><div class="n">2027</div><div class="l">Year Korea's national foundation-model race narrows from 5 teams to 2 winners</div></div>
    </div>
    <p class="note">KRW figures throughout this section are approximate USD conversions at roughly &#8361;1,380/$1 and should be re-verified before external use.</p>

    <h3 class="sub-title">2.5 Sovereign AI in motion: Korea's national foundation-model race (&ldquo;K-AI&rdquo;)</h3>
    <ul class="brief">
      <li>Korea's Sovereign Foundation Model Project (independently developed, domestically controlled AI comparable to ChatGPT or Gemini) selected five teams in August 2025 from an initial field of 15 &mdash; Naver Cloud, Upstage, SK Telecom, NC AI, and LG AI Research &mdash; each receiving GPU allocations (from a 10,000-unit government tranche plus capacity leased from SKT and Naver Cloud), KRW 3&ndash;5 billion/year per team for licensed-data acquisition, and up to KRW 2 billion/year in global AI-talent recruitment support. The field narrows on roughly six-month evaluation cycles to just two teams by 2027. <span class="tag">[Confirmed / Boan News 2025.6, AI News (인공지능신문)/Wowtale 2025.8, Namuwiki 2026.7]</span></li>
      <li>Concrete evidence of progress: LG AI Research open-sourced &ldquo;K-EXAONE 2.0&rdquo; on Hugging Face on July 31, 2026 &mdash; 750B parameters (3x its 236B predecessor), Apache 2.0-licensed for unrestricted commercial use, scoring 70.1/100 across 24 benchmarks in 9 domains (up over 10% from 63.3), with coding and agentic-coding scores up roughly 30%. On Korea-specific safety and geopolitical-context evaluations, LG reported a 94.6 average versus GLM-5.1 (71.3), DeepSeek V4 Pro Max (65.2), and Qwen 3.5 (89) &mdash; self-reported figures, not yet third-party verified. <span class="tag">[Confirmed (self-reported) / ZDNet Korea, LG AI Research, 2026.7.31]</span></li>
      <li>SK Telecom's consortium alone is targeting 10M+ users within three years across legal, manufacturing, defense, healthcare, and finance B2B services. <span class="tag">[Confirmed / Wowtale, 2025.8]</span></li>
      <li>None of the five K-AI teams is a systems integrator or enterprise delivery partner &mdash; they are model builders, not competitors for Tenarai's actual service layer. That leaves the entire &ldquo;last mile&rdquo; of enterprise AI delivery &mdash; integration, agent orchestration, data-residency-compliant deployment &mdash; open, and a Korea entity would let Tenarai evaluate direct integration with sovereign models like K-EXAONE for clients that require Korea-based data handling. <span class="tag">[Estimated / structural analysis]</span></li>
    </ul>

    <h3 class="sub-title">2.6 Global big tech already treats Korea as first-tier AI infrastructure</h3>
    <ul class="brief">
      <li>OpenAI's Stargate project ($500B, 10GW, with Oracle and SoftBank) drew Samsung and SK into memory-supply letters of intent in October 2025, and OpenAI is reportedly working with domestic partners on data centers in Korea's southwest and southeast regions. OpenAI has reportedly asked Samsung and SK Hynix for up to 900,000 DRAM wafers/month by 2029 &mdash; a figure that exceeds the two firms' current combined monthly capacity (~1.1M), so feasibility is contested. <span class="tag">[Confirmed / Financial News 2026.7, The Elec 2025.10; the 900K-wafer figure specifically is Estimated / The Elec, 2025.10]</span></li>
      <li>At Nvidia's July 24, 2026 AI Summit in San Francisco, SK Telecom confirmed a joint AI data-center build-out of up to 2GW with priority access to Nvidia's next-generation &ldquo;Vera Rubin&rdquo; systems; the same event saw Naver confirm a $10B investment from Nvidia and Brookfield, funding a 3x+ expansion of its &ldquo;GAK Sejong&rdquo; data center (55MW &rarr; 200MW, with a long-term target of 1GW). <span class="tag">[Confirmed / Financial News, 2026.7]</span></li>
      <li>Samsung Electronics and SK Hynix are increasingly contracting directly with AI model companies (OpenAI, Anthropic) rather than only through traditional OEM channels; SK Hynix will supply HBM directly to Stargate data centers. For scale, Alphabet alone raised its 2026 capex guidance to as much as $205B &mdash; illustrating how aggressively global AI infrastructure spend, including in Korea, is accelerating. <span class="tag">[Confirmed / Newspim, Financial News, 2026.7]</span></li>
      <li>This is independent, third-party validation &mdash; from OpenAI, Nvidia, and Brookfield, not from Korean government sources &mdash; that Korea's AI infrastructure market is investment-grade at a scale few single-country markets can match. Global capital is not waiting for Tenarai's competitors to build relationships; it is already here. <span class="tag">[Estimated / interpretation]</span></li>
    </ul>

    <h3 class="sub-title">2.7 Where this is heading, and why the window will not stay open</h3>
    <ul class="brief">
      <li>By 2028, Korea's National AI Computing Center (KRW 2.5T+ / ~$1.8B+ budget; Samsung SDS consortium; SPC formed April 2026, construction started July 2026) opens, targeting 50,000 GPUs by 2030. Its equity structure has already shifted from majority-public (51%) to majority-private (70%+), and the mandatory domestic-NPU clause was removed &mdash; Korea is opening its core AI infrastructure to private and foreign capital, not protecting it. <span class="tag">[Confirmed / XDNode citing ZDNet Korea/Electronic Times, 2026]</span></li>
      <li>By 2030, Samsung and SK Group alone have pledged up to $880B in combined chip and AI infrastructure spend, and Hyundai a further KRW 125T (~$91B) in domestic capex tied substantially to AI and software transformation. Even Korea's non-tech chaebol are repositioning around AI: SK Group sold SK Siltron (KRW 2.3T / ~$1.7B) to fund HBM, energy, and data-center investment; Doosan Group has built out AI-accelerator and semiconductor businesses since its 2022 Doosan Tesna acquisition; and LG Group &mdash; historically a home-appliance maker &mdash; is reorganizing around AI data-center cooling, humanoid robots, and robot actuators. <span class="tag">[Confirmed / Reuters, Bloomberg, Yahoo Finance, KED Global, Seoul Shinmun, 2026]</span></li>
      <li>Korea's homegrown AI-chip sector is scaling in parallel: Rebellions holds the largest cumulative funding of any Korean AI-chip startup (KRW 1.3T / ~$942M as of March 2026), became the first company funded directly under the National Growth Fund (KRW 640B / ~$464M pre-IPO round at a KRW 3.4T / ~$2.46B valuation), and is the only Korean AI-chip startup backed by both major telcos (SKT, KT) and both major chipmakers (Samsung, SK Hynix); its ATOM NPU is already commercialized in KT Cloud. <span class="tag">[Confirmed / Namuwiki, 2026.3]</span></li>
      <li>Put together: Korea's own foundation-model teams don't compete with Tenarai's delivery business; its infrastructure build-out is inviting foreign capital, not excluding it; and its new AI law makes a domestic entity a legal precondition for exactly the AI-native services Tenarai sells. None of that changes if Tenarai enters in 2027 instead of 2026 &mdash; except that three IT-services competitors, and now a fast-maturing local AI ecosystem, will have another year to compound relationships Tenarai does not yet have. <span class="tag">[Estimated / synthesis of Sections 2.1&ndash;2.7]</span></li>
    </ul>

    <div class="opportunity">Bottom line: Korea is not simply a large market with favorable timing &mdash; it is a market where the government, its chaebol, and global big tech are simultaneously and verifiably committing capital at a pace few countries can match, while a new national AI law adds an independent legal reason, not just a commercial one, that a domestic entity is required to sell AI-native services here. The market, the capital, the law, and the talent gap are all moving in Tenarai's favor at the same time. The only missing input is a legal entity to act on it.</div>
  </section>

  <section id="edge">
    <h2 class="section-title">4. Our Competitive Edge &mdash; If We Enter</h2>
    <p class="lead">Three things compound in Tenarai's favor if a Korea entity is in place: an AI-native architecture our competitors don't share, an India cost structure that mirrors an already-proven playbook, and a vertical footprint that lines up with large slices of Korean enterprise demand.</p>

    <h3 class="sub-title">4.1 AI-native architecture, not legacy SI plus AI</h3>
    <ul class="brief"><li>Tenarai-IGNIS (agent orchestration) and Hybrid Agentic PODs (AI-agent-staffed delivery teams) are built into the company's core identity post-rebrand, rather than bolted onto a traditional systems-integration business the way FPT, Infosys, and Wipro have done. That is a structural, not cosmetic, difference in how projects get delivered. <span class="tag">[Uncertain / based on self-reported positioning, no third-party benchmark]</span></li></ul>

    <h3 class="sub-title">4.2 India delivery hub &mdash; a cost structure with a proven precedent</h3>
    <ul class="brief"><li>Our 3,374-engineer India delivery hub (Noida, Gurgaon, Mumbai, Pune, Bengaluru) can run the same offshore-cost arbitrage that lets FPT undercut incumbents using its Vietnam GDC model &mdash; directly addressing the talent shortage described in Section 2.3. This is a cost advantage, not a brand advantage, and the two should not be conflated when this plan is evaluated. <span class="tag">[Estimated / structural analogy to FPT's delivery model]</span></li></ul>

    <h3 class="sub-title">4.3 Vertical fit with Korean enterprise demand</h3>
    <ul class="brief">
      <li>Tenarai's six core industries &mdash; technology, retail/CPG, travel, insurance, healthcare, and telecom &mdash; overlap substantially with Korea's three major telcos (SKT, KT, LG U+), large retail groups (Lotte, Shinsegae, Coupang), major insurers (Samsung Life and peers), and a sizable healthcare sector. <span class="tag">[Confirmed / cross-referenced against Korean industry structure]</span></li>
      <li>Semiconductors and automotive manufacturing &mdash; the two largest components of Korea's $950B investment wave &mdash; are not among Tenarai's stated core industries, and Wipro's HARMAN DTS acquisition already gives it a head start there. This is a real gap, not a marketing footnote, and it should shape which accounts we target first rather than being treated as solved by entity formation alone. <span class="tag">[Confirmed / cross-referenced against Section 2.1 and 3]</span></li>
      <li>Tenarai already serves a portfolio of U.S. and European Fortune 500 accounts. Whether any of them operate a Korea business unit that could become an early reference account has not yet been checked against our own client list &mdash; this is the single fastest, lowest-cost validation step available before formal entity formation. <span class="tag">[Unknown / requires internal account-list review]</span></li>
    </ul>
  </section>

  <section id="entity">
    <h2 class="section-title">5. Why a Legal Entity Is the Prerequisite</h2>
    <h3 class="sub-title">5.1 Three ways to operate in Korea &mdash; only one lets us sell</h3>
    <div class="table-wrap"><table>
      <thead><tr><th></th><th>Liaison office</th><th>Branch</th><th>Subsidiary (FDI entity)</th></tr></thead>
      <tbody>
        <tr><td>Can contract / invoice / book revenue</td><td>No</td><td>Yes</td><td>Yes</td></tr>
        <tr><td>Legal status</td><td>Extension of HQ, no separate entity</td><td>Extension of HQ, taxed like a domestic entity</td><td>Independent Korean corporation</td></tr>
        <tr><td>Minimum capital</td><td>N/A (activity is restricted by design)</td><td>None specified</td><td>~$75,000 USD (KRW 100M) + 10%+ ownership</td></tr>
        <tr><td>Can register as an enterprise vendor</td><td>No</td><td>Yes</td><td>Yes &mdash; the standard, expected form</td></tr>
        <tr><td>HQ liability exposure</td><td>N/A</td><td>Unlimited &mdash; HQ is directly on the hook</td><td>Limited to invested capital</td></tr>
      </tbody>
    </table></div>
    <p class="note">Compiled from general legal/tax guidance on foreign entity formation in Korea; confirm current statutory detail with Korean counsel before filing. USD figure is an approximate conversion and should be re-verified at filing time.</p>

    <h3 class="sub-title">5.2 The gate, not a growth lever</h3>
    <ul class="brief">
      <li>A liaison office can conduct market research and brand-building only &mdash; it cannot sign a contract or issue a Korean tax invoice. In practice, that means it cannot generate a dollar of revenue. <span class="tag">[Confirmed / legal/tax advisory sources]</span></li>
      <li>Registering as a vendor with a Korean conglomerate (Samsung, SK, Hyundai, etc.) or bidding on public-sector procurement (Korea ON-line E-Procurement System) requires a Korean business registration number &mdash; something only a branch or subsidiary can obtain. <span class="tag">[Confirmed / Korea e-procurement registration rules]</span></li>
      <li>All three incumbent competitors have held branch or subsidiary status for 10 to 20+ years. Every quarter Tenarai delays formation is a quarter without RFP eligibility at all &mdash; this is not a competitiveness gap to close, it is a participation gap. <span class="tag">[Confirmed / Section 3]</span></li>
      <li>Beyond commercial registration, Korea's AI Basic Act independently requires a domestic representative for foreign providers of high-impact or generative AI &mdash; a second legal gate, layered on top of vendor registration, that applies specifically to the AI-native services Tenarai sells. <span class="tag">[Confirmed / Section 2.4]</span></li>
    </ul>

    <h3 class="sub-title">5.3 Recommended structure: subsidiary, not branch</h3>
    <ul class="brief"><li>The minimum capital bar (~$75,000, 10%+ ownership) is not a meaningful barrier at Tenarai's scale. A subsidiary caps HQ's liability at the invested amount, matches the standard vendor-registration form Korean enterprises expect, and gives local leadership a real corporate structure to build around &mdash; branch status offers none of those advantages for a modest cost difference. <span class="tag">[Confirmed / structural comparison, Section 5.1]</span></li></ul>
  </section>

  <section id="risks">
    <h2 class="section-title">6. Risks and How We Address Them</h2>
    <p class="lead">An honest account of what entity formation does not solve by itself &mdash; because a business case that hides its risks is not one HQ can act on with confidence.</p>
    <ul class="brief">
      <li>Zero track record in Korea. Mitigation: prioritize the Fortune 500 account-overlap check (Section 4.3) as the fastest path to a credible first reference; do not lead with a cold-market pitch. <span class="tag">[Confirmed / Sections 3&ndash;4]</span></li>
      <li>Scale disadvantage. Wipro alone employs 230,000+ people worldwide and FPT's parent operates in 32 countries with 28,000+ staff; Tenarai's global headcount is 5,500&ndash;6,157. Mitigation: compete on the four fit verticals (Section 4.3), not head-to-head enterprise-wide. <span class="tag">[Confirmed / Sections 1&ndash;3 headcount data]</span></li>
      <li>Semiconductor and automotive manufacturing &mdash; Korea's largest investment category &mdash; sit outside Tenarai's core verticals, and entity formation does not close that gap on its own. Mitigation: treat this as a deliberately out-of-scope vertical for the initial entry, not a gap to paper over. <span class="tag">[Confirmed / Section 4.3]</span></li>
      <li>Korea's AI Basic Act adds new compliance obligations &mdash; domestic representative designation, transparency, and AI impact assessments for high-impact and generative AI providers &mdash; that did not exist before January 2026. Mitigation: scope AI Basic Act compliance into the entity-formation workstream itself (Section 2.4), rather than treating it as a separate legal cost to be discovered later. <span class="tag">[Confirmed / Section 2.4]</span></li>
      <li>Forming the entity creates the legal ability to sell &mdash; it does not, by itself, produce a sales pipeline. Local sales leadership, reference accounts, and brand-building remain separate workstreams that should be scoped alongside entity formation, not treated as automatic outputs of it. <span class="tag">[Confirmed / logical consequence of Sections 4&ndash;5]</span></li>
    </ul>
  </section>

  <section id="recommendation">
    <h2 class="section-title">7. Recommendation</h2>
    <ul class="brief">
      <li>Approve formation of a Korea subsidiary (foreign-invested entity, not a branch) &mdash; the standard structure that caps HQ liability and matches enterprise vendor-registration norms (Section 5.3).</li>
      <li>Target telecom, retail/CPG, insurance, and healthcare as the initial verticals, where Tenarai's existing capability set most directly overlaps Korean enterprise demand &mdash; and explicitly deprioritize semiconductor/automotive manufacturing for phase one (Section 4.3).</li>
      <li>Scope AI Basic Act compliance (domestic representative, transparency, and impact-assessment readiness) into the entity-formation workstream from day one, not as a follow-on legal review (Section 2.4, 5.2).</li>
      <li>Before or immediately after filing, run an internal review of existing Fortune 500 accounts for any Korea business unit that could become a first reference account (Section 4.3) &mdash; this is the cheapest possible validation step and should not wait for entity formation to complete.</li>
      <li>Treat entity formation as the starting gate, not the finish line &mdash; local sales leadership and reference-account development need to be scoped as a follow-on workstream (Section 6).</li>
    </ul>
    <div class="opportunity">The window is open now: capital, policy tailwinds, a maturing sovereign-AI ecosystem, and a talent gap are aligned in Tenarai's favor, and three rivals have already proven the market is real. The only input missing is the legal entity that lets us compete for it.</div>
  </section>

  function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }
  function formatNum(v, decimals, comma){
    var s = v.toFixed(decimals);
    if (comma) { var p = s.split('.'); p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ','); s = p.join('.'); }
    return s;
  }
  function animateCount(el){
    var raw = el.textContent;
    var m = raw.match(/^([^\d\-−]*)([\-−]?)([\d,]+(?:\.\d+)?)([^\d]*)$/);
    if (!m) return;
    var prefix = m[1], sign = m[2], digits = m[3], suffix = m[4];
    var comma = digits.indexOf(',') !== -1;
    var decimals = (digits.split('.')[1] || '').length;
    var end = parseFloat(digits.replace(/,/g, ''));
    if (isNaN(end)) return;
    var dur = 1200, t0 = null;
    function step(ts){
      if (!t0) t0 = ts;
      var p = Math.min((ts - t0) / dur, 1);
      var v = end * easeOutCubic(p);
      el.textContent = prefix + sign + formatNum(v, decimals, comma) + suffix;
      if (p < 1) requestAnimationFrame(step); else el.textContent = raw;
    }
    requestAnimationFrame(step);
  }
  var cards = document.querySelectorAll('.stat-card');
  if (!cards.length) return;
  var io = new IntersectionObserver(function(entries){

      card.classList.add('rv-in');
      var n = card.querySelector('.n');
      if (n) animateCount(n);
      io.unobserve(card);
    });
  }, { threshold: 0.3 });

})();

  <p class="eyebrow">TENARAI CORPORATION · KOREA ENTITY</p>
  <p class="note" style="margin:0 0 34px;">August 2026 · v12 · Internal review</p>
  <h1 class="doc serif">Establishing a Korean Subsidiary<br>&amp; Five-Year Investment Plan</h1>
  <p class="lead">Prepared on the assumption that Tenarai Corporation (Los Gatos, CA) will establish a wholly-owned subsidiary in South Korea. Covers entity type, incorporation procedure, required documents, setup costs, and the five-year funding requirement.</p>

  <p class="fx">All figures converted at <b>USD 1 = KRW 1,430</b> (4 Aug 2026). Source data is denominated in Korean won; statutory thresholds are stated in KRW because that is their legal unit.</p>

  <div class="bento b3">
    <div class="card"><div class="k">Five-year cumulative requirement (gross, base case)</div><div class="v big serif rust">$2.77M</div><div class="s">₩3,964.3M · named hiring schedule, 5% annual salary increase</div></div>
    <div class="card"><div class="k">Year 1 requirement</div><div class="v serif">$334.3K</div><div class="s">₩478.0M</div></div>
    <div class="card"><div class="k">Setup cost</div><div class="v serif">$43.9K</div><div class="s">incl. office deposit &amp; equipment</div></div>
  </div>
  <div class="bento b2">
    <div class="card"><div class="k">Recommended initial funding (24-month runway)</div><div class="v serif olive">$688.6K</div><div class="s">setup cost + two years of operating expense</div></div>
    <div class="card"><div class="k">Time to incorporate / FDI registration deadline</div><div class="v serif" style="font-size:23px;">approx. 2–3 months / within 60 days</div><div class="s">Foreign Investment Promotion Act art. 21(1) · filed with KOTRA or a foreign exchange bank</div></div>
  </div>

  <section>
    <p class="eyebrow">01 · SUMMARY</p>
    <h2 class="serif">Key conclusions</h2>
    <ul>
      <li>The plan assumes a <strong>locally incorporated subsidiary (jusik hoesa, a Korean joint-stock company)</strong>. Under the Enforcement Decree of the Foreign Investment Promotion Act art. 2(2), investment qualifies as foreign direct investment only if it is at least <strong>KRW 100 million (approx. $69,930)</strong> and confers at least 10% of voting shares.</li>
      <li>Setup cost is estimated at <strong class="rust">$43,944</strong> (including a $34,965 office deposit and $4,895 in equipment). The source material assumed roughly $1,399 in incorporation-related fees; that understates the cost for a Seoul-based entity, because it omits the threefold surcharge on registration license tax that applies inside the Seoul metropolitan concentration control region.</li>
      <li>The five-year cumulative requirement is <strong class="rust">$2,772,213 ($2.77M)</strong> under the base case, built from a named hiring schedule (§06-1) with a 5% annual salary increase for every employee (up from the 3% merit rate used in the prior version) — see §06 for the full build-up.</li>
      <li>In practice the full five years are not funded up front. We recommend securing a <strong>24-month runway of $688,595 ($688.6K)</strong> as the initial capital injection, with funding from year 3 onward gated on headquarters approval against year 1–2 performance.</li>
      <li>These figures are <strong>gross cost — no revenue is netted off</strong>. Once the subsidiary books revenue, the actual net cash injection required will be lower.</li>
    </ul>
  </section>

  <section>
    <p class="eyebrow">02 · ENTITY TYPE</p>
    <h2 class="serif">Choosing the entity type</h2>
    <p>A foreign company can hold a presence in Korea in three ways, and they differ materially in tax status, legal standing and how they are funded. If the entity is to conduct sales and book revenue, a local subsidiary is effectively the only viable option.</p>
    <div class="tw"><table class="ctr">
      <thead><tr><th></th><th>Local subsidiary</th><th>Branch office</th><th>Liaison office</th></tr></thead>
      <tbody>
        <tr><td>Governing law</td><td>Foreign Investment Promotion Act + Commercial Act</td><td>Foreign Exchange Transactions Act</td><td>Foreign Exchange Transactions Act</td></tr>
        <tr><td>Legal status</td><td>Korean legal entity (separate personality)</td><td>Same legal entity as HQ</td><td>Same legal entity as HQ</td></tr>
        <tr><td>May book revenue</td><td>Yes</td><td>Yes</td><td>No — non-commercial activity only</td></tr>
        <tr><td>Minimum investment</td><td>KRW 100 million</td><td>None</td><td>None</td></tr>
        <tr><td>FDI company registration</td><td>Required</td><td>Not applicable</td><td>Not applicable</td></tr>
        <tr><td>D-8 investor visa</td><td>Available</td><td>Limited</td><td>Not available</td></tr>
        <tr><td>HQ liability exposure</td><td>Limited to capital contributed</td><td>Unlimited</td><td>Unlimited</td></tr>
      </tbody></table></div>
    <p class="note">All figures in this report assume a <strong>local subsidiary</strong>.</p>
  </section>

  <section>
    <p class="eyebrow">03 · PROCESS</p>
    <h2 class="serif">Procedure and timeline</h2>
    <p>An entity funded by a foreign investor follows the standard Korean incorporation process plus two additional steps: the foreign investment notification at the front and the FDI company registration at the end. Including document preparation, allow approximately two to three months.</p>
    <div class="tw"><table>
      <thead><tr><th>Step</th><th style="text-align:left;">Action</th><th style="text-align:left;">Authority</th><th>Duration</th></tr></thead>
      <tbody>
        <tr><td>1</td><td style="text-align:left;">Foreign investment notification — may be filed before funds move</td><td style="text-align:left;">KOTRA (Invest Korea) or a foreign exchange bank</td><td>same day–1 day</td></tr>
        <tr><td>2</td><td style="text-align:left;">Remittance of investment funds from HQ to a temporary account</td><td style="text-align:left;">Foreign exchange bank</td><td>1–5 days</td></tr>
        <tr><td>3</td><td style="text-align:left;">Incorporation registration — articles of incorporation, director acceptances</td><td style="text-align:left;">Commercial registry office</td><td>1–2 weeks</td></tr>
        <tr><td>4</td><td style="text-align:left;">Corporate establishment filing and business registration</td><td style="text-align:left;">District tax office</td><td>1–2 weeks</td></tr>
        <tr><td>5</td><td style="text-align:left;">Transfer of paid-in capital from temporary to corporate account</td><td style="text-align:left;">Foreign exchange bank</td><td>1–2 days</td></tr>
        <tr><td>6</td><td style="text-align:left;">FDI company registration — within 60 days of completing the investment</td><td style="text-align:left;">Same body that received the notification</td><td>1–2 weeks</td></tr>
      </tbody></table></div>
    <ul style="margin-top:22px;">
      <li><strong class="rust">The 60-day registration deadline is mandatory.</strong> Under Foreign Investment Promotion Act art. 21(1), registration must be filed within 60 days of the triggering event (typically completion of the capital payment). Missing it exposes the company to an administrative fine, and any D-8 visa application slips with it.</li>
      <li>The notification and the registration must go through the same institution — if the notification was filed with KOTRA, register with KOTRA.</li>
      <li>The FDI registration certificate is a prerequisite for the D-8 (corporate investment) visa. If expatriate staff are to be posted, work the staffing schedule backwards from the registration completion date.</li>
    </ul>
  </section>

  <section>
    <p class="eyebrow">04 · DOCUMENTS</p>
    <h2 class="serif">Required documents</h2>
    <h3>Issued in the United States — apostille required</h3>
    <p>The United States is a party to the Apostille Convention, so a state-level apostille replaces consular legalisation. All three documents must be accompanied by a notarised Korean translation.</p>
    <div class="tw"><table class="txt">
      <thead><tr><th>Document</th><th>Form</th><th>Note</th></tr></thead>
      <tbody>
        <tr><td>Proof of corporate existence</td><td>Certificate of Incorporation or Certificate of Good Standing</td><td>Evidences legal name and registered address</td></tr>
        <tr><td>Proof of signing authority</td><td>Certificate of Incumbency or board resolution</td><td>Must match the signatory on the power of attorney</td></tr>
        <tr><td>Power of attorney</td><td>Grants a Korean agent authority to invest and register</td><td>Required if the investor does not travel to Korea</td></tr>
        <tr><td>Signature certificate</td><td>Notarised specimen signature</td><td>Substitutes for the Korean seal certificate</td></tr>
      </tbody></table></div>
    <p style="margin-top:20px;"><strong class="rust">The single most common cause of rejection is an inconsistent corporate name.</strong> "Tenarai Inc." and "Tenarai, Inc." — a difference of one comma — will draw a correction order from the registry office. Reconcile the legal name character by character across the US documents, the articles of incorporation and the notification form <em>before</em> the apostille is obtained; re-notarisation adds another two to three weeks.</p>

    <h3>Prepared in Korea</h3>
    <ul>
      <li>Foreign investment notification form</li>
      <li>Articles of incorporation — <strong>notarisation is waived where paid-in capital is under KRW 1 billion and the company is formed by promoter incorporation</strong> (Commercial Act art. 292, proviso)</li>
      <li>Director acceptance letters and seal or signature certificates</li>
      <li>Office lease agreement — required for business registration</li>
      <li>Foreign currency purchase / deposit certificate evidencing the inbound remittance</li>
      <li>Shareholder register</li>
      <li>Corporate seal registration and seal card issuance</li>
    </ul>
    <p class="note">Begin preparing the US documents at least one to two months before the target incorporation date, to absorb apostille and translation lead time.</p>
  </section>

  <section>
    <p class="eyebrow">05 · SETUP COST</p>
    <h2 class="serif">Setup cost</h2>
    <h3>Public charges by capital level</h3>
    <p>Registration license tax is 0.4% of paid-in capital — but <strong>incorporating inside the Seoul metropolitan concentration control region (which includes all of Seoul) triples it to 1.2%</strong>. Local education tax is 20% of the registration license tax and therefore triples with it. The choice of office location has a direct effect on setup cost.</p>
    <div class="tw"><table>
      <thead><tr><th>Paid-in capital</th><th style="text-align:left;">Location</th><th>Registration license tax</th><th>Local education tax</th><th>Total</th></tr></thead>
      <tbody>
        <tr><td>KRW 100M ($69.9K)</td><td style="text-align:left;">Seoul (1.2%)</td><td>$839</td><td>$168</td><td>$1,007</td></tr>
        <tr><td>KRW 100M ($69.9K)</td><td style="text-align:left;">Outside the region (0.4%)</td><td>$280</td><td>$56</td><td>$336</td></tr>
        <tr><td>KRW 300M ($209.8K)</td><td style="text-align:left;">Seoul (1.2%)</td><td>$2,517</td><td>$503</td><td>$3,021</td></tr>
        <tr><td>KRW 300M ($209.8K)</td><td style="text-align:left;">Outside the region (0.4%)</td><td>$839</td><td>$168</td><td>$1,007</td></tr>
        <tr><td>KRW 500M ($349.6K)</td><td style="text-align:left;">Seoul (1.2%)</td><td>$4,196</td><td>$839</td><td>$5,035</td></tr>
        <tr><td>KRW 500M ($349.6K)</td><td style="text-align:left;">Outside the region (0.4%)</td><td>$1,399</td><td>$280</td><td>$1,678</td></tr>
      </tbody></table></div>
    <p class="note">Minimum registration license tax is KRW 112,500 (KRW 337,500 inside the control region).</p>

    <h3>Total setup cost — assuming KRW 300M capital and a Seoul office</h3>
    <div class="tw"><table>
      <thead><tr><th>Item</th><th>Amount</th><th style="text-align:left;">Basis</th></tr></thead>
      <tbody>
        <tr><td>Office security deposit</td><td>$34,965</td><td style="text-align:left;">per source data (refundable asset)</td></tr>
        <tr><td>Office equipment and fit-out</td><td>$4,895</td><td style="text-align:left;">per source data</td></tr>
        <tr><td>Registration license tax + local education tax</td><td>$3,021</td><td style="text-align:left;">KRW 300M × 1.2%, plus 20%</td></tr>
        <tr><td>Court registration filing fee</td><td>$14</td><td style="text-align:left;">KRW 20,000, electronic filing</td></tr>
        <tr><td>Judicial scrivener fee</td><td>$559</td><td style="text-align:left;">typical range KRW 300k–800k; upper end applied for a foreign-shareholder filing</td></tr>
        <tr><td>Apostille and certified translation</td><td>$420</td><td style="text-align:left;">estimate for three documents [to be confirmed]</td></tr>
        <tr><td>Corporate seal and sundry filings</td><td>$70</td><td style="text-align:left;">seal engraving, certified extracts</td></tr>
        <tr class="total"><td>Total setup cost</td><td class="hi">$43,944</td><td style="text-align:left;">$4,084 excluding deposit and equipment</td></tr>
      </tbody></table></div>
    <p class="note">Articles-of-incorporation notarisation is waived (capital under KRW 1 billion, promoter incorporation) and the national housing bond purchase requirement was abolished in 2008; neither is included.</p>
  </section>

  <section>
    <p class="eyebrow">06 · FIVE-YEAR PLAN</p>
    <h2 class="serif">Five-year funding requirement</h2>
    <h3>Basis and assumptions</h3>
    <ul>
      <li><strong class="rust">Revision (this version): the blanket 20%/year escalation is replaced with a named, role-by-role hiring schedule.</strong> Headcount by year (3, 4, 6, 8, 11) is unchanged from the existing Section 4/5-3 plan; what changes is that each added head is now a named role hired in a specific year at a specific salary, with a 5% annual salary increase applied to every employee — existing staff and each new hire alike, at their annual salary review — not a uniform percentage applied to the payroll total. All eleven roles are regular (정규직) hires; the plan does not use fixed-term or contract-worker (계약직) positions.</li>
      <li><strong>Country-manager gap closed.</strong> A Country Sales Director (KRW 120M) leads the Year 1 team — this resolves risk 3 below (nil country-manager salary) rather than adding it as a side risk.</li>
      <li><strong>Vehicles: two, not one.</strong> A field sales team of this size needs two vehicles. Both are put on a 5-year fixed-rate long-term rental (KRW 1.0M/month each, KRW 24.0M/year combined) rather than the prior single-vehicle KRW 900k/month assumption. Long-term rental in Korea bundles insurance and maintenance, so running cost is reduced to fuel/tolls only (KRW 200k/month per vehicle).</li>
      <li>Statutory and social-insurance cost is now modelled as <strong>10% of payroll</strong> (approximate employer share of the four social insurances) plus a headcount-tiered bookkeeping/company-secretarial retainer, replacing the flat KRW 5M/month line — which became unrealistically thin per head once the team passed five people, and unrealistically rich when the team was three. <span class="tag">[Confirmed methodology / 2026 rates to be finalised with Korean tax counsel]</span></li>
      <li>Office rent scales with headcount in steps (KRW 1.2M/month at 3–4 people, KRW 2.5M at 6–11, KRW 4.5M at 14–27, KRW 7.5M at 38–50) rather than compounding at 20% a year — this is when the entity actually needs to move office, not a smooth curve.</li>
      <li>A marketing budget is added for the first time — see §06-1 below — because Year 1–5 funding was previously silent on demand generation entirely.</li>
      <li>Setup cost falls in year 1 only. The office security deposit is a recoverable asset and is treated as a cash requirement, not an expense.</li>
      <li>No revenue is netted off; these are gross costs. (See Part IV for the net-of-gross-margin view headquarters actually funds against.)</li>
    </ul>

  <section>
    <p class="eyebrow">07 · RISKS</p>
    <h2 class="serif">Financial implications and open points</h2>

    <h3>1. The five years are not funded in one tranche</h3>
    <p>A new entity is normally funded to a runway of 18–24 months, until revenue stabilises. On a 24-month basis the requirement is <strong class="olive">$684,287 ($684.3K)</strong>. Funding from year 3 onward is more realistically gated on headquarters approval against year 1–2 results.</p>

    <h3>2. Paid-in capital and working capital are separate questions</h3>
    <p>The statutory FDI minimum is KRW 100 million, but a thinly capitalised entity fares poorly in D-8 visa assessment and in counterparty credit checks. Conversely, higher capital increases the 1.2% registration license tax proportionally. Starting at around KRW 300 million and funding the balance through an HQ loan or a later capital increase is worth considering.</p>

    <h3>3. Nil country-manager salary — resolved in this version</h3>
    <p>Prior versions carried zero compensation for the country manager, which would have invited questions about sustainability at investment-committee review. This version puts a Country Sales Director (KRW 120M) at the head of the Year 1 team instead of treating leadership as a side risk to flag — see §06-1. No separate expatriate-salary add-on is needed.</p>

    <h3>4. The payroll line is now a named hiring schedule, not an escalation rate</h3>
    <p>The prior 20%/year blanket rate could not answer "who was hired." Year 5 payroll of $550,842 is now traceable to eleven named roles with hire year and salary basis (§06-1) — the derivation headquarters will ask for is already in the document.</p>

    <h3>5. Sales costs scale non-linearly</h3>
    <p>Once senior sales staff on six-figure packages start producing, corporate card, entertainment and petty cash spend will substantially exceed the KRW 300k per month assumption. Without a separately designed incentive pool, the sales cost line is where the budget breaks first.</p>

  <section>
    <p class="eyebrow">07-1 · VENDOR REGISTRATION INSURANCE</p>
    <h2 class="serif">Insurance required to register as a vendor</h2>
    <p>Getting incorporated is not the last insurance-adjacent step. Once operating, the entity will need to register as
      an approved vendor (협력업체) with any large domestic conglomerate, foreign-owned company or public institution it
      wants to sell to — and that registration carries its own insurance requirements, separate from anything in §05.</p>
    <p><strong class="rust">There is no single statutory minimum.</strong> Unlike the capital and registration-tax rules
      in §02–§05, vendor-insurance requirements are set by each client's own internal procurement policy and vary by
      industry, risk level and contract size — the figures below are common market practice, not a legal floor, and the
      actual requirement for any given client must be confirmed against that client's own vendor-registration guideline
      or RFP before a policy is purchased.</p>
    <div class="tw"><table class="txt">
      <thead><tr><th style="text-align:left;">Coverage</th><th style="text-align:left;">Applies to</th><th style="text-align:left;">Typical minimum limit</th></tr></thead>
      <tbody>
        <tr><td style="text-align:left;">Commercial General Liability (영업배상책임보험, CGL)</td><td style="text-align:left;">On-site work, installation, facility supply, general services vendors</td><td style="text-align:left;">KRW 100M–500M per occurrence (domestic large/mid-size clients); USD 1,000,000 (≈KRW 1.3bn) per occurrence is common for foreign-owned/global clients <span class="flag">[industry practice, not a fixed standard]</span></td></tr>
        <tr><td style="text-align:left;">Product Liability (제조물배상책임보험, PL)</td><td style="text-align:left;">Vendors manufacturing or supplying products, parts or equipment</td><td style="text-align:left;">KRW 100M–1,000M per occurrence / annual aggregate <span class="flag">[industry practice]</span> — group PL policies via the Korea Federation of SMEs (중소기업중앙회) can reduce premium</td></tr>
        <tr><td style="text-align:left;">Employer's Liability (근로자재해보상책임보험, 근재보험)</td><td style="text-align:left;">Vendors dispatching personnel to a client site for installation, maintenance or construction</td><td style="text-align:left;">KRW 100M–200M per person; KRW 300M–500M+ per occurrence <span class="flag">[industry practice]</span> — covers the gap above statutory Industrial Accident Compensation Insurance (산재보험)</td></tr>
        <tr><td style="text-align:left;">Professional E&amp;O / cyber liability (전문직배상책임보험 · 사이버배상책임보험)</td><td style="text-align:left;">IT system builds, software development, consulting and other data-handling vendors — the category Tenarai Korea itself falls into</td><td style="text-align:left;">KRW 100M–500M per occurrence <span class="flag">[industry practice]</span></td></tr>
      </tbody></table></div>
    <p class="note">Not every coverage above is relevant to every client relationship. As a technical-sales-and-delivery-management
      entity with no manufacturing and no on-site installation crew (Part III §5-1), CGL and professional E&amp;O/cyber
      liability are the two most likely to be asked for in practice; PL and 근재보험 become relevant only if the scope of a
      given engagement changes to include equipment supply or on-site personnel deployment.</p>
    <ul style="margin-top:18px;">
      <li><strong>Check the specific client's vendor-registration guideline first.</strong> The required Certificate of
        Insurance (COI) and minimum limit are normally stated in the registration package or RFP — confirm before buying
        a policy rather than sizing it off the table above.</li>
      <li><strong>Additional Insured / Waiver of Subrogation.</strong> Large and foreign-owned clients frequently require
        the policy to name the client as Additional Insured and to include a Waiver of Subrogation clause — flag this to
        the broker when quoting, since it is not always the default policy wording.</li>
      <li><strong>Distinct from surety bonds.</strong> These are liability policies, not performance guarantees. Korean
        enterprise and public-sector vendor contracts typically also require a Performance Bond (이행보증보험) and a Defect
        Warranty Bond (하자보수보증보험), most commonly issued through SGI Seoul Guarantee Insurance (SGI서울보증) — budget for
        these separately from the liability coverages above.</li>
    </ul>
  </section>

    var prefix = m[1], sign = m[2], digits = m[3], suffix = m[4];
    if (/[^\dA-Za-z%×.\-−$₩ ]/.test(suffix)) return;
    var comma = digits.indexOf(',') !== -1;
    var decimals = (digits.split('.')[1] || '').length;
    var end = parseFloat(digits.replace(/,/g, ''));
    if (isNaN(end)) return;
    var dur = 1200, t0 = null;
    function step(ts){
      if (!t0) t0 = ts;
      var p = Math.min((ts - t0) / dur, 1);
      var v = end * easeOutCubic(p);
      el.textContent = prefix + sign + formatNum(v, decimals, comma) + suffix;
      if (p < 1) requestAnimationFrame(step); else el.textContent = raw;
    }
    requestAnimationFrame(step);
  }
  var cards = document.querySelectorAll('.bento .card');
  if (!cards.length) return;
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if (!entry.isIntersecting) return;
      var card = entry.target;
      card.classList.add('rv-in');
      var v = card.querySelector('.v');
      if (v) animateCount(v);
      io.unobserve(card);
    });
  }, { threshold: 0.3 });
  cards.forEach(function(c){ io.observe(c); });
})();
<\/script></script>

    <h2>Business model and<br>what applies in Korea</h2>
    <p class="lead">Tenarai's six solutions were scored against Korean demand certainty and competitive intensity. Two of them carry the entry.</p>

    <h3>1-1. Korea fit by solution</h3>
    <div class="tw"><table class="txt">

      </tr></thead>
      <tbody>
        <tr>
          <td><strong>Tenarai-Archer</strong><br><span class="micro">Legacy data infrastructure modernisation</span></td>
          <td>Bank and insurance core-system replacement; public-sector information systems</td>
          <td><span class="rate">●●●●●</span></td>

        </tr>
        <tr>
          <td><strong>Hybrid Agentic PODs</strong><br><span class="micro">AI-agent-based delivery teams</span></td>
          <td>Substituting for scarce enterprise IT talent; managed development capacity</td>
          <td><span class="rate">●●●●●</span></td>
          <td>Korean universities produce 22,000–25,000 IT graduates a year while demand in AI, 5G, blockchain and automation runs far ahead of supply. FPT has already proven this demand with its Vietnam GDC model; Tenarai can reproduce the same structure from its 3,374-strong India delivery hub. <span class="micro">[2][9]</span></td>

          <td><strong>Demand Forecasting with AI</strong><br><span class="micro">Forecasting, pricing, inventory</span></td>

          <td><strong>AI Content Transformation</strong><br><span class="micro">Marketing content automation</span></td>

    <p class="fine" style="margin-top:14px;">Fit scores are <strong>this document's own assessment</strong> on a five-point scale across the three axes named above. They are not an external index.</p>

    <h3>1-2. Entry priority — concentrate on two</h3>

      <p class="t">Priority 1: Tenarai-Archer + Hybrid Agentic PODs</p>

    </div>
    <p>Priority 2, Demand Forecasting, runs through partner co-sell (Databricks, Google Cloud, Salesforce Korea). Priority 3, Content and e-Commerce, is an expansion item inside won accounts. <strong>Standalone IGNIS platform sales are deferred beyond Year 5.</strong></p>

    <p class="eyebrow">02 · Market Sizing</p>
    <h2>How large is<br>USD 35M in this market?</h2>
    <p class="lead">A target is credible or not by its share, not its absolute value. USD 35.0M is 0.065% of the Korean IT services market.</p>

    <div class="stats c3">
      <div class="stat"><div class="v">USD 53.6B</div><div class="k">TAM · Korean IT services market, 2030</div><div class="s">KRW 76.7T <span class="micro">[6]</span></div></div>

    </div>

    <h3>2-1. The market estimates disagree</h3>
    <p>Research houses scope "IT services" differently, so the Korean figures diverge widely. The conclusion is unchanged whichever is used, so this document works from <strong>the most conservative reading</strong>.</p>
    <div class="tw"><table>
      <thead><tr><th>Source</th><th>2025</th><th>Forecast</th><th>CAGR</th><th>KRW (forecast year)</th></tr></thead>
      <tbody>
        <tr><td>Mordor Intelligence <span class="micro">[6]</span></td><td>USD 29.92B</td><td>USD 53.63B (2030)</td><td>12.38%</td><td class="hi">KRW 76.7T</td></tr>
        <tr><td>Grand View Research <span class="micro">[7]</span></td><td>USD 35.8B</td><td>— (11% to 2033)</td><td>11.0%</td><td>—</td></tr>
        <tr><td>IMARC Group <span class="micro">[8]</span></td><td>USD 23.2B</td><td>USD 43.9B (2034)</td><td>6.6%</td><td>KRW 62.8T</td></tr>
      </tbody>
    </table></div>
    <p class="fine" style="margin-top:14px;">The three 2025 estimates span USD 23.2B to USD 35.8B — a <strong>1.54× spread</strong>. The likely cause is scope (whether hardware maintenance, BPO and telecom services are included), but the underlying methodology documents were not obtained. <span class="tagbad">to be verified</span></p>

    <h3>2-2. Demand already committed — financial-sector modernisation</h3>
    <p>Published tenders are stronger evidence than analyst forecasts. This is Tenarai-Archer's direct target market.</p>
    <div class="tw"><table class="txt">
      <thead><tr><th style="width:28%;">Programme</th><th style="width:22%;">Value</th><th style="width:50%;">Detail</th></tr></thead>
      <tbody>

        <tr><td>NH Nonghyup Bank "NEO" phase 1</td><td>USD 213.6M<br><span class="micro">KRW 305.5B</span></td><td>LG CNS as prime, 27 months to April 2028. Largest single financial IT project in Korean history <span class="micro">[1]</span></td></tr>
        <tr><td>NH Nonghyup Bank phases 1+2</td><td>USD 420–434M<br><span class="micro">KRW 600–620B</span></td><td>Including the information-systems phase 2 <span class="micro">[1]</span></td></tr>
        <tr><td>Nonghyup Mutual Finance</td><td>undisclosed</td><td>SK AX selected, 25 months to January 2028, serving 1,110 local cooperatives <span class="micro">[1]</span></td></tr>
      </tbody>
    </table></div>
    <div class="callout">
      <p class="t">What this table establishes</p>
      <p>The Year 10 target of USD 35.0M equals <strong>16% of one programme</strong> (NH Nonghyup phase 1) and <strong>2.5%</strong> of two years of financial-sector tendering. The primes on these programmes are the Korean SI majors, however, and a newly incorporated foreign entity is <strong>not realistically going to win prime position</strong> — subcontract and specialist-partner roles are the credible route.</p>
    </div>

    <h3>2-3. Demand-side indicators</h3>
    <div class="stats c4">

    <p class="fine" style="margin-top:20px;">Korean enterprise generative-AI market estimates <strong>conflict within a single research house</strong>: Grand View Research publishes both USD 370.6M by 2030 (38.8% CAGR from 2025) and USD 130M in 2025 rising to USD 2,333M in 2033. The two are not reconcilable (the former implies roughly USD 72M in 2025), so neither is used as a sizing basis here — only the IT services figures above. <span class="tagbad">sources conflict</span></p>

    <h3>3-3. Deal tiers and contract structure</h3>
    <p>The same revenue built from different contracts implies a different organisation and a different risk profile. Four tiers are managed.</p>

    <h2>P&amp;L structure<br>and payback</h2>
    <p class="lead">One decision precedes the revenue plan — <strong>whose income statement does this USD 35M land on?</strong></p>

    <h3>6-1. Settle the transfer-pricing structure first</h3>
    <p>If the Korea entity sells while HQ delivers, the contracting structure determines <strong>the entity's reported revenue itself</strong>. There are two options and the USD 35M target holds under only one of them.</p>
    <div class="tw"><table class="txt">
      <thead><tr><th style="width:22%;">Dimension</th><th style="width:39%;">Principal model</th><th style="width:39%;">Commissionaire / agent model</th></tr></thead>
      <tbody>
        <tr><td>Contracting party</td><td>Korea entity contracts directly with the client</td><td>HQ contracts; Korea entity introduces</td></tr>

    <h3>6-4. Once the entity is profitable, what comes back to headquarters?</h3>
    <p>In outline: <strong>Korean corporate tax 20%</strong> (2026 bracket for this scale) → at least <strong>10% of any

(function(){

  function fadeIn(el, delay){
    var target = getComputedStyle(el).opacity;
    el.style.transition = 'none';
    el.style.opacity = '0';
    void el.getBoundingClientRect();
    el.style.transition = 'opacity .8s ease ' + delay + 'ms';
    el.style.opacity = target;
  }
  function drawLine(path, delay){
    var len;
    try { len = path.getTotalLength(); } catch(e){ return; }
    if (!len) return;
    path.style.transition = 'none';
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
    void path.getBoundingClientRect();
    path.style.transition = 'stroke-dashoffset 1.1s cubic-bezier(.22,.61,.36,1) ' + delay + 'ms';
    path.style.strokeDashoffset = '0';
  }
  function growBars(rects, delayBase){
    if (!rects.length) return;
    var widths = rects.map(function(r){ return parseFloat(r.getAttribute('width') || 0); });
    var heights = rects.map(function(r){ return parseFloat(r.getAttribute('height') || 0); });
    var wRange = Math.max.apply(null, widths) - Math.min.apply(null, widths);
    var hRange = Math.max.apply(null, heights) - Math.min.apply(null, heights);
    var horizontal = wRange > hRange;
    rects.forEach(function(r, i){
      r.style.transition = 'none';
      r.style.transformBox = 'fill-box';
      r.style.transformOrigin = horizontal ? 'left' : 'bottom';
      r.style.transform = horizontal ? 'scaleX(0)' : 'scaleY(0)';
      void r.getBoundingClientRect();
      var delay = delayBase + i * 45;
      r.style.transition = 'transform .7s cubic-bezier(.22,.61,.36,1) ' + delay + 'ms';
      r.style.transform = horizontal ? 'scaleX(1)' : 'scaleY(1)';
    });
  }
  function popDot(circle, delay){
    circle.style.transition = 'none';
    circle.style.transformBox = 'fill-box';
    circle.style.transformOrigin = 'center';
    circle.style.transform = 'scale(0)';
    void circle.getBoundingClientRect();
    circle.style.transition = 'transform .45s cubic-bezier(.34,1.56,.64,1) ' + delay + 'ms';
    circle.style.transform = 'scale(1)';
  }

  function revealSvg(svg){
    Array.prototype.forEach.call(svg.querySelectorAll('path'), function(p){
      var fill = getComputedStyle(p).fill;
      var hasDash = p.getAttribute('stroke-dasharray');
      if (fill === 'none') {
        if (hasDash) { fadeIn(p, 200); } else { drawLine(p, 0); }
      } else {
        fadeIn(p, 150);
      }
    });
    var groups = [];
    var seen = [];
    Array.prototype.forEach.call(svg.querySelectorAll('rect'), function(r){
      var parent = r.parentNode;
      var idx = seen.indexOf(parent);
      if (idx === -1) { seen.push(parent); groups.push([r]); }
      else { groups[idx].push(r); }
    });
    groups.forEach(function(g){ growBars(g, 0); });
    Array.prototype.forEach.call(svg.querySelectorAll('circle'), function(c, i){ popDot(c, 650 + i * 60); });

    svgs.forEach(function(s){ ioSvg.observe(s); });
  }

  function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }
  function formatNum(v, decimals, comma){
    var s = v.toFixed(decimals);
    if (comma) { var p = s.split('.'); p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ','); s = p.join('.'); }

  function animateCount(el){
    var raw = el.textContent;
    var m = raw.match(/^([^\d\-−]*)([\-−]?)([\d,]+(?:\.\d+)?)([^\d]*)$/);
    if (!m) return;
    var prefix = m[1], sign = m[2], digits = m[3], suffix = m[4];
    var comma = digits.indexOf(',') !== -1;
    var decimals = (digits.split('.')[1] || '').length;
    var end = parseFloat(digits.replace(/,/g, ''));
    if (isNaN(end)) return;
    var dur = 1200, t0 = null;
    function step(ts){
      if (!t0) t0 = ts;
      var p = Math.min((ts - t0) / dur, 1);
      var v = end * easeOutCubic(p);
      el.textContent = prefix + sign + formatNum(v, decimals, comma) + suffix;
      if (p < 1) requestAnimationFrame(step); else el.textContent = raw;
    }
    requestAnimationFrame(step);
  }
  var stats = document.querySelectorAll('.stat');

    var ioStat = new IntersectionObserver(function(entries){

  }

<body>
<!-- ========== 1 · RECOMMENDATION (light hero) ========== -->
<section class="light" id="opinion">
  <div class="w">
    <p class="eyebrow">Tenarai Corporation · Board Decision Paper · Korea Subsidiary</p>
    <h1>A $1.36 million commitment<br>that returns $10.4 million.</h1>
    <p class="lead" style="margin-top:22px;">Prepared for the Tenarai Corporation board: whether to establish a Korean
      subsidiary, what headquarters actually has to fund, when the funding stops, and how it comes back.</p>

    <div style="margin-top:34px;"><span class="verdict">Recommendation — Establish</span></div>

    <p style="max-width:64ch;">The base case returns a <strong>38.4% IRR</strong> and a <strong>7.7× return</strong> on a
      maximum headquarters outlay of <strong>$1.36 million</strong>, spread across six years and ending permanently in
      Year 6. That $1.36m is the whole exposure: the subsidiary holds no delivery organisation, no capital assets and no
      long-dated commitments, so headquarters can freeze the cost base inside one quarter at any point. A capped,
      quantified commitment against a return that clears a 15–20% internal hurdle by close to eighteen points is the reason
      to proceed — and it holds before any of the upside in Section 6 is credited.</p>

    <div class="metrics m4">
      <div><div class="v hl tnum">38.4%</div><div class="k">IRR, ten-year</div><div class="s">Group contribution basis</div></div>
      <div><div class="v tnum">7.7×</div><div class="k">Return on funds committed</div><div class="s">$10.44m ÷ $1.36m</div></div>
      <div><div class="v tnum">Y6</div><div class="k">Last year headquarters funds it</div><div class="s">Self-funding from 2033</div></div>
      <div><div class="v tnum">$1.36m</div><div class="k">Maximum headquarters outlay</div><div class="s">Cumulative, peak at Y6</div></div>
    </div>
    <p class="xs" style="margin-top:14px;">All figures are US dollars, converted from Korean won at the plan rate of
      ₩1,430 to the dollar (spot ₩1,434.21 on 4 August 2026). The underlying plan is denominated in won, so won amounts are
      the authoritative basis and are shown alongside where a reader needs to reconcile to the Korean-language source
      documents. Returns are calculated on group contribution — Korea-originated revenue at the group gross margin, less
      the Korean subsidiary's operating cost — not on the subsidiary's statutory P&amp;L, which depends on the
      transfer-pricing structure discussed in Section 8.</p>
  </div>
</section>

<!-- ========== 2 · THESIS (dark tile) ========== -->
<section class="dark" id="thesis">
  <div class="w">
    <p class="eyebrow" style="color:var(--accent);">The case</p>
    <h2>Five reasons to do this now.</h2>
    <p class="lead">Not "Korea is a big market." Five specific structural features of this particular subsidiary, in the
      order the board will test them.</p>

    <h3>1 · The commitment is capped, and the cap is small.</h3>
    <p>Cumulative headquarters outlay peaks at $1.36m at the end of Year 6, then goes to zero — the subsidiary funds
      itself from Year 7 onward. If the venture were closed at the end of Year 4, after four full years of evidence, the
      sunk cost would be $1.10m, before recovering the $35k office deposit and residual paid-in capital. For a group
      operating a 3,374-person delivery organisation, this is a bounded experiment.</p>

    <h3>2 · Asset-light by construction, so the cost base is reversible.</h3>
    <p>Engineering and delivery stay with the parent's India hubs. The Korean subsidiary carries sales, presales and
      delivery management only — no bench, no data centre, no capitalised development. Every cost line is headcount, rent
      or travel. That is what makes the review gates in Section 9 enforceable: a decision to stop is executable within a
      quarter, which is rarely true of a market entry that builds local delivery.</p>

    <h3>3 · The funding requirement is small, dated, and ends.</h3>
    <p>Headquarters funds an annual net gap of $24k–$312k across Years 1–6 (net of the 32% group gross margin the
      entity's own revenue already contributes), and nothing thereafter. This is an operating-budget decision on a
      scale headquarters reviews routinely — not a capital-raising exercise — and Section 9 sets out whether to provide
      it as a single capitalisation at establishment or year by year.</p>

    <h3>4 · The demand is appropriated, not forecast.</h3>
    <p>Korean financial institutions have tendered an estimated <strong>$1.4 billion</strong> of core-system replacement
      work for 2026–2027, including the largest single financial-sector IT contract in the country's history (NH NongHyup
      Bank 'NEO' Phase 1, $213.6m). This is budget already released through public tender — it does not depend on a market
      forecast being right. It is the direct target market for Tenarai-Archer.</p>

    <h3>5 · The return clears the hurdle with room to spare.</h3>
    <p>38.4% IRR and a $3.11m NPV at a 12% discount rate. Corporate market-entry commitments are typically underwritten
      against a 15–20% hurdle <span class="flag">[industry convention — no single source verified]</span>; this clears the
      top of that range by close to eighteen points, and still returns 31.9% if the group gross margin comes in three
      points below plan (see the gross-margin sensitivity table in Section 7).</p>
  </div>
</section>

<!-- ========== 3 · WHAT HQ FUNDS (light) ========== -->
<section class="light" id="exposure">
  <div class="w">
    <p class="eyebrow">Section 3</p>
    <h2>What headquarters actually funds.</h2>
    <p class="lead">Three different numbers get called "the investment." Only one of them leaves the group.</p>

    <div class="tw">
      <table class="txt">
        <caption>Reconciliation of the three figures — USD, converted at ₩1,430</caption>
        <thead>
          <tr><th>Figure</th><th style="text-align:right;">Amount</th><th>What it measures</th></tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>Subsidiary cash consumption</strong><br><span class="xs">Five-year gross spend</span></td>
            <td style="text-align:right;" class="tnum">$2.77m<br><span class="xs">₩3.964bn</span></td>
            <td>Total cash the Korean subsidiary spends over five years under the named hiring schedule (Part II §06-1),
              at the 5% annual salary escalation. Gross of any revenue it books. A treasury planning number, not a
              cost to the group.</td>
          </tr>
          <tr>
            <td><strong>Net cost to the group</strong><br><span class="xs">Peak cumulative outlay</span></td>
            <td style="text-align:right;" class="tnum hl">$1.36m<br><span class="xs">₩1.95bn</span></td>
            <td>Peak of cumulative group contribution, reached end of Year 6. <strong>This is the number that matters</strong>
              — the most the group is ever out of pocket before the subsidiary turns self-funding.</td>
          </tr>
          <tr>
            <td><strong>Funded at establishment</strong><br><span class="xs">Recommended paid-in capital</span></td>
            <td style="text-align:right;" class="tnum">$689k<br><span class="xs">₩985m</span></td>
            <td>Establishment cost plus 24 months of runway — the amount the board is asked to approve now under the
              recommendation in Section 9.</td>
          </tr>
          <tr class="emph">
            <td>Cost if closed at end of Year 3</td>
            <td style="text-align:right;" class="tnum">$848k<br><span class="xs">₩1.21bn</span></td>
            <td>The realistic worst case under the Year 3 review gate — three years of evidence for well under a million
              dollars, before recovery of the office deposit and residual capital.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <h3>The annual funding requirement, and when it stops</h3>
    <p>The group's net cash outflow each year is the contribution deficit. It never exceeds $312k in any single year, and
      it ends in Year 7.</p>
    <div class="tw">
      <table>
        <caption>Headquarters funding requirement by year — USD thousand (named hiring schedule, Part II §06-1, 5% escalation)</caption>
        <thead><tr><th>Year</th><th>Y1</th><th>Y2</th><th>Y3</th><th>Y4</th><th>Y5</th><th>Y6</th><th>Y7</th><th>Y8+</th></tr></thead>
        <tbody>
          <tr><td>Net funding required</td><td>312</td><td>265</td><td>271</td><td>257</td><td>234</td><td class="hl">24<sup>†</sup></td><td>nil</td><td class="hl">nil</td></tr>
          <tr class="emph"><td>Cumulative</td><td>−312</td><td>−577</td><td>−848</td><td>−1,105</td><td>−1,339</td><td class="hl">−1,362</td><td>−890</td><td>turns positive Y8</td></tr>
        </tbody>
      </table>
    </div>
    <p class="xs">†Year 6 still requires a small $24K of net funding; Year 7 group contribution turns positive (+$472K) and
      no further net funding is required from Year 7 onward. <strong>Peak cumulative HQ funding exposure is $1.36M, reached
      at the end of Year 6</strong> — this is the number to size the funding commitment against, not the $2.77M gross
      five-year spend in Part II (which is before revenue is netted off). Cumulative outlay turns positive in Year 8 — the
      5% annual escalation (up from 3%) pushes peak exposure and the last funded year out by roughly one year versus
      the 3% version, but the payback year is unchanged because the same higher payroll also compounds group contribution
      once the entity is producing.</p>

    <div class="callout">
      <p><strong>The establishment cost itself is immaterial.</strong> Incorporation, registration tax, notarisation and
        agency fees total <strong>$39k</strong>; the $44k headline includes a $35k office deposit, which is a recoverable
        asset rather than an expense. Set-up cost is not where this decision is made.</p>
    </div>

    <h3>The cost base is 100% discretionary</h3>
    <p>Operating cost is built from a named role-by-role hiring schedule (Part II §06-1) through Year 5, then extended on
      the same methodology through Year 10 — each new head costed by function and escalated at 5% a year by contract from
      date of hire, rather than a flat headcount × $84K × 3% formula. Headcount still runs from 3 people in Year 1 to 50
      in Year 10, and none of it is delivery capacity that must be kept warm between projects — the single most common way
      a market-entry vehicle destroys capital. The role-based build costs <em>less</em> on average than the old flat
      per-head figure once the org passes six or seven people, because most of the growth is junior AE,

<!-- ========== 4 · MARKET (parchment) ========== -->
<section class="parch" id="market">
  <div class="w">
    <p class="eyebrow">Section 4</p>
    <h2>Korea: a large market where the target share is a rounding error.</h2>
    <p class="lead">The question is not whether the market is big enough. It is whether a target this small inside a market
      this large is credible — and against what evidence.</p>

    <div class="metrics m3">
      <div><div class="v tnum">$53.6bn</div><div class="k">TAM · Korean IT services, 2030</div><div class="s">₩76.7tn</div></div>

      <div><div class="v hl tnum">0.065%</div><div class="k">SOM · Year 10 target as share of TAM</div><div class="s">$35.0m revenue</div></div>
    </div>

    <h3>Demand that is already tendered</h3>
    <p>Market-sizing studies disagree by a factor of 1.5 on the size of Korean IT services — $23.2bn to $35.8bn for
      2025, depending on whether hardware maintenance, BPO and telecom services are counted. That disagreement does not
      matter here, because the entity's primary target is a set of contracts that have already been put out to tender.</p>

    <div class="tw">
      <table class="txt">
        <caption>Confirmed financial-sector programmes, 2026–2028</caption>
        <thead><tr><th>Programme</th><th style="text-align:right;">Value</th><th>Status</th></tr></thead>
        <tbody>
          <tr><td>Financial-sector large IT programmes, aggregate</td><td style="text-align:right;" class="tnum">$1.4bn+</td><td>Two-year tender pipeline, 2026–2027, industry estimate</td></tr>
          <tr><td>NH NongHyup Bank 'NEO' Phase 1</td><td style="text-align:right;" class="tnum">$213.6m</td><td>Awarded to LG CNS · 27 months to April 2028 · largest single financial-sector IT contract on record in Korea</td></tr>
          <tr><td>NH NongHyup Bank, Phases 1+2 combined</td><td style="text-align:right;" class="tnum">$420–434m</td><td>Phase 2 (information systems) projected</td></tr>
          <tr><td>NongHyup Mutual Finance information systems</td><td style="text-align:right;">undisclosed</td><td>SK AX selected · 25 months to January 2028 · 1,110 branches</td></tr>
        </tbody>
      </table>
    </div>
    <p>Against that pipeline, the Year 10 target of $35.0m is 2.5% of two years of tendered financial-sector work, and 16%
      of one bank's single programme. The prime-contractor position on these programmes belongs to Korea's three large
      domestic system integrators and is not realistically open to a newly incorporated foreign entity — the plan
      therefore books the specialist-subcontractor position instead, at 15% of Year 10 revenue.</p>

    <h3>The second demand driver is structural, not cyclical</h3>
    <p>Korean universities produce 22,000–25,000 IT graduates a year against demand in AI, automation and modernisation
      that materially exceeds supply; the national AI talent shortfall runs above 7%. This is what Hybrid Agentic PODs
      sells into, and it is the same shortage FPT monetised through its Vietnam delivery model after entering Korea in
      2016. Tenarai can reproduce that structure with a 3,374-person India hub.</p>

    <h3>Three precedents, all still operating</h3>
    <div class="tw">

    <p class="xs">FPT reached roughly 30 clients in its sixth year in Korea. This plan reaches 45 clients in Year 10 with a

<!-- ========== 6 · ACCELERATED PAYBACK (dark tile) ========== -->
<section class="dark" id="accelerate">
  <div class="w">
    <p class="eyebrow" style="color:var(--accent);">Section 6</p>
    <h2>Why payback should arrive earlier than Year 8.</h2>
    <p class="lead">The base case contains a conservatism worth naming: it assumes the entity captures essentially none of
      the largest confirmed demand event in its target market — which happens to fall in its first two years.</p>

    <p>The plan books $70k in Year 1 and $280k in Year 2. Over exactly that window, Korean financial institutions are
      tendering $1.4bn of core-system replacement work. The base case therefore prices in a near-total miss on 2026–2027.
      That may be the right planning assumption for a business with no local track record — but it is not the expected
      outcome, and the difference between the two is where the early payback lives.</p>

    <h3>Three levers, each independently achievable</h3>
    <ul class="clean">
      <li><strong>One subcontract package on a tier-one core-banking programme.</strong> Korea's large SIs routinely
        subcontract specialist data-migration and legacy-modernisation scope — precisely Tenarai-Archer's competency. A
        single $420–700k package spread over two years moves Year 2–3 revenue by more than the entire base-case plan for
        those years.</li>
      <li><strong>Partner co-sell activated in Year 1 rather than Year 3.</strong> The parent already holds global
        partnerships with Databricks, Google Cloud, Salesforce, Adobe and Microsoft. Their Korean subsidiaries are a warm
        channel requiring introduction, not business development, and the plan itself identifies this as the shortest path
        in the first two years — then does not credit it until Year 3.</li>
      <li><strong>Global account succession.</strong> Existing Fortune 500 clients with Korean operations can be extended
        into Korea without new logo acquisition. The plan books this at 10% of Year 10 revenue but zero before it.
        <span class="flag">[The parent's list of global accounts with Korean sites has not been obtained — this lever is unquantified until it is.]</span></li>
    </ul>

    <p style="margin-top:26px;">The mechanism is worth being precise about: acceleration improves the multiple far more than
      it improves the return, because earlier revenue does not merely arrive sooner — it <em>lowers the peak</em>. Revenue
      that lands while the entity is still loss-making offsets the trough directly, so maximum exposure falls from $1.36m
      to $720k. The group risks about half as much capital to earn more.</p>

    <p class="xs">The accelerated case is this report's own construction. Revenue is built from the three levers above with
      headcount raised proportionally (52 people at Year 10 against 50 in the base case); the 32% gross margin and 5%
      annual salary-escalation assumptions are unchanged. It is not a forecast and carries no external validation — it
      quantifies what the levers are worth if they land.</p>

    <div class="callout">
      <p><strong>The downside case is the one that matters, and it is survivable — provided the hiring gate actually
