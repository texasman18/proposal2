<!-- ================= 13 RISKS ================= -->
<section id="s13">
  <span class="sec-no">13 — Risks &amp; Open Decisions</span>
  <h2>What could make this plan wrong</h2>

  <div class="bento">
    <div class="card sp3">
      <h4>Blocking — must be resolved before Month 6</h4>
      <ul class="clean">
        <li><strong>Do any current Tenarai Fortune 500 clients operate Korean business units?</strong> Unknown. It is the cheapest possible source of a first Korean reference and it determines whether Tier 3 in §7 exists at all. Requires an internal account-list review, nothing more.</li>
        <li><strong>Transfer-pricing structure.</strong> The Revenue Plan notes that under a commissionaire model the same commercial performance reports as USD 2.8–5.2M rather than USD 35M. Marketing's budget in Years 3+ is a percentage of revenue, so this decision silently determines the marketing budget for the entire plan.</li>
        <li><strong>Is the Month-20 brand investment funded, and at which scenario?</strong> §6 and §10 cannot both be half-approved.</li>
      </ul>
    </div>
    <div class="card sp3">
      <h4>Risks — named, with the response</h4>
      <ul class="clean olive">
        <li><strong>The burst lands before the entity can contract.</strong> Highest-probability failure mode. Response: Month 20 is a floor, not a fixture — if vendor registrations or the first two references slip, the burst slips with them. Media contracts should be signed with that flexibility priced in.</li>
        <li><strong>Creative misfires culturally.</strong> The obituary execution in particular. Response: Korean creative sign-off with a named approver; the advisory board member reviews all five executions before production.</li>
        <li><strong>Community seeding is read as astroturfing.</strong> Korean professional communities punish this severely and permanently. Response: real names and disclosure, or nothing. Stated as a rule in §6.</li>
        <li><strong>Competitor response.</strong> Wipro has 20 years of Korean relationships and a Seoul Innovation Center; a visible foreign entrant may prompt a defensive push. Response: none available, and none needed — the plan does not depend on being unnoticed.</li>
        <li><strong>The self-reported performance claims get challenged.</strong> Tenarai's global figures are unvalidated by third parties. Response: §3 rule 2, applied without exception in Korea.</li>
      </ul>
    </div>
    <div class="card sp6">
      <h4>What this plan does not cover</h4>
      <p>Product marketing for individual solutions beyond Archer and Hybrid Agentic PODs; Korean channel-partner recruitment beyond the existing technology partners; any marketing supporting the acquisition screening the Revenue Plan places in Years 6–10; and paid media beyond the Month-20 burst and always-on LinkedIn and Naver Search Ad. Each is a Year-4 conversation, and naming them here is more useful than implying they are handled.</p>
    </div>
  </div>
</section>

(function(){
  var btn=document.getElementById('themeToggle');
  var root=document.documentElement;
  function current(){

    if(set) return set;
    return window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  }
  btn.addEventListener('click',function(){

/* ============================================================
   Scroll-triggered motion — count-up on the figures that carry the
   argument, clip-path reveal on the chart bars.

   Deliberately NOT animated: section entrances, cards, callouts, timeline
   rows, table cells. A 14-section report where every block fades in on
   scroll slows reading and adds nothing; motion here is limited to the two
   places where it does a job — pulling the eye to the number, and letting a
   ranked chart resolve in rank order.
   ============================================================ */
(function(){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var NUM = /\d[\d,]*(?:\.\d+)?/g;
  var counters = [];

  /* Wrap every numeric token in its own span so surrounding text —
     "USD 35K/yr", "~5.8%", "330 / 562" — survives untouched. */
  function prepare(el){
    var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
    var nodes = [], n;
    while ((n = walker.nextNode())) { if (NUM.test(n.nodeValue)) nodes.push(n); NUM.lastIndex = 0; }
    var made = [];
    nodes.forEach(function(node){
      var frag = document.createDocumentFragment(), last = 0, m;
      NUM.lastIndex = 0;
      while ((m = NUM.exec(node.nodeValue))) {
        if (m.index > last) frag.appendChild(document.createTextNode(node.nodeValue.slice(last, m.index)));
        var s = document.createElement('span');
        s.className = 'cnt';
        s.textContent = m[0];
        frag.appendChild(s);
        made.push(s);
        last = m.index + m[0].length;
      }
      if (last < node.nodeValue.length) frag.appendChild(document.createTextNode(node.nodeValue.slice(last)));
      node.parentNode.replaceChild(frag, node);
    });
    return made;
  }

  function format(value, sample){
    var dec = (sample.split('.')[1] || '').length;
    var out = value.toFixed(dec);
    if (sample.indexOf(',') > -1) {
      var parts = out.split('.');
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      out = parts.join('.');
    }
    return out;
  }

  /* easeOutQuint — strong deceleration, no overshoot. An investment-committee
     document should not bounce. */
  function ease(t){ return 1 - Math.pow(1 - t, 5); }

  function run(spans, duration, delay){
    var start = null;
    function frame(ts){
      if (start === null) start = ts;
      var t = Math.min(1, (ts - start) / duration);
      var k = ease(t);
      spans.forEach(function(s){
        s.textContent = format(s._to * k, s._sample);
      });
      if (t < 1) requestAnimationFrame(frame);
      else spans.forEach(function(s){ s.textContent = s._sample; });
    }
    setTimeout(function(){ requestAnimationFrame(frame); }, delay || 0);
  }

  function finalize(){
    counters.forEach(function(g){ g.spans.forEach(function(s){ s.textContent = s._sample; }); });
    document.querySelectorAll('.bar-fill').forEach(function(b){ b.classList.add('in'); });
  }

  /* Print must never capture a half-counted figure or an unfilled bar. */
  window.addEventListener('beforeprint', finalize);

  if (reduce.matches) return;              // nothing prepared, nothing hidden
  document.documentElement.classList.add('js-anim');

  /* --- figures: stat numbers, bar value labels, the live-counter ad --- */
  document.querySelectorAll('.big, .bv, .ad-count').forEach(function(el){
    var spans = prepare(el);
    if (!spans.length) return;
    spans.forEach(function(s){
      s._sample = s.textContent;
      s._to = parseFloat(s.textContent.replace(/,/g, ''));
      s.textContent = format(0, s._sample);
    });
    counters.push({ el: el, spans: spans });
  });

  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if (!e.isIntersecting) return;
      io.unobserve(e.target);
      var t = e.target;

      if (t.classList.contains('bars')) {
        // Bars resolve top-to-bottom so the ranking reads in order.
        var fills = t.querySelectorAll('.bar-fill');
        fills.forEach(function(f, i){
          f.style.setProperty('--d', Math.min(i * 55, 550) + 'ms');
          f.classList.add('in');
        });
        t.querySelectorAll('.bv').forEach(function(v, i){
          var g = counters.find(function(c){ return c.el === v; });
          if (g) run(g.spans, 560, Math.min(i * 55, 550));
        });
        return;
      }

      var grp = counters.find(function(c){ return c.el === t; });
      if (grp) run(grp.spans, t.classList.contains('ad-count') ? 900 : 720, 0);
    });
  }, { threshold: 0.35, rootMargin: '0px 0px -8% 0px' });

  document.querySelectorAll('.bars').forEach(function(b){ io.observe(b); });
  counters.forEach(function(c){ if (!c.el.closest('.bars')) io.observe(c.el); });

  /* If the reader turns reduced-motion on mid-session, settle immediately. */
  var onChange = function(e){ if (e.matches) { io.disconnect(); finalize(); } };
  if (reduce.addEventListener) reduce.addEventListener('change', onChange);
  else if (reduce.addListener) reduce.addListener(onChange);
})();
<\/script>

<script>
  function loadFrame(scriptId, frameId) {
    var htmlSrc = document.getElementById(scriptId).textContent;
    htmlSrc = htmlSrc.split('<\\/script').join('</script');
    var frame = document.getElementById(frameId);
    var doc = frame.contentDocument || frame.contentWindow.document;
    doc.open(); doc.write(htmlSrc); doc.close();
  }
  loadFrame('src-a', 'frame-a');
  loadFrame('src-b', 'frame-b');
  loadFrame('src-c', 'frame-c');
  loadFrame('src-d', 'frame-d');
  loadFrame('src-e', 'frame-e');

  var tabs = document.querySelectorAll('.tab');
  var panels = document.querySelectorAll('.panel');
  tabs.forEach(function (tab) {
    tab.addEventListener('click', function () {
      tabs.forEach(function (t) { t.classList.remove('active'); t.setAttribute('aria-selected', 'false'); });
      panels.forEach(function (p) { p.classList.remove('active'); });
      tab.classList.add('active'); tab.setAttribute('aria-selected', 'true');
      document.getElementById(tab.dataset.target).classList.add('active');
    });
  });
</script>
