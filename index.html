    <h3>Sensitivity to group gross margin</h3>
    <p>Gross margin is the single most powerful variable in the model, because Korean operating cost is fixed against it.
      A three-point miss costs roughly six-and-a-half points of IRR; a six-point miss costs fourteen and pushes the peak
      outlay up by roughly $500k.</p>

    <h3>The country-manager adjustment the board would have asked for — already resolved</h3>

<!-- ========== 9 · HOW HQ FUNDS IT (light) ========== -->
<section class="light" id="structure">
  <div class="w">
    <p class="eyebrow">Section 9</p>
    <h2>How headquarters should provide the money.</h2>
    <p class="lead">Two questions, and they are separate: <em>when</em> the money goes in — once at establishment, or year
      by year — and <em>in what form</em> — paid-in capital or an intercompany loan.</p>

    <h3>Question one — one capitalisation, or annual funding?</h3>
    <div class="tw">
      <table class="txt">
        <caption>Funding timing — comparison</caption>
        <thead><tr><th style="width:20%;">Factor</th><th style="width:40%;">One capitalisation at establishment</th><th>Annual funding by capital increase</th></tr></thead>
        <tbody>
          <tr>
            <td><strong>Amount</strong></td>
            <td>$689k (₩985m) paid in once — establishment cost plus 24 months of runway, per the establishment report's
              own recommendation. Stated on a gross operating-cost basis, so it exceeds the $577k of net group
              cost in Years 1–2.</td>
            <td>Minimum capital at establishment, then $234–312k a year for six years (net of group gross margin)</td>
          </tr>
          <tr>
            <td><strong>Registration tax</strong></td>
            <td>$8,137 (₩11.64m) once. Seoul sits in the over-concentration control region, so registration tax is charged
              at 1.2% rather than 0.4%, plus 20% local education tax — an effective 1.44% of capital.</td>
            <td><strong>Identical in total.</strong> The tax is proportional to cumulative capital, so splitting it changes
              nothing: ₩11.64m either way.</td>
          </tr>
          <tr>
            <td><strong>Transaction cost</strong></td>
            <td>One registration, one foreign-investment filing.</td>
            <td>Five additional capital-increase registrations at ₩500k–800k each, plus five amended foreign-investment
              filings — <strong>$1,700–2,800 of pure friction</strong> and roughly two weeks of administration per round.</td>
          </tr>
          <tr>
            <td><strong>Credibility effects</strong></td>
            <td>Higher stated capital supports enterprise vendor qualification and the D-8 investor visa for any seconded
              executive. Korean enterprise buyers routinely check registered capital during vendor screening.</td>
            <td>Low stated capital in the early years is a visible negative in exactly the two processes — vendor screening
              and visa issuance — that Years 1–2 depend on.</td>
          </tr>
          <tr>
            <td><strong>Headquarters cash control</strong></td>
            <td>Cash sits in the subsidiary. Recovering unspent capital requires a capital reduction or liquidation.</td>
            <td>Cash stays at headquarters until needed.</td>
          </tr>
          <tr>
            <td><strong>Ability to stop</strong></td>
            <td>Unchanged — controlled by annual operating-budget approval, not by the funding schedule.</td>
            <td>Unchanged, for the same reason.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="callout">
      <p><strong>Annual funding buys no control that headquarters does not already have.</strong> Because the subsidiary is
        asset-light, the real stop lever is the annual operating budget, not the capital account — headquarters can halt
        hiring and close the entity within a quarter whether the capital was paid in once or six times. Drip-feeding
        therefore adds $1,700–2,800 of registration friction and five rounds of filings, weakens vendor screening and visa
        positioning in the two years that most depend on them, and returns nothing in exchange.</p>
    </div>

    <h3>Question two — capital or intercompany loan?</h3>
    <div class="tw">
      <table class="txt">
        <caption>Funding instrument — comparison</caption>
        <thead><tr><th style="width:20%;">Factor</th><th style="width:40%;">Paid-in capital (equity)</th><th>Intercompany loan from parent</th></tr></thead>
        <tbody>
          <tr><td><strong>Foreign-investment status</strong></td>
            <td>Qualifies as foreign direct investment (minimum ₩100m and at least 10% of voting shares), which is what
              enables foreign-invested-company registration and the D-8 visa.</td>
            <td>Does not qualify. A loan-funded entity cannot rely on foreign-investment registration.</td></tr>
          <tr><td><strong>Registration tax</strong></td>
            <td>1.44% of capital in Seoul.</td>
            <td>None.</td></tr>
          <tr><td><strong>Tax treatment</strong></td>
            <td>No deduction, no withholding. Clean.</td>
            <td>Interest is deductible in Korea but attracts withholding tax, must be set at arm's length, and is subject to
              Korea's thin-capitalisation rules, which disallow interest on related-party debt above a prescribed
              debt-to-equity ratio. <span class="flag">[Current ratio and withholding rate to be confirmed with Korean tax counsel.]</span></td></tr>
          <tr><td><strong>Recovery of funds</strong></td>
            <td>Capital reduction or liquidation — slow.</td>
            <td>Repayable on terms. Faster to recover.</td></tr>
        </tbody>
      </table>
    </div>

    <h3>Question three — once the entity is profitable, how does headquarters get money back out?</h3>
    <p class="lead">Equity in, cash back out. This report assumes Tenarai Korea is a <strong>100% wholly-owned
      subsidiary</strong> — no JV partner appears anywhere in the source documents, and a single-shareholder structure
      is standard for a technical-sales subsidiary at this scale <span class="flag">[assumption — HQ investment
      committee decision]</span>. Four ratios govern how much of the entity's profit headquarters actually receives,
      and how much stays in Korea.</p>

    <div class="tw"><table class="txt">
      <caption>Repatriation mechanics — rate, source, and where it applies</caption>
      <thead><tr><th style="width:22%;">Step</th><th>Rate</th><th style="text-align:left;">Basis</th></tr></thead>
      <tbody>
        <tr><td><strong>1. Korean corporate income tax</strong></td><td class="tnum">20%</td>
          <td style="text-align:left;">2026 statutory bracket for taxable income KRW 200M–20.0bn (NTS, effective for fiscal years
            beginning 1 Jan 2026 onward). The entity's projected annual pretax contribution stays inside this bracket
            through at least Year 10 (~KRW 8.7bn), so 20% is the effective rate throughout the horizon modelled here — not
            the 9–10% headline rate that only applies below KRW 200M. <span class="flag">[Statutory net income differs
            from the group-contribution figures used elsewhere in this report — see the transfer-pricing caveat above;
            treat this section as the mechanism and ratios, not a final KRW figure, until transfer pricing is settled.]</span></td></tr>
        <tr><td><strong>2. Legal reserve (이익준비금)</strong></td><td class="tnum">≥10% of cash dividend</td>
          <td style="text-align:left;">Korean Commercial Act art. 458 — a company must set aside at least one-tenth of
            each period's cash dividend as a legal reserve until the reserve reaches half of paid-in capital (KRW 150M
            on the KRW 300M assumption in Part II §05). This amount cannot leave Korea; it is trapped capital by law,
            not a policy choice.</td></tr>
        <tr><td><strong>3. Dividend withholding tax</strong></td><td class="tnum">10%</td>
          <td style="text-align:left;">Korea–US tax treaty, applied at source before remittance, versus 20% under
            domestic law alone. The treaty's reduced rate applies because the US parent holds 10% or more of voting
            shares — a 100% subsidiary clears this easily. <span class="flag">[Confirm the exact treaty article and
            ownership-holding-period condition with Korean tax counsel before relying on the 10% rate.]</span></td></tr>
        <tr><td><strong>4. Payout ratio</strong></td><td class="tnum">0% Y1–7 · 50% recommended from Y8</td>
          <td style="text-align:left;">Not a legal requirement — a policy recommendation. No dividend is realistic
            before the entity is self-funding (Year 6) and has cleared the closure/reset gates in Section 9; this report
            recommends retaining 100% of after-tax profit through Year 7 to build a working-capital buffer, then a 50%
            payout from Year 8 once cumulative contribution has turned positive.</td></tr>
      </tbody>
    </table></div>

    <h3>Illustrative split, Years 8–10 — group contribution basis</h3>
    <div class="tw"><table>
      <caption>USD, applying the four ratios above to the annual group contribution figures in Section 5</caption>
      <thead><tr><th style="text-align:left;">Year</th><th>Pretax</th><th>Korean tax (20%)</th><th>After-tax</th><th>Dividend declared (50%)</th><th>Legal reserve (10%)</th><th>Withholding (10%)</th><th class="hl">Net to HQ</th><th>Retained in Korea</th></tr></thead>
      <tbody>
        <tr><td style="text-align:left;">Y8</td><td>$1,402,688</td><td>$280,538</td><td>$1,122,150</td><td>$561,075</td><td>$56,108</td><td>$50,497</td><td class="hl">$454,471</td><td>$561,075</td></tr>
        <tr><td style="text-align:left;">Y9</td><td>$3,187,344</td><td>$637,469</td><td>$2,549,875</td><td>$1,274,938</td><td>$127,494</td><td>$114,744</td><td class="hl">$1,032,699</td><td>$1,274,938</td></tr>
        <tr><td style="text-align:left;">Y10</td><td>$6,742,760</td><td>$1,348,552</td><td>$5,394,208</td><td>$2,697,104</td><td>$269,710</td><td>$242,739</td><td class="hl">$2,184,654</td><td>$2,697,104</td></tr>
      </tbody>
    </table></div>
    <p class="note">On this framework, headquarters nets roughly <strong>32 cents of every pretax contribution dollar</strong>
      in cash (20% corporate tax, then a 50% payout split, then a 10% legal reserve followed by 10% withholding on what
      remains — 0.80 × 0.50 × 0.90 × 0.90 = 0.324 on the dividend path, plus the retained 50% stays in Korea as growth
      capital rather than being lost). The other 68 cents is split between Korean corporate tax, the legal reserve, and
      the retained-earnings half kept in Korea to fund continued headcount growth without further capital calls from HQ.
      This is a mechanism demonstration on the group-contribution figures used throughout this report, not a substitute
      for a statutory Korea-entity P&amp;L once transfer pricing is settled.</p>

    <h3>Recommendation</h3>
    <ul class="clean">
      <li><strong>Capitalise once at establishment: $689k (₩985m) in paid-in capital.</strong> This covers establishment
        cost and 24 months of runway, keeps stated capital at a level that survives enterprise vendor screening, and
        supports the D-8 visa if an executive is seconded.</li>
      <li><strong>Control the commitment through annual operating-budget approval, not through the capital account.</strong>
        Headquarters approves each year's budget against the gates below. This is where the ability to stop actually lives.</li>
      <li><strong>Fund Years 3–5 through a single further capital increase at the Year 3 gate</strong> — $271k, $257k and
        $234k of net group cost, $762k in total — rather than three separate rounds, to avoid repeating the
        registration friction above. The named hiring schedule at 5% annual escalation turns the entity
        self-funding at Year 7 — one year later than the 3% version's Year 6, back to the level of the pre-named-schedule
        baseline this report superseded.</li>
      <li><strong>Use an intercompany loan only as a short-term bridge</strong>, never as the primary funding route, given
        the thin-capitalisation and withholding consequences and the loss of foreign-investment status.</li>
    </ul>

    <h3>Annual review gates</h3>
    <div class="ladder">
      <div>
        <div><div class="amt tnum">$689k<span>₩985m · at establishment</span></div></div>
        <div>
          <h4>Establish and prove — Years 1–2</h4>
          <p class="small muted" style="margin:0;">Incorporation, registration and 24 months of runway. Funds the

          <p class="small muted" style="margin:0;">Covers the remaining funding requirement through to cash breakeven in
            Year 7, after which the subsidiary is self-funding and headquarters provides nothing further. Size this at the
            Year 3 gate against the then-current forecast — the group's remaining net cost is $762k on present
            assumptions, and the subsidiary's own capital need will be lower to the extent it collects revenue, which
            depends on the transfer-pricing policy.</p>
        </div>
        <div class="gate"><strong>Gate:</strong> two citable Korean references with client consent to publish; five
          enterprise vendor registrations; three partner co-sell opportunities registered.</div>
      </div>
      <div>
        <div><div class="amt tnum" style="color:var(--ink-48);">Stop<span>end of Year 3</span></div></div>
        <div>
          <h4>Closure gate</h4>
          <p class="small muted" style="margin:0;">If Year 3 revenue is below $490k and no tier-2 build project has been
            won, close the subsidiary rather than approve the Year 4 budget. Because there is no delivery organisation to
            unwind, closure is executable within a quarter.</p>
        </div>
        <div class="gate"><strong>Cost ceiling:</strong> approximately $848k, before recovery of the office deposit and

      </div>
      <div>
        <div><div class="amt tnum" style="color:var(--ink-48);">Reset<span>end of Year 8</span></div></div>
        <div>
          <h4>Target reset gate</h4>
          <p class="small muted" style="margin:0;">If no anchor accounts have been secured by the end of Year 8, formally

        </div>
        <div class="gate"><strong>Effect:</strong> return falls from 7.7× to 4.9×, assuming the Year 3 hiring gate holds

    <h3>Conditions to satisfy before capital is paid in</h3>
    <ul class="clean">
      <li><strong>Transfer-pricing structure confirmed as the principal model</strong> by group tax, with Korean tax counsel
        engaged. Without this, the revenue target has no defined meaning and the parent carries permanent-establishment

      <li><strong>Parent gross margin verified</strong> on engagements comparable to those planned for Korea. The 32%

      <li><strong>Office location decided.</strong> Registration tax triples inside the Seoul over-concentration control

<!-- ========== 10 · CONCLUSION (dark tile) ========== -->
<section class="dark" id="conclusion">
  <div class="w narrow">
    <p class="eyebrow" style="color:var(--accent);">Conclusion</p>
    <h2>The decision.</h2>
    <p class="lead">The question in front of the board is not whether Tenarai can build a $35 million business in Korea in
      ten years. It is whether $689,000 and an annual budget line are worth committing to find out.</p>
    <p>They are. The base case returns 38.4% on a maximum group outlay of $1.36m that ends permanently in Year 6. The
      downside — half the revenue, no anchor accounts, hiring held at the Year 3 level under the Section 9 gate — still
      returns 4.9× and a positive $2.15m of present value, provided that gate is actually enforced rather than waived.
      The accelerated case, which requires only that the subsidiary participate at all in the $1.4bn of demand already
      tendered in its first two years, cuts the outlay by close to half and lifts the return to 50%.</p>
    <p>Two structural facts make this unusual. The subsidiary is asset-light, so headquarters can stop the cost base rather
      than unwind it. And the demand is appropriated rather than forecast, so the market risk is one of competitive access,
      not of market existence. Those two together are what make a bounded commitment rational here where it would not be
      for a market entry that had to build local delivery against a projected market.</p>
    <p><strong>Recommendation: approve establishment of the Korean subsidiary and a single capitalisation of $689,000
      (₩985 million, covering setup cost plus a 24-month runway), subject to the transfer-pricing structure being
      confirmed as the principal model before the capital is paid in. Fund Years 3–5 through one further capital
      increase at the Year 3 gate. Control the commitment through annual operating-budget approval, and treat the
      Year 3 hiring gate as a binding governance commitment, not a passing mention — the downside case's return
      depends on it firing.</strong></p>
  </div>

  function drawLine(path, delay){
    var len;

    if (!len) return;
    path.style.transition = 'none';
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;

    path.style.strokeDashoffset = '0';
  }
  function popDot(circle, delay){
    circle.style.transition = 'none';
    circle.style.transformBox = 'fill-box';
    circle.style.transformOrigin = 'center';
    circle.style.transform = 'scale(0)';
    void circle.getBoundingClientRect();
    circle.style.transition = 'transform .45s cubic-bezier(.34,1.56,.64,1) ' + delay + 'ms';
    circle.style.transform = 'scale(1)';
  }
  function growBars(rects, delayBase){
    if (!rects.length) return;
    var widths = rects.map(function(r){ return parseFloat(r.getAttribute('width') || 0); });
    var heights = rects.map(function(r){ return parseFloat(r.getAttribute('height') || 0); });
    var wRange = Math.max.apply(null, widths) - Math.min.apply(null, widths);
    var hRange = Math.max.apply(null, heights) - Math.min.apply(null, heights);
    var horizontal = wRange > hRange;
    rects.forEach(function(r, i){
      r.style.transition = 'none';
      r.style.transformBox = 'fill-box';
      r.style.transformOrigin = horizontal ? 'left' : 'bottom';
      r.style.transform = horizontal ? 'scaleX(0)' : 'scaleY(0)';
      void r.getBoundingClientRect();
      var delay = delayBase + i * 45;
      r.style.transition = 'transform .7s cubic-bezier(.22,.61,.36,1) ' + delay + 'ms';
      r.style.transform = horizontal ? 'scaleX(1)' : 'scaleY(1)';
    });
  }

  function revealSvg(svg){
    Array.prototype.forEach.call(svg.querySelectorAll('path'), function(p){
      var fill = getComputedStyle(p).fill;

      if (fill === 'none') {
        if (hasDash) { fadeIn(p, 200); } else { drawLine(p, 0); }
      } else {
        fadeIn(p, 150);
      }
    });
    var groups = [];
    var seen = [];
    Array.prototype.forEach.call(svg.querySelectorAll('rect'), function(r){
      var parent = r.parentNode;
      var idx = seen.indexOf(parent);
      if (idx === -1) { seen.push(parent); groups.push([r]); }
      else { groups[idx].push(r); }
    });
    groups.forEach(function(g){ growBars(g, 0); });
    Array.prototype.forEach.call(svg.querySelectorAll('circle'), function(c, i){ popDot(c, 650 + i * 70); });
    Array.prototype.forEach.call(svg.querySelectorAll('.mk'), function(t, i){ fadeIn(t, 750 + i * 70); });

  function formatNum(v, decimals, comma){
    var s = v.toFixed(decimals);
    if (comma) { var p = s.split('.'); p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ','); s = p.join('.'); }

  function animateCount(el){
    var raw = el.textContent;
    var m = raw.match(/^([^\d\-−]*)([\-−]?)([\d,]+(?:\.\d+)?)([^\d]*)$/);
    if (!m) return;
    var prefix = m[1], sign = m[2], digits = m[3], suffix = m[4];
    var comma = digits.indexOf(',') !== -1;
    var decimals = (digits.split('.')[1] || '').length;
    var end = parseFloat(digits.replace(/,/g, ''));
    if (isNaN(end)) return;
    var dur = 1200, t0 = null;
    function step(ts){
      if (!t0) t0 = ts;
      var p = Math.min((ts - t0) / dur, 1);
      var v = end * easeOutCubic(p);
      el.textContent = prefix + sign + formatNum(v, decimals, comma) + suffix;

      });
    }, { threshold: 0.3 });

        if (pk) animateCount(pk);
        ioP.unobserve(fig);
      });
    }, { threshold: 0.3 });
    pkFigs.forEach(function(f){ ioP.observe(f); });
  }

/* ---------- motion ----------
   Bars reveal with clip-path (GPU-composited, no reflow, keeps the 4px end

  <h1>Korea Market-Entry Marketing Plan</h1>
  <p class="deck">A 36-month programme to convert a brand nobody in Korea has heard of into a name that appears on the shortlist before the sales team asks to be on it.</p>
  <div class="cover-meta">
    <span>Prepared for Tenarai HQ · Los Gatos, CA</span>

<!-- ================= 01 EXEC SUMMARY ================= -->
<section id="s1">
  <span class="sec-no">01 — Executive Summary</span>
  <h2>Three bets, one window, and a budget that does not yet exist</h2>
  <p class="lede">The Korea entity's revenue plan assumes marketing will produce 60 qualified first meetings in Year 1 and 400 by Year 10. It allocates USD 35,000 a year to do it. This plan accepts that operating budget and argues for one additional, ring-fenced line item — because the single hardest thing to buy in Korea is not leads, it is the right to be taken seriously.</p>

  <div class="bento">
    <div class="card sp4 row2">
      <h3>The situation in one paragraph</h3>
      <p>Wipro has been selling in Seoul since 2002 and now runs 250+ staff and a Seoul Innovation Center. FPT has been there since 2016 with 300+ local people. Infosys since 2010. Tenarai has no entity, no office, no Korean client of record, and a brand name that is four months old and unfamiliar to Korean buyers. Meanwhile 84% of B2B buyers say the <em class="q">first</em> vendor they contacted won the business — which means the entire commercial outcome is decided in a phase where Tenarai is currently invisible.</p>
      <p>Every marketing decision below follows from that asymmetry. We are not running a demand-generation programme against competitors we can outspend. We are running a <strong>legitimacy programme</strong> against incumbents we cannot outspend, in a market where legitimacy is the gate.</p>
    </div>
    <div class="card rust sp2">
      <span class="big">0%</span>
      <span class="lbl">Estimated unaided awareness of Tenarai among Korean enterprise IT buyers today. No entity, no office, no local reference.</span>
    </div>
    <div class="card sp2">
      <span class="big">84%</span>
      <span class="lbl">of B2B buyers said the first vendor they contacted won the deal <span class="pill p-conf">Confirmed</span></span>
    </div>
    <div class="card olive sp3">
      <span class="big sm">USD 35K/yr</span>
      <span class="lbl">Approved operating marketing budget, Years 1–2, per the Korea Revenue Plan. This plan works inside it.</span>
    </div>
    <div class="card sp3">
      <span class="big sm">KRW 150M</span>
      <span class="lbl">Additional one-time brand-investment ask (~USD 105K), ring-fenced, spent in Month 20 — not from the operating line. See §10.</span>
    </div>
  </div>

  <h3 class="sub">The three bets</h3>

  <div class="bento">
    <div class="card sp2 row2">
      <h4>Bet 1 — Borrow credibility before building it</h4>
      <p>Tenarai's global partner ecosystem (Databricks, Microsoft, AWS, Adobe, Google Cloud, Salesforce) and its analyst posture are the only assets that transfer to Korea on day one. Every one of those partners already has a Korean subsidiary with enterprise relationships Tenarai does not have.</p>
      <p><strong>Move:</strong> partner co-marketing is the Month 1 priority, not the Month 12 one. The Revenue Plan already assigns 25% of Year-10 revenue to partner co-sell — this plan front-loads the marketing that makes it real.</p>
    </div>
    <div class="card sp4">
      <h4>Bet 2 — Buy fame in a 3km radius, not a country</h4>
      <p>Tenarai will never need mass awareness. At Year 10 the plan calls for 45 active accounts. What it needs is for roughly two thousand specific people — enterprise IT executives who walk between Samseong Station, COEX, and the Teheran-ro towers — to have seen the name three times before an AE emails them. That is an out-of-home problem with a very small target, not a media-weight problem. <strong>An 8-week station takeover aimed at that corridor is the cheapest institutional-legitimacy purchase available to a foreign firm with no local track record.</strong></p>
    </div>
    <div class="card sp4">
      <h4>Bet 3 — Make the AI company market itself with AI</h4>
      <p>Tenarai sells agent orchestration and AI-accelerated delivery. The most persuasive proof available is a marketing operation visibly run on its own technology. Korea is unusually well-suited to this: <strong>public tender notices, DART disclosures and enterprise hiring postings are, functionally, free intent data</strong> — structured, public, and updated daily. Western intent providers have thin Korean coverage. Building the Korea intent engine on Tenarai-IGNIS turns a martech cost line into a referenceable case study. See §9.</p>
    </div>
  </div>

  <h3 class="sub">What this plan commits to</h3>
  <div class="tw">
    <table>
      <caption>Marketing outcomes by stage, derived backwards from the Revenue Plan's KPI targets (§11 defines measurement).</caption>
      <thead>
        <tr><th>Horizon</th><th>Marketing outcome</th><th class="num">Meetings sourced</th><th>Gate to clear</th></tr>
      </thead>
      <tbody>
        <tr><td><strong>Months 1–12</strong><br><span class="pill p-ver">Earn the right</span></td><td>Entity is registered, findable, and citable. Korean-language site live. 5+ conglomerate vendor registrations. 3 partner co-sell motions running.</td><td class="num">60</td><td>2 citable Korean references with named-client consent</td></tr>
        <tr><td><strong>Months 13–24</strong><br><span class="pill p-ver">Be seen</span></td><td>OOH + viral burst executed (Month 20). IT Builders Live Seoul launched. First analyst briefings held. Branded search on Naver measurable for the first time.</td><td class="num">~90</td><td>Measured lift in AE meeting-acceptance rate</td></tr>
        <tr><td><strong>Months 25–36</strong><br><span class="pill p-ver">Be shortlisted</span></td><td>Category position defended with 3+ references per vertical. Analyst report inclusion pursued. Employer brand active against the hiring constraint.</td><td class="num">120</td><td>First T2 build project won</td></tr>
      </tbody>
    </table>
  </div>
  <p class="tnote">Meeting figures for Months 1–12 and 25–36 are the Revenue Plan's Year 1 and Year 3 targets. The Months 13–24 figure is interpolated <span class="pill p-est">Estimated</span> — the Revenue Plan does not publish a Year 2 meeting target.</p>
</section>

<!-- ================= 02 DIAGNOSIS ================= -->
<section id="s2">
  <span class="sec-no">02 — Diagnosis</span>
  <h2>What we are actually up against</h2>
  <p class="lede">Three structural facts define the problem. None of them is "our messaging isn't sharp enough."</p>

  <h4 class="sub">Fact 1 — The deal is decided before marketing knows it exists</h4>
  <div class="body">
    <p>6sense's buyer research — 900+ B2B buyers surveyed June–July 2023, all of whom had completed purchases above USD 10,000 in the prior 24 months — found that buyers do not contact a vendor until roughly 70% of the way through their buying journey; by that point 78% have already fixed their requirements, and <strong>84% of buyers said the first vendor they contacted ultimately won</strong>. <span class="pill p-conf">Confirmed — 6sense primary source</span></p>
    <p>6sense's later Buyer Experience reporting describes a shift from that "70/30" pattern to a "60/40" one, with first contact moving earlier to about 61% of journey completion. <span class="pill p-ver">Single source — the 61% figure was not confirmed against the 6sense primary release and should be re-checked before external citation</span> The direction of that shift does not change the argument below; if anything it shortens the window further.</p>
    <p>Read against Korea, this is unforgiving. A firm that is not in the consideration set during the first 60% of the journey is not competing at a disadvantage — it is competing for the ~16% of deals that are still open. Marketing's job here is not lead capture. It is <em class="q">being one of the two or three names that come to mind unprompted</em>, months before an RFP exists.</p>
  </div>

  <h4 class="sub">Fact 2 — The incumbents' advantage is time, and time cannot be bought</h4>
  <div class="tw">
    <table>
      <caption>Competitive position in Korea. Sourced from the Korea Business Case v2 §3.</caption>
      <thead><tr><th>Firm</th><th>In Korea since</th><th>Local headcount</th><th>What that buys them</th></tr></thead>
      <tbody>
        <tr><td><strong>Wipro Korea</strong></td><td>2002</td><td>250+ (25% locally hired)</td><td>Two decades of vendor-registration history, government relationships (KRCF, NIPA), a Seoul Innovation Center opened March 2026</td></tr>
        <tr><td><strong>FPT Software Korea</strong></td><td>2016</td><td>300+ local, 2,500+ Vietnam remote</td><td>30+ Korean client engagements; a proven offshore-arbitrage narrative Korean buyers already understand</td></tr>
        <tr><td><strong>Infosys Korea</strong></td><td>2010</td><td>5 registered <span class="pill p-ver">likely understated</span></td><td>Global brand recognition without a large local footprint</td></tr>
        <tr><td><strong>Tenarai</strong></td><td>—</td><td>0</td><td>Nothing yet. Also: no legacy positioning to unlearn.</td></tr>
      </tbody>
    </table>
  </div>
  <p class="tnote">The last column matters more than it looks. Wipro, FPT and Infosys all entered Korea as systems integrators and have layered AI on top. Tenarai enters with no Korean legacy identity to contradict. That is the one place where being late is an asset — but only if the first impression is made deliberately rather than by default.</p>

  <h4 class="sub">Fact 3 — The market is real, growing, and about to get noisier</h4>
  <div class="bento">
    <div class="card sp3">
      <span class="big sm">55.7%</span>
      <span class="lbl">of 749 surveyed Korean companies already use generative AI — 22.4% company-wide, 33.2% in some departments. Among large enterprises, 35.1% use it company-wide. <span class="pill p-conf">Confirmed</span></span>
    </div>
    <div class="card sp3">
      <span class="big sm">85%</span>
      <span class="lbl">projected 2026 adoption including firms currently implementing or planning within 1–2 years; 74% report increased AI investment year-over-year. <span class="pill p-conf">Confirmed</span></span>
    </div>
    <div class="card olive sp6">
      <h4>The implication is uncomfortable</h4>
      <p>Korean enterprises are not waiting to be educated about AI. They are already buying. A "why AI matters" content programme — the default opening move for a services firm entering a market — would land two years late and mark Tenarai as a follower. <strong>The message must skip the category-education phase entirely and go straight to a claim about delivery.</strong></p>
    </div>
  </div>

  <div class="callout">
    <p>We are not selling AI to a market that doesn't understand it. We are selling <em class="q">execution</em> to a market that has already bought the idea and is now discovering how hard the work is.</p>
    <span class="who">The strategic pivot this plan is built on</span>
  </div>
</section>

<!-- ================= 03 STRATEGIC FRAME ================= -->
<section id="s3">
  <span class="sec-no">03 — Strategic Frame</span>
  <h2>What Tenarai claims in Korea, to whom, in what words</h2>
  <p class="lede">Positioning is not a tagline exercise. It is a decision about which fight to pick. The Revenue Plan already narrowed the offer to two things; the marketing frame must not be broader than the offer.</p>

  <h4 class="sub">The category claim</h4>
  <div class="bento">
    <div class="card ink sp6">
      <h3>"The last mile of enterprise AI."</h3>
      <p>Korea has five government-funded sovereign foundation-model teams (Naver Cloud, Upstage, SK Telecom, NC AI, LG AI Research) and three domestic SI giants with proprietary platforms (Samsung SDS, LG CNS, SK AX). None of the five model builders is a systems integrator. None of the three SI giants is AI-native. <strong>The gap between "we have a model" and "it is running in production against our core systems" is the entire market Tenarai should claim.</strong></p>
    </div>
    <div class="card sp3">
      <h4>What we do NOT claim</h4>
      <ul class="clean">
        <li><strong>Not a platform vendor.</strong> Selling Tenarai-IGNIS as a platform against Samsung SDS, LG CNS and SK AX with zero local track record is not a viable opening move — the Revenue Plan defers it past Year 5, and marketing must not undercut that.</li>
        <li><strong>Not a model builder.</strong> Positioning near the K-AI programme invites a comparison Tenarai loses.</li>
        <li><strong>Not "cheaper offshore."</strong> FPT owns that story in Korea and owns it well.</li>
      </ul>
    </div>
    <div class="card sp3">
      <h4>What we do claim</h4>
      <ul class="clean olive">
        <li><strong>Legacy modernisation that finishes.</strong> Tenarai-Archer against bank and insurance core systems — where over KRW 2 trillion of Korean financial-sector IT tenders sit across 2026–2027.</li>
        <li><strong>Delivery capacity that exists today.</strong> Hybrid Agentic PODs against a talent shortage Korean employers cannot hire their way out of.</li>
        <li><strong>Data residency that survives the AI Basic Act.</strong> A Korean entity, a domestic representative, and the ability to integrate sovereign models like K-EXAONE for clients who require Korea-based handling.</li>
      </ul>
    </div>
  </div>

  <h4 class="sub">The buying committee — who the marketing actually has to reach</h4>
  <div class="tw">
    <table>
      <caption>Korean enterprise buying committee for a modernisation or managed-capacity engagement. Roles are structural to Korean large-enterprise IT organisations.</caption>
      <thead><tr><th>Role</th><th>What they are afraid of</th><th>What convinces them</th><th>Where marketing reaches them</th></tr></thead>
      <tbody>
        <tr><td><strong>CIO / IT 본부장</strong><br>Economic buyer</td><td>Choosing an unproven foreign vendor and owning the failure personally</td><td>Analyst listings, named references, a physical Korean office, a Korean advisory board member</td><td>Analyst relations, OOH in the executive corridor, peer referral, executive roundtables</td></tr>
        <tr><td><strong>Head of DX / AI TF장</strong><br>Champion</td><td>Being handed a mandate with no capacity to deliver it</td><td>Working PoCs, a delivery model that doesn't require them to hire</td><td>Webinars, technical events, partner co-sell, LinkedIn</td></tr>
        <tr><td><strong>구매 / 벤더 심사팀</strong><br>Gatekeeper</td><td>Procedural risk — an unregistered vendor, a compliance gap</td><td>Vendor registration completeness, AI Basic Act domestic representative, financial standing</td><td>Not reachable by marketing. Cleared by operations. <strong>This is why §8 exists.</strong></td></tr>
        <tr><td><strong>Senior architects / PL</strong><br>Technical influencer</td><td>Being handed a vendor whose engineers they have to teach</td><td>Technical depth in public — talks, open-source, honest engineering writing</td><td>Developer media, communities, IT Builders Live, GitHub</td></tr>
      </tbody>
    </table>
  </div>
  <p class="tnote">The gatekeeper row is the one most marketing plans quietly skip. In Korean large enterprises the vendor-registration screen kills more foreign vendors than any competitive loss does, and no amount of brand spend clears it. It is listed here so the plan does not take credit for an outcome it cannot influence.</p>

  <h4 class="sub">Message architecture</h4>
  <div class="bento">
    <div class="card sp2"><h4>Brand line (corporate image)</h4><p><strong>"AI가 멈춘 곳에서 시작합니다."</strong><br><span style="font-size:13.5px;color:var(--ink-faint);">"We start where the AI demo stops."</span></p><p>Used in OOH, employer brand, and the corporate film. Deliberately not a product claim — its job is recognition and stance, not conversion.</p></div>
    <div class="card sp2"><h4>Commercial line (demand)</h4><p><strong>"레거시는 옮겨야 끝납니다."</strong><br><span style="font-size:13.5px;color:var(--ink-faint);">"A legacy system isn't done until it's moved."</span></p><p>Used in Archer campaigns, tender-adjacent content, partner co-sell material. Names the job, not the technology.</p></div>
    <div class="card sp2"><h4>Talent line (capacity)</h4><p><strong>"사람을 더 뽑지 않아도 됩니다."</strong><br><span style="font-size:13.5px;color:var(--ink-faint);">"You don't have to hire more people."</span></p><p>Used for Hybrid Agentic PODs. Directly addresses the shortage Korean IT leaders report and cannot solve locally.</p></div>
    <div class="card rust sp6">
      <h4>Copy discipline — three rules, no exceptions</h4>
      <p><strong>1. Korean-first, not Korean-translated.</strong> Every asset is written in Korean by a Korean copywriter and back-checked against the English, never machine-translated from HQ decks. A translated tagline reads as a translated company.</p>
      <p><strong>2. No unverifiable performance claims in Korea.</strong> Tenarai's global marketing carries figures like "80% time reduction" and "3–4× throughput" that are self-reported with no third-party validation. Korean enterprise buyers and the trade press treat unsourced vendor numbers harshly. In Korea these appear only with a named client and a stated measurement basis, or not at all.</p>
      <p><strong>3. Say "아직 없습니다" out loud.</strong> The plan's most distinctive asset is that Tenarai is new in Korea. Pretending otherwise is both detectable and boring. Owning it is the basis of the entire creative platform in §6.</p>
    </div>
  </div>
</section>

<!-- ================= 04 US PLAYBOOK ================= -->
<section id="s4">
  <span class="sec-no">04 — The Existing Playbook</span>
  <h2>What Tenarai already runs, and what survives the trip to Korea</h2>
  <p class="lede">Tenarai's global marketing since the April 2026 rebrand is not a blank slate. Seven programmes are already funded and running. Porting them is cheaper than inventing Korean equivalents — but three of the seven do not transfer, and saying so is more useful than pretending they do.</p>

  <div class="tw">
    <table>
      <caption>Transfer assessment of existing global marketing programmes.</caption>
      <thead><tr><th style="min-width:180px">Existing programme</th><th>What it does globally</th><th>Korea verdict</th></tr></thead>
      <tbody>
        <tr>
          <td><strong>Technology partner ecosystem</strong><br>Databricks, Microsoft, AWS, Adobe, Google Cloud, Salesforce</td>
          <td>Co-sell, co-marketing, borrowed enterprise credibility</td>
          <td><span class="pill p-conf">Port first — Month 1</span><br>Highest-leverage transfer in the entire plan. Each partner has a Korean subsidiary with existing enterprise relationships and a partner-marketing budget Tenarai can access without spending its own. The Revenue Plan already books 25% of Year-10 revenue here; nothing else converts a zero-reputation position into meetings this fast.</td>
        </tr>
        <tr>
          <td><strong>Analyst relations</strong><br>Everest Group "Top 50 Engineering Services" listing <span class="pill p-ver">self-announced; not independently confirmed</span></td>
          <td>Third-party validation for enterprise procurement</td>
          <td><span class="pill p-conf">Port and prioritise — Month 6</span><br>Korean conglomerate vendor screening treats Gartner / IDC / Everest coverage as a credibility gate rather than a nice-to-have. Briefings with IDC Korea and Gartner Korea should start a full year earlier than the Revenue Plan's "Years 3–5" schedule, because the analyst calendar has a 6–12 month lag before coverage appears.</td>
        </tr>
        <tr>
          <td><strong>IT Builders Live</strong><br>Technical community event (Montevideo, Sep 2026)</td>
          <td>Developer-facing technical event, no sales pitch</td>
          <td><span class="pill p-conf">Port as the engine — Month 14</span><br>The single most efficient channel in the Korean B2B benchmark data is webinars / seminars / conferences: used by 44% of Korean B2B firms overall, yet ranked several places higher on effectiveness than on usage — the largest efficiency gap in the dataset. A ported <strong>IT Builders Live Seoul</strong> is simultaneously a lead source, an earned-media asset, an employer-brand asset, and the content engine for a year of clips. See §6.</td>
        </tr>
        <tr>
          <td><strong>Board and leadership signalling</strong><br>Shashank Samant appointment, April 2026</td>
          <td>Credibility through people rather than claims</td>
          <td><span class="pill p-conf">Port, adapted — Month 3</span><br>Korea-specific version: recruit one Korean advisory board member with large-enterprise CIO or CTO tenure. In a market where the economic buyer's core fear is personal exposure for choosing an unknown foreign vendor, a familiar Korean name on the masthead does more than any campaign. <strong>Lowest cost, highest leverage single move in this plan.</strong></td>
        </tr>
        <tr>
          <td><strong>Academic partnerships</strong><br>NIT Delhi MoU, BITS Pilani</td>
          <td>Talent pipeline and employer brand</td>
          <td><span class="pill p-est">Port, adapted — Month 24</span><br>Korean equivalents (KAIST, POSTECH, SNU AI graduate programmes) serve the employer-brand problem the Revenue Plan flags: a 50-person technical-sales org cannot be hired in Korea without a reason for people to join. But this is a Year-3 move — an academic MoU signed before there is a Korean office to place anyone in reads as a press release, not a programme.</td>
        </tr>
        <tr>
          <td><strong>Startup Acceleration Program</strong></td>
          <td>Ecosystem positioning, early-stage deal flow</td>
          <td><span class="pill p-ver">Defer past Month 36</span><br>Korea's startup ecosystem is crowded and heavily government-subsidised (TIPS, Pangyo, K-Startup). A foreign firm with no local brand adds nothing differentiated, and the audience is not the buying committee in §3. Skipped, deliberately.</td>
        </tr>
        <tr>
          <td><strong>The rebrand campaign itself</strong><br>Infogain → Tenarai, April 2026</td>
          <td>Global category reset; press pickup across Business Wire, Yahoo Finance, APAC and CXO trade media</td>
          <td><span class="pill p-est">Do not port</span><br>A rebrand narrative only works where the old brand had equity. In Korea, "Infogain" has none — there is no entity, no client, nothing to transition from. Running rebrand messaging in Korea spends the launch moment explaining a company nobody knew. <strong>Korea launches as a first-time introduction, not a relaunch.</strong> This is a genuine advantage: no legacy SI positioning to unlearn.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="callout">
    <p>Four programmes port, one adapts late, two are dropped. A plan that claimed all seven transfer would be easier to approve and worse to execute.</p>
  </div>
</section>

  <p class="lede">Korea's B2B channel hierarchy does not match the US one, and importing a US channel mix is the most common failure mode for foreign entrants. Two structural differences matter most: relationships outrank content, and Naver is not Google.</p>

  <h4 class="sub">Three consequences for the channel mix</h4>
  <div class="bento">
    <div class="card sp2 row2">
      <h4>1. Relationships beat reach — so buy relationships, not reach</h4>
      <p>"Existing network" being the top-ranked channel in a B2B market is a statement about how Korean enterprise procurement works. Tenarai has no Korean network, which means the only route in is <em class="q">borrowing someone else's</em>: partner subsidiaries (§4), a Korean advisory board member (§4), and the Korean subsidiaries of Tenarai's existing Fortune 500 accounts.</p>
      <p><strong>Open decision:</strong> whether any current Tenarai Fortune 500 client operates a Korean business unit has still not been checked against the internal account list. It is the fastest, cheapest validation step available and it remains open. See §13.</p>
    </div>
    <div class="card sp4">
      <h4>2. Naver is a different index, not a smaller Google</h4>
      <p>Korean search behaviour splits across Naver, Google, and — increasingly — LLM assistants. Naver privileges its own properties (blog, cafe, knowledge-in, news) over external domains, so a conventional English-language SEO programme produces almost no Korean visibility. The Korean content programme must be built <strong>inside</strong> Naver's surfaces (a Naver-indexed Korean technical blog, Naver Search Ad on tender-adjacent terms) rather than only on tenarai.com.</p>
      <p>Simultaneously, buyers increasingly research through ChatGPT and other assistants before contacting anyone — which makes answer-engine visibility a distinct workstream, not an SEO subtask. Both are covered in §9.</p>
    </div>
    <div class="card olive sp4">
      <h4>3. LinkedIn is real in Korea now — but it is a niche, and that is fine</h4>
      <p>LinkedIn's Korean audience is roughly <strong>6.0 million</strong> users as of July 2026, about 11.3% of the population, with the 25–34 band the largest at ~3 million — half the entire Korean user base. <span class="pill p-ver">Compiled from platform marketing APIs, not audited — treat as directional</span></p>
      <p>Six million is small next to KakaoTalk, and irrelevant next to it for consumer marketing. For this plan it is close to ideal: the people who maintain a Korean LinkedIn profile skew toward multinational-experienced, English-capable enterprise professionals — which is a near-exact description of the champion role in §3. LinkedIn is the primary owned-audience channel, led personally by the Korea Sales Director in Korean.</p>
    </div>
  </div>

  <h4 class="sub">Trade events — the one paid channel that clears its bar immediately</h4>

      <p>The next edition — <strong>AI EXPO KOREA 2027, 14–16 April 2027, COEX Hall A</strong>, the show's tenth anniversary — falls inside this plan's first year and is the single dated commitment in the Month 1–12 calendar. <span class="pill p-conf">Confirmed — organiser site</span></p>
      <p>The Revenue Plan schedules trade-show <em class="q">attendance</em> in Years 1–2 and exhibiting in Years 3–5. This plan agrees with the sequencing and adds one refinement: <strong>attend in Year 1 to run 30 pre-booked meetings, not to walk the floor.</strong> An exhibition booth without a reference story is an expensive way to be ignored next to 329 other exhibitors; a two-person team with a pre-booked calendar converts the same event into the cheapest meeting-density day of the year.</p>

<!-- ================= 06 PROGRAMME A: FAME ================= -->
<section id="s6">
  <span class="sec-no">06 — Programme A</span>
  <h2>Fame: the corridor takeover and the viral engine</h2>
  <p class="lede">This is the section the plan will be argued about. It proposes spending roughly three times the annual operating marketing budget in a single eight-week burst, on a medium with no click-through, aimed at a few thousand people. The argument for it is not reach. It is that in Korea, for a foreign vendor, physical visibility is a proxy for institutional permanence — and permanence is what the economic buyer in §3 is actually screening for.</p>

  <h4 class="sub">First, why not newspapers</h4>
  <div class="body">
    <p>The conventional corporate-image buy for a foreign B2B entrant in Korea is a full-page advertisement in the major dailies or the economic press. This plan rejects it, for three reasons that have nothing to do with cost:</p>
    <ul class="clean">
      <li><strong>It produces no artifact.</strong> A newspaper page is read once and recycled. A station wall is photographed, posted, and re-circulated by people who were not paid to circulate it. For a brand with zero awareness, the second-order distribution <em class="q">is</em> the value.</li>
      <li><strong>It signals the wrong category.</strong> Full-page daily-newspaper advertising in Korea is the visual grammar of conglomerates, banks, and public institutions making announcements. Tenarai using it would read as a company imitating incumbency it does not have — the exact impression §3 rule 3 forbids.</li>
      <li><strong>It cannot be targeted.</strong> There is no daily-newspaper buy that concentrates against "enterprise IT decision-makers in the Teheran-ro and COEX corridor." A station buy is, structurally, that targeting.</li>
    </ul>
    <p class="tnote">Comparative newspaper rate cards were not obtained for this plan. The argument above is made on mechanism, not price. <span class="pill p-ver">To verify if a paid-print option is formally evaluated</span></p>
  </div>

  <h4 class="sub">The corridor: why these stations, and no others</h4>
  <div class="body">
    <p>Seoul's subway carried 2.44 billion passengers in 2025, averaging 6.69 million a day across lines 1–8 — up 1.3% on 2024. Line 2 alone carries 1.99 million daily. But raw footfall is the wrong selection criterion here, and following it would put this campaign in the wrong stations.</p>

  <h4 class="sub">Why Month 20 and not Month 2</h4>
  <div class="callout">
    <p>Out-of-home with nothing to convert to is a donation. The burst is scheduled for the first month in which a Korean prospect who searches the name will find a registered entity, a Korean site, two named references, and an AE who can take the meeting.</p>
  </div>

  <h4 class="sub">The creative platform — built to be photographed</h4>
  <div class="body">
    <p>Korean subway advertising travels beyond the station when it does one of three things: tells an uncomfortable truth about working life, uses a format the reader did not expect, or changes between viewings. All five executions below are built on the §3 rule that Tenarai should say out loud that it is new here. The platform is <strong>"아직 없습니다" — "We don't have that yet."</strong></p>
  </div>

  <div class="bento">
    <div class="card sp3">
      <div class="ad-vis" style="border-radius:0;margin:-26px -28px 20px;">
        <span class="kr">Execution 01 · PSD, all stations</span>
        <p class="hl">"한국 고객사요?<br>아직 없습니다."</p>
        <p class="sl">"Korean clients? We don't have any yet.<br>3,374 engineers. 0 Korean references. We're starting here."</p>
      </div>
      <h4>The admission</h4>
      <p>The opening execution states the weakness the buying committee would discover anyway. In a medium saturated with superlatives, an unprompted admission of a gap is the most photographed thing on the platform.</p>
      <p class="why"><strong>Why it travels:</strong> Korean office workers screenshot advertising that says the thing companies are not supposed to say. It also disarms the single objection every AE will face in Month 21.</p>
    </div>
    <div class="card sp3">
      <div class="ad-vis" style="border-radius:0;margin:-26px -28px 20px;">
        <span class="kr">Execution 02 · PSD, Seolleung + Pangyo</span>
        <p class="hl">"구인: 1998년에 만든<br>배치 스크립트를<br>읽을 수 있는 사람."</p>
        <p class="sl">"Wanted: someone who can read a batch script written in 1998. We have 3,374 of them. It still isn't enough."</p>
      </div>
      <h4>The job posting that isn't</h4>
      <p>Formatted exactly like a Korean recruitment ad, down to the typography. It is a capability claim disguised as a hiring notice — and it doubles as an actual recruitment asset for the employer-brand programme in §8.</p>
      <p class="why"><strong>Why it travels:</strong> developer communities re-post recruitment ads reflexively. The format buys distribution the media plan did not pay for.</p>
    </div>
    <div class="card sp2">
      <div class="ad-vis" style="border-radius:0;margin:-26px -28px 20px;min-height:150px;">
        <span class="kr">Execution 03 · Large panel, Samseong</span>
        <p class="hl" style="font-size:21px;">"SAS 배치<br>(1998–2029)"</p>
        <p class="sl">"Survived by 200 engineers who still work weekends."</p>
      </div>
      <h4>The legacy obituary</h4>
      <p>A memorial notice for a system, not a person. Dark, specific, and instantly legible to anyone who has maintained one.</p>
      <p class="why"><strong>Risk noted:</strong> obituary formats carry real cultural weight in Korea. This execution requires Korean creative sign-off and a named approver. It ships only if that approval is unambiguous.</p>
    </div>
    <div class="card sp2">
      <div class="ad-vis" style="border-radius:0;margin:-26px -28px 20px;min-height:150px;">
        <span class="kr">Execution 04 · Digital signage, COEX</span>
        <p class="hl" style="font-size:21px;">이번 분기<br>옮긴 레거시<br><span class="ad-count" style="font-family:var(--mono);font-size:32px;">10,412</span></p>
        <p class="sl">Updated daily. Yes, really.</p>
      </div>
      <h4>The live counter</h4>
      <p>A digital face showing a real, daily-updating count of legacy artifacts migrated by Tenarai globally, fed from delivery systems.</p>
      <p class="why"><strong>Why it travels:</strong> a number that changes is worth re-photographing. It is also the only execution that literally demonstrates the product, and it makes the OOH buy a live integration case study.</p>
    </div>
    <div class="card sp2">

        <span class="kr">Execution 05 · PSD, Gangnam + Samseong</span>

        <p class="sl">Tenarai. Enterprise AI, all the way to production.</p>
      </div>
      <h4>The brand line</h4>
      <p>One in five faces carries the plain brand statement with no joke and no admission. The platform needs a resting note or it reads as a stunt rather than a company.</p>
      <p class="why"><strong>Ratio discipline:</strong> 4 tactical executions to 1 brand execution. Inverting that ratio is how OOH campaigns become forgettable.</p>
    </div>

  <h4 class="sub">The viral engine — what carries it past the station</h4>
  <div class="body">
    <p>Out-of-home alone decays the day it comes down. Five mechanisms extend it, all of them earned rather than paid:</p>
    <ul class="clean">
      <li><strong>IT Builders Live Seoul (Month 14, before the burst).</strong> Tenarai's existing technical-event format, ported. Free, genuinely technical, no sales pitch, filmed in full. This runs <em class="q">six months before</em> the OOH so that when the name appears on a wall, a searchable body of Korean-language technical content already sits behind it. It is also the highest-efficiency channel in the Korean benchmark data (§5).</li>
      <li><strong>Korea Sales Director personal channel.</strong> Weekly Korean-language LinkedIn posting by the Korea Sales Director, starting Month 3. Founder- and executive-led posting is the documented pattern behind Korean B2B brand building at small scale, and it costs nothing but discipline. The Sales Director's job description must say so explicitly or it will not happen.</li>
      <li><strong>Developer and IT media placement.</strong> Korean IT trade press and specialist newsletters — not general dailies. As one reference point, a leading Korean IT newsletter reports roughly 44,000 subscribers at a 10–15% open rate <span class="pill p-est">Estimated</span>: small, but composed almost entirely of the §3 champion and technical-influencer roles.</li>
      <li><strong>Community seeding, done honestly.</strong> Korean developer and professional communities punish detectable astroturfing severely, and a foreign brand caught doing it loses more than the campaign. Rule: Tenarai employees post under their real names with disclosure, or Tenarai does not post.</li>
      <li><strong>The making-of film.</strong> A short documentary of the campaign itself — writing an ad that admits you have no clients — released the week the burst ends. Campaign-about-the-campaign content is the cheapest way to buy a second news cycle from one media spend.</li>
    </ul>
  </div>

  <div class="bento">
    <div class="card ink sp6">
      <h4>The honest counter-argument, stated plainly</h4>
      <p>An 8-week station buy for a firm that needs 13 new logos a year is not defensible on reach economics, and no amount of CPM arithmetic will make it so. It is defensible on one specific mechanism: <strong>in Korea, a foreign vendor with no physical presence fails the "is this company real" screen before it reaches a commercial evaluation, and there is no cheaper instrument that clears that screen with the executive population concentrated in this corridor.</strong> If HQ does not accept that mechanism, Scenario C in §10 is the correct choice and this section should be cut rather than trimmed. A half-funded OOH burst is worse than none.</p>
    </div>
  </div>
</section>

<!-- ================= 07 PROGRAMME B: DEMAND ================= -->
<section id="s7">
  <span class="sec-no">07 — Programme B</span>
  <h2>Demand: account-based, because there are only forty accounts</h2>
  <p class="lede">The Revenue Plan targets 45 active accounts at Year 10 and 13 new logos in that year. A named-account universe that small makes broad demand generation the wrong instrument and account-based marketing the only rational one.</p>

  <h4 class="sub">The account universe</h4>
  <div class="tw">
    <table>
      <caption>Tier structure for the Korean named-account list. Tiering follows the Revenue Plan's vertical priorities; specific account assignment is an operating decision, not a marketing one.</caption>
      <thead><tr><th>Tier</th><th>Definition</th><th class="num">Accounts</th><th>Marketing treatment</th></tr></thead>
      <tbody>
        <tr><td><strong>Tier 1 — Anchor</strong></td><td>Financial-sector core-modernisation buyers and the three telcos. The KRW 2T+ tender pool sits here.</td><td class="num">~12</td><td>One-to-one. Bespoke research briefs, named-executive content, custom event invitations, individual OOH proximity targeting during the burst.</td></tr>
        <tr><td><strong>Tier 2 — Growth</strong></td><td>Retail/CPG groups, insurers, healthcare systems matching Tenarai's stated verticals.</td><td class="num">~40</td><td>One-to-few. Vertical clusters of 5–8 accounts sharing a campaign theme and a webinar.</td></tr>
        <tr><td><strong>Tier 3 — Programmatic</strong></td><td>Korean subsidiaries of Tenarai's existing global Fortune 500 accounts.</td><td class="num">Unknown <span class="pill p-ver">Blocking</span></td><td>One-to-many, warm. Cheapest possible entry — but the account list has not been checked. See §13.</td></tr>
        <tr><td><strong>Excluded</strong></td><td>Semiconductor and automotive manufacturing</td><td class="num">—</td><td>Not pursued. Neither is among Tenarai's stated core industries, and Wipro's HARMAN DTS acquisition already holds the automotive SDV position. Marketing should not manufacture demand the delivery organisation is not built to serve.</td></tr>
      </tbody>
    </table>
  </div>

  <h4 class="sub">The Korean intent signal — the strongest idea in this plan</h4>
  <div class="body">
    <p>Western intent-data providers (6sense, Demandbase, Bombora) resolve buying signals from cookie and IP activity across Western publisher networks. Their coverage of Korean-domain activity is thin, and buying one of them for Korea would be paying enterprise pricing for a sparse signal. <span class="pill p-est">Estimated — vendor-specific Korean coverage should be tested before any purchase</span></p>
    <p>Korea, however, publishes more structured buying intent in public than almost any comparable market:</p>
    <ul class="clean">
      <li><strong>KONEPS / 나라장터 tender notices</strong> — public-sector and public-institution IT procurement, published with scope, budget and timeline. This is not a proxy for intent; it <em class="q">is</em> intent, with a delivery date attached.</li>
      <li><strong>DART disclosures</strong> — Korea's mandatory corporate filing system. Capital expenditure decisions, new-subsidiary formation, and large system investments surface here before they surface anywhere else.</li>
      <li><strong>Enterprise hiring postings</strong> — a Korean bank posting for twelve core-banking migration engineers has announced a modernisation programme more reliably than any content-consumption signal would.</li>
      <li><strong>Regulatory calendars</strong> — the AI Basic Act's high-impact-AI obligations create dated compliance deadlines per industry, which are dated buying windows.</li>
    </ul>
    <p>All four are public, structured, and updated continuously. Turning them into an account-scored intent feed is an agent-orchestration problem — which is the product Tenarai sells.</p>
  </div>

  <div class="bento">
    <div class="card rust sp4">
      <h4>Build it on Tenarai-IGNIS, and the marketing cost becomes a reference</h4>
      <p>The Korea intent engine should be built on Tenarai's own agent-orchestration platform rather than bought. Three returns from one build: a Korea-specific signal no competitor has; a working IGNIS deployment with a measurable outcome, in a market where Tenarai has zero references; and a demonstrable answer to the question every Korean prospect will ask — <em class="q">"어디에 적용해 보셨나요?"</em> ("Where have you actually used this?")</p>
      <p><strong>This is the only line in the plan where marketing spend produces a sellable asset.</strong> It should be protected before anything else if the budget is cut.</p>
    </div>
    <div class="card sp2">
      <h4>Guardrails</h4>
      <ul class="clean" style="margin-bottom:0">
        <li>Public sources only. No scraping of gated or personal data.</li>
        <li>PIPA compliance reviewed by Korean counsel before launch, not after.</li>
        <li>Signals inform outreach targeting; they are never quoted back to a prospect.</li>
      </ul>
    </div>
  </div>

  <h4 class="sub">The demand motion, month by month</h4>
  <div class="tl">
    <div class="tl-row">
      <div class="when">Months 1–6<br><b>Foundation</b></div>
      <div>
        <h4>Be findable before being loud</h4>
        <ul class="clean">
          <li>Korean-language site live, indexed on Naver as well as Google, with the AI Basic Act domestic-representative disclosure visible — a compliance requirement that doubles as a credibility signal.</li>
          <li>Partner co-marketing motions opened with the Korean subsidiaries of Databricks, Google Cloud, Salesforce and Adobe. Target: 3 registered co-sell opportunities, matching the Revenue Plan's Stage 1 exit criteria.</li>
          <li>Named-account list built and tiered. Tier 3 blocker escalated to HQ (see §13).</li>
          <li>Korea Sales Director LinkedIn cadence begins. Weekly, in Korean.</li>
        </ul>
      </div>
    </div>
    <div class="tl-row">
      <div class="when">Months 7–14<br><b>Signal</b></div>
      <div>
        <h4>Turn public data into a meeting calendar</h4>
        <ul class="clean">
          <li>Korea intent engine v1 live on IGNIS: KONEPS + DART + hiring signals scored against the named-account list.</li>
          <li>Vertical webinar series launched — financial-sector modernisation first, telecom second. Two per quarter, partner-co-hosted where possible.</li>
          <li>AI EXPO KOREA 2027 (14–16 April 2027, COEX Hall A) attended with a pre-booked meeting calendar, not a booth.</li>
          <li>IT Builders Live Seoul, first edition (Month 14). Filmed in full; becomes the content library.</li>
        </ul>
      </div>
    </div>
    <div class="tl-row">
      <div class="when">Months 15–24<br><b>Convert</b></div>
      <div>
        <h4>Spend the awareness the moment it exists</h4>
        <ul class="clean">
          <li>OOH + viral burst (Month 20). Every AE sequence, every partner motion and every open Tier-1 account is re-touched during the burst window — the campaign's commercial value is almost entirely in this concurrency.</li>
          <li>Tier-1 one-to-one programmes running against all ~12 anchor accounts.</li>
          <li>First analyst briefings (IDC Korea, Gartner Korea) — a year ahead of the Revenue Plan's schedule, for the lag reasons in §4.</li>
        </ul>
      </div>
    </div>
    <div class="tl-row">
      <div class="when">Months 25–36<br><b>Compound</b></div>
      <div>
        <h4>Make the references do the selling</h4>
        <ul class="clean">
          <li>Quarterly Korean case study, each with named-client consent negotiated at contract signature rather than at publication.</li>
          <li>IT Builders Live Seoul becomes semi-annual; Pangyo edition added.</li>
          <li>Employer-brand programme scaled against the technical-sales hiring constraint (§8).</li>
          <li>Analyst report inclusion pursued; Everest Group Korea-relevant coverage targeted.</li>
        </ul>
      </div>
    </div>
  </div>
</section>

<!-- ================= 08 PROGRAMME C: CREDIBILITY ================= -->
<section id="s8">
  <span class="sec-no">08 — Programme C</span>
  <h2>Credibility: the unglamorous programme that decides the outcome</h2>
  <p class="lede">Fame gets the meeting. Credibility survives the procurement screen. In Korea the second one kills more foreign vendors than the first one saves, and it is almost entirely operational rather than creative.</p>

  <div class="bento">
    <div class="card sp3 row2">
      <h4>1. Analyst relations — start twelve months early</h4>
      <p>Korean conglomerate vendor screening treats Gartner, IDC and Everest Group coverage as a procedural credibility input. Analyst coverage has a 6–12 month lag from first briefing to appearing in a report, which means the Revenue Plan's "Years 3–5" schedule delivers coverage in Year 4 at the earliest — after the first vendor registrations are already being screened.</p>
      <p><strong>Recommendation: move first briefings to Month 6.</strong> Cost is analyst-relations time, not media spend, so this accelerates without touching the budget.</p>
    </div>
    <div class="card sp3">
      <h4>2. References — negotiate consent at signature</h4>
      <p>The Revenue Plan's Stage 1 exit criterion is 2 citable Korean references with named-client consent. Korean enterprises routinely refuse naming after the fact. <strong>Named-reference consent must be a clause in the first three contracts, negotiated by the AE at signature, not requested by marketing at publication.</strong> This is a contracting decision that marketing depends on and cannot make.</p>
    </div>
    <div class="card olive sp3">
      <h4>3. The Korean advisory board member</h4>
      <p>One appointment, recruited by Month 3. A Korean executive with large-enterprise CIO or CTO tenure, publicly named. Against a buying committee whose economic buyer fears personal exposure for choosing an unknown foreign vendor, this does more per won than any other line in the plan.</p>
    </div>
    <div class="card sp3">
      <h4>4. Employer brand — a commercial requirement, not HR's problem</h4>
      <p>The Revenue Plan needs 50 people in Korea by Year 10 and flags technical-sales hiring as a constraint. In Korea, employer reputation is also read by <em class="q">buyers</em> — a vendor nobody wants to work for is assumed to be a vendor nobody wants to buy from. Pangyo OOH, IT Builders Live and the Execution 02 recruitment format all serve this simultaneously, which is why it is funded here rather than separately.</p>
    </div>
    <div class="card sp3">
      <h4>5. Trade press, on a schedule</h4>
      <p>The Revenue Plan sets 2 Korean media placements in Years 1–2, 6/year in Years 3–5, 12/year thereafter. This plan accepts those targets and constrains the outlet mix: <strong>IT and enterprise-technology trade press only.</strong> General-daily business coverage is not pursued — it reaches the wrong audience and, per §6, signals the wrong category.</p>
    </div>
  </div>
</section>

<!-- ================= 09 MARTECH ================= -->
<section id="s9">
  <span class="sec-no">09 — Marketing Technology</span>
  <h2>The stack: three people cannot run this plan without it</h2>
  <p class="lede">The Korea entity has two marketing FTEs by Year 5 — a Marketing Lead from Year 2 and a Marketing Associate from Year 4 (Part II §06-1) — plus contract/agency support for specialist work. Every recommendation in this plan has to be executable by a team that small, which makes tooling a strategic rather than administrative decision. The test applied to each layer below is simple: does this let one person do the work of five, and does it work in Korean?</p>

  <div class="tw">
    <table>
      <caption>Recommended stack by layer. "Korea fit" is the differentiator — several category-leading Western tools degrade badly in this market.</caption>
      <thead><tr><th>Layer</th><th>Recommendation</th><th>Korea fit</th><th>When</th></tr></thead>
      <tbody>
        <tr>
          <td><strong>CRM + marketing automation</strong></td>
          <td>Salesforce + Account Engagement</td>
          <td>Strong. Salesforce Korea is already a named Tenarai partner, which makes the platform decision and the co-sell motion the same decision. Choosing a different CRM would weaken a channel worth 25% of Year-10 revenue.</td>
          <td>Month 1</td>
        </tr>
        <tr>
          <td><strong>Intent + account scoring</strong></td>
          <td><strong>Build on Tenarai-IGNIS</strong> — KONEPS, DART, hiring and regulatory feeds</td>
          <td>Decisive. Western intent vendors have thin Korean-domain coverage; Korean public data is unusually rich. Building it produces the reference case Tenarai does not otherwise have. See §7.</td>
          <td>Month 7</td>
        </tr>
        <tr>
          <td><strong>Professional-network reach</strong></td>
          <td>LinkedIn Sales Navigator + Ads, Korea-targeted</td>
          <td>Good within its niche. ~6.0M Korean users, skewed toward multinational-experienced professionals — a close match to the champion role in §3.</td>
          <td>Month 3</td>
        </tr>
        <tr>
          <td><strong>Korean search</strong></td>
          <td>Naver Search Ad + Naver-native content; Google Ads secondary</td>
          <td>Mandatory. Naver privileges its own properties over external domains, so Korean visibility has to be built inside Naver's surfaces rather than won by conventional SEO against tenarai.com.</td>
          <td>Month 4</td>
        </tr>
        <tr>
          <td><strong>Answer-engine visibility (AEO/GEO)</strong></td>
          <td>Structured Korean content designed for LLM retrieval; quarterly assistant-answer audit</td>
          <td>Emerging and under-served. Korean B2B buyers increasingly research through AI assistants before contacting any vendor. Being absent from those answers is the 2026 equivalent of being absent from page one — and almost no Korean B2B competitor is managing it yet.</td>
          <td>Month 8</td>
        </tr>
        <tr>
          <td><strong>Attribution</strong></td>
          <td>Pipeline-influence model, multi-touch, 18-month window</td>
          <td>Required by the sales cycle, not by preference. Last-click attribution on an 18-month enterprise cycle will attribute every win to the final demo and will recommend cancelling this entire plan. See §11.</td>
          <td>Month 6</td>
        </tr>
        <tr>
          <td><strong>Content production</strong></td>
          <td>Korean copywriter (contract) + AI-assisted drafting, human-finished</td>
          <td>Necessary compromise. Volume targets are unreachable for one marketer without AI assistance; publishing machine-translated Korean is a brand risk per §3. Draft with AI, finish with a native writer, always.</td>
          <td>Month 2</td>
        </tr>
        <tr>
          <td><strong>DOOH programmatic</strong></td>
          <td>Optional overlay on the Month-20 burst</td>
          <td>Situational. Programmatic DOOH runs at roughly KRW 3,000–15,000 CPM and can extend the burst into office-building and elevator inventory in the same corridor without a second fixed contract. Evaluate only if Scenario A is approved.</td>
          <td>Month 19</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="callout">
    <p>The stack has one non-negotiable: whatever is bought must work in Korean, on Naver, against Korean data. Category leadership in the US market is not evidence of any of those three.</p>
  </div>
</section>

<!-- ================= 11 MEASUREMENT ================= -->
<section id="s11">
  <span class="sec-no">11 — Measurement</span>
  <h2>How to know whether this worked, before the revenue arrives</h2>
  <p class="lede">Revenue in Year 1 is USD 0.07M. It cannot tell anyone whether the marketing is working. The measurement system therefore has to run almost entirely on leading indicators for the first two years — and it has to be agreed before the OOH burst, not after.</p>

  <div class="tw">
    <table>
      <caption>Measurement framework. The north star is deliberately not revenue.</caption>
      <thead><tr><th>Layer</th><th>Metric</th><th>Cadence</th><th>Standard / target</th></tr></thead>
      <tbody>
        <tr><td rowspan="2"><strong>North star</strong></td><td><strong>Qualified first meetings with a named decision-maker at a listed account</strong></td><td>Weekly</td><td>60 in Year 1, ~90 in Year 2, 120 in Year 3 — the Revenue Plan's own targets, which marketing exists to feed</td></tr>
        <tr><td>Why this and not MQLs</td><td>—</td><td>A 45-account universe makes volume metrics meaningless. One meeting at a Tier-1 anchor outweighs a hundred form fills.</td></tr>
        <tr><td rowspan="4"><strong>Brand health</strong><br><span style="color:var(--ink-faint);font-size:13px">the OOH burst is judged here</span></td><td>Unaided awareness among Korean enterprise IT decision-makers</td><td>Pre-burst and post-burst survey, n≈300</td><td>Baseline assumed ~0%. <strong>Any measurable unaided recall is a pass.</strong> Target 5–8% <span class="pill p-est">Estimated — no Korean category benchmark obtained</span></td></tr>
        <tr><td>Naver branded-search volume for "Tenarai" / "테나라이"</td><td>Monthly</td><td>Baseline from Month 1. The cleanest single OOH proxy available, and it costs nothing to instrument.</td></tr>
        <tr><td>AE meeting-acceptance rate</td><td>Monthly, pre/post</td><td>The commercially meaningful test: does a cold approach convert better during and after the burst than before it?</td></tr>
        <tr><td>Earned media reach and sentiment</td><td>Campaign window</td><td>Tracked, but not used as a primary success measure — earned reach is a means to the three metrics above.</td></tr>
        <tr><td rowspan="3"><strong>Pipeline</strong></td><td>Pipeline coverage ratio</td><td>Monthly</td><td>5.0× in Year 1 tapering to 4.0× — per the Revenue Plan's KPI table</td></tr>
        <tr><td>PoCs started</td><td>Monthly</td><td>3 in Year 1, 8 in Year 3. The Revenue Plan calls this the top metric for Years 1–3 and this plan agrees.</td></tr>
        <tr><td>Marketing-influenced pipeline (18-month window)</td><td>Quarterly</td><td>Multi-touch. Last-click attribution on this sales cycle is actively misleading — see §9.</td></tr>
        <tr><td><strong>Credibility</strong></td><td>Vendor registrations completed · analyst briefings held · named references secured</td><td>Quarterly</td><td>5+ registrations, 2 named references by end of Year 2 — the Revenue Plan's Stage 1 exit criteria, restated here because §8 is judged on them</td></tr>
      </tbody>
    </table>
  </div>

  <div class="bento">
    <div class="card rust sp6">
      <h4>The measurement commitment that has to be made in advance</h4>
      <p>The pre-burst brand-lift survey must be fielded in <strong>Month 18</strong>, two months before any media runs. A baseline collected after the campaign has started is not a baseline, and without one the entire Scenario-B spend becomes unfalsifiable. It is budgeted in §6 at KRW 8M for exactly this reason. <strong>If the survey is cut, cut the burst too — an unmeasurable brand spend of this size should not be approved in the first place.</strong></p>
    </div>
  </div>
</section>

<!-- ================= 12 ROADMAP + RACI ================= -->
<section id="s12">
  <span class="sec-no">12 — Roadmap &amp; Ownership</span>
  <h2>Who does what, and in which month</h2>
  <p class="lede">For Months 1–12, marketing is the Country Sales Director plus HQ support, before the Marketing Lead FTE joins in Year 2 (Month 13, Part II §06-1) and a Marketing Associate in Year 4. The roadmap below is sized for that build-out, not for a marketing department that exists from day one.</p>

  <div class="tw">
    <table>
      <caption>RACI. "HQ Marketing" is the existing global function; "Korea Sales Director" is the entity's Year-1 lead (Part II §06-1); "Marketing Lead" is the Year-2 FTE hire; "Contract" denotes Korean specialist contractors.</caption>
